function exactScreenSource(L,screenNo){const S=L.screens&&L.screens[screenNo-1],a=HARD_SOURCE_MAP[L.id]||[],fallback=L.src.map(k=>SOURCES[k][0]+' — '+SOURCES[k][1]).join(' • ');if(!S)return fallback;if(S.t==='quiz')return 'FORMATIVE | Quick Recall — separate from Final Assessment Bank • '+fallback;const pick=p=>a.find(x=>x.startsWith(p));if(S.t==='hero')return a[0]||fallback;if(S.t==='examfocus')return pick('SOURCE CHECK')||a[0]||fallback;if(S.t==='concept'){const ci=L.screens.slice(0,screenNo-1).filter(x=>x.t==='concept').length;return a[1+ci]||pick('SOURCE CHECK')||fallback}if(S.t==='flow')return pick('DERIVED FLOW')||pick('DIRECT')||fallback;if(S.t==='case')return pick('DERIVED CASE')||pick('SOURCE CHECK')||fallback;if(S.t==='pit')return pick('DERIVED PITFALL')||pick('SOURCE CHECK')||fallback;if(S.t==='source')return pick('SOURCE CHECK')||fallback;if(S.t==='summary')return pick('SUMMARY')||pick('SOURCE CHECK')||fallback;return pick('SOURCE CHECK')||fallback}

const HARD_C1U1=[
HQ('C1-U1-L01-F01','ข้อใดอธิบาย “โรคไม่ติดต่อเรื้อรัง (NCDs)” ตามเอกสารได้ถูกต้องที่สุด?',['เป็นโรคที่เกิดจากเชื้อและแพร่จากคนสู่คนเป็นหลัก','ไม่เกิดจากเชื้อเป็นหลัก ไม่แพร่จากคนสู่คน และมักดำเนินโรคค่อยเป็นค่อยไปจนเรื้อรัง','เป็นโรคที่พบเฉพาะผู้สูงอายุเท่านั้น','เป็นโรคทางพันธุกรรมทั้งหมดและพฤติกรรมไม่มีส่วนเกี่ยวข้อง'],1,'เอกสารนิยาม NCDs ว่าไม่เกิดจากเชื้อ ไม่แพร่จากคนสู่คน และมีการดำเนินโรคค่อยเป็นค่อยไป/เรื้อรัง','NCD p.3','Understand','1.1.1'),
HQ('C1-U1-L01-F02','ชุดใดประกอบด้วย 4 กลุ่มโรค NCDs หลักตามเอกสาร?',['โรคหัวใจและหลอดเลือด มะเร็ง โรคทางเดินหายใจเรื้อรัง และเบาหวาน','โรคไตเรื้อรัง วัณโรค ไข้เลือดออก และเบาหวาน','โรคหัวใจและหลอดเลือด โรคตับอักเสบ มะเร็ง และโรคติดเชื้อทางเดินหายใจ','เบาหวาน ความดันโลหิตสูง ไข้หวัดใหญ่ และโรคข้อเสื่อม'],0,'เอกสารระบุ 4 กลุ่มหลัก ได้แก่ cardiovascular diseases, cancers, chronic respiratory diseases และ diabetes mellitus','NCD p.5','Remember','1.1.1'),
HQ('C1-U1-L01-F03','ข้อใดสะท้อนความหมายของคำว่า “chronic” ได้เหมาะสมที่สุดตามกรอบในบทเรียน?',['หมายถึงโรคที่อาการรุนแรงเสมอ','หมายถึงโรคที่ไม่มีทางควบคุมได้','หมายถึงลักษณะการดำเนินโรคที่ต่อเนื่องยาวนาน ไม่ได้ใช้บอกความรุนแรงเพียงอย่างเดียว','หมายถึงโรคที่ต้องนอนโรงพยาบาลเท่านั้น'],2,'สไลด์เปรียบเทียบ acute/subacute/chronic เพื่อสื่อ time course; chronicity ไม่ใช่คำแทน severity','NCD p.4','Understand','1.1.1'),
HQ('C1-U1-L01-F04','ชายอายุ 52 ปีเป็นเบาหวาน 8 ปีและความดันโลหิตสูง 6 ปี ยังไม่มีอาการทางไต แนวคิดใดเหมาะสมที่สุด?',['ยังไม่ต้องประเมินไตจนกว่าจะมีบวม','ควรประเมินความเสี่ยงและโรคไต เพราะ DM/HT เป็นกลุ่มเสี่ยงและโรคเรื้อรังอาจดำเนินโดยไม่มีอาการชัด','ประเมินเฉพาะเมื่อปัสสาวะเป็นเลือด','ควรส่งฟอกไตทันทีเพราะเป็นเบาหวานมานาน'],1,'NCD source แสดง HT/DM เป็นปัจจัยเสี่ยงสำคัญ และ Service Plan แนะนำการประเมินโรคไตในกลุ่มเสี่ยง','NCD p.12 + Service Plan p.16','Apply','1.1.1'),
HQ('C1-U1-L02-F01','เมื่อประเมิน “ภาระโรค” ของ NCDs เหตุใดจึงไม่ควรดูจำนวนผู้เสียชีวิตเพียงอย่างเดียว?',['เพราะ NCDs ไม่ทำให้เกิดความพิการ','เพราะภาระโรครวมผลจากการเสียชีวิตก่อนเวลาและการมีชีวิตอยู่กับความพิการ/เจ็บป่วย','เพราะจำนวนผู้เสียชีวิตไม่มีความเกี่ยวข้องกับระบบสุขภาพ','เพราะภาระโรคใช้เฉพาะค่าใช้จ่ายทางการแพทย์'],1,'แนวคิด DALY รวมทั้ง years of life lost และ years lived with disability','NCD p.11','Understand','1.1.1'),
HQ('C1-U1-L02-F02','ตามเอกสาร ช่วงอายุที่ใช้กล่าวถึง premature mortality จาก NCDs คือข้อใด?',['0–18 ปี','18–29 ปี','30–70 ปี','มากกว่า 80 ปีเท่านั้น'],2,'สไลด์ premature mortality ใช้กรอบอายุ 30–70 ปี','NCD p.8','Remember','1.1.1'),
HQ('C1-U1-L02-F03','DALY ประกอบด้วยองค์ประกอบใด?',['YLL + YLD','BMI + BP','Incidence + prevalence เท่านั้น','Cost + reimbursement'],0,'DALY = Years of Life Lost (YLL) + Years Lived with Disability (YLD)','NCD p.11','Remember','1.1.1'),
HQ('C1-U1-L02-F04','ข้อใดอธิบายผลกระทบทางเศรษฐกิจของ NCDs ได้ครบถ้วนที่สุดตามเอกสาร?',['มีเฉพาะค่ารักษาพยาบาลโดยตรง','มีเฉพาะการสูญเสียผลิตภาพแรงงาน','มีทั้งค่ารักษาพยาบาลโดยตรง การขาดงาน/สูญเสียผลิตภาพ ผลต่อ GDP และแรงกดดันต่องบสาธารณะ','ไม่มีผลต่อการจัดสรรงบประมาณของประเทศ'],2,'เอกสารเชื่อม NCDs กับ direct medical cost, productivity loss, GDP และ crowding-out ของงบสาธารณะ','NCD p.20','Analyze','1.1.1'),
HQ('C1-U1-L03-F01','ข้อใดเป็น “4 ปัจจัยเสี่ยงเชิงพฤติกรรมหลัก” ตามเอกสาร?',['สูบบุหรี่ ดื่มแอลกอฮอล์แบบอันตราย อาหารไม่เหมาะสม และขาดกิจกรรมทางกาย','ความดันสูง น้ำตาลสูง ไขมันสูง และอ้วน','อายุ เพศ พันธุกรรม และความยากจน','เบาหวาน CKD มะเร็ง และ COPD'],0,'เอกสารจัด tobacco, harmful alcohol, unhealthy diet และ physical inactivity เป็น behavioral risk factors','NCD p.14','Remember','1.1.2'),
HQ('C1-U1-L03-F02','ข้อใดเป็นกลุ่ม “ปัจจัยเสี่ยงทางสรีรวิทยา/เมตาบอลิก” ตามเอกสาร?',['การสูบบุหรี่ การดื่มสุรา อาหาร และ inactivity','ความดันโลหิตสูง น้ำตาลในเลือดสูง ไขมันในเลือดสูง และน้ำหนักเกิน/อ้วน','อายุ เพศ และพันธุกรรม','ความยากจน การศึกษา และความเครียด'],1,'สไลด์ metabolic risks ระบุ raised BP, raised glucose, raised lipids และ overweight/obesity','NCD p.17','Remember','1.1.2'),
HQ('C1-U1-L03-F03','หญิงคนหนึ่งมีประวัติครอบครัวเป็นเบาหวาน การศึกษาน้อย รายได้จำกัด และมีความเครียดจากงาน ข้อใดจำแนกข้อมูลได้ถูกต้องที่สุด?',['ทั้งหมดเป็น behavioral risk','ประวัติครอบครัวเป็นปัจจัยที่ปรับไม่ได้ ส่วนการศึกษา รายได้ และความเครียดเป็น social determinants','ทั้งหมดเป็น metabolic risk','การศึกษาและรายได้เป็นปัจจัยทางพันธุกรรม'],1,'เอกสารแยก genetics/age/sex เป็น unmodifiable และ poverty/education/health literacy/stress เป็น social determinants','NCD p.19','Apply','1.1.2'),
HQ('C1-U1-L03-F04','ผู้ป่วยมี obesity, ความดันสูง, นั่งทำงานทั้งวัน และมีข้อจำกัดด้านรายได้ แนวทางใดสอดคล้องกับกรอบปัจจัยเสี่ยงในเอกสารมากที่สุด?',['ให้คำแนะนำลดน้ำหนักอย่างเดียว','จัดการทั้งพฤติกรรมและ metabolic risk พร้อมประเมินอุปสรรคทางสังคมที่ทำให้เปลี่ยนพฤติกรรมยาก','ระบุว่าเป็นปัญหาพันธุกรรมจึงแก้ไม่ได้','รอให้เกิดโรคแทรกซ้อนก่อนจึงเริ่ม intervention'],1,'risk factors ในเอกสารอยู่หลายระดับ จึงควรจัดการทั้งพฤติกรรม สรีรวิทยา และ social determinants','NCD pp.14–19','Analyze','1.1.2'),
HQ('C1-U1-L04-F01','ข้อใดเป็นตัวอย่างมาตรการ “Best Buys”/policy approach ที่สอดคล้องกับเอกสารมากที่สุด?',['เพิ่มจำนวนเตียง ICU เป็นหลัก','ควบคุมยาสูบและแอลกอฮอล์ ปรับนโยบายอาหาร/น้ำตาล และสร้างสิ่งแวดล้อมที่เอื้อต่อกิจกรรมทางกาย','รณรงค์ให้ประชาชนตรวจ MRI ทุกปี','รักษาโรคเมื่อมีอาการโดยไม่เน้นป้องกัน'],1,'เอกสาร Best Buys ครอบคลุม tobacco, alcohol, diet และ physical activity ด้วยมาตรการเชิงนโยบาย/สิ่งแวดล้อม','NCD p.26','Understand','1.1.2'),
HQ('C1-U1-L04-F02','ชุดนโยบายใดสอดคล้องกับตัวอย่างยุทธศาสตร์ประเทศไทยในเอกสาร?',['แผนยุทธศาสตร์ NCDs + ภาษีเครื่องดื่มหวาน + ลดเค็ม + อสม.ในชุมชน','เพิ่มยาเฉพาะทางอย่างเดียว','ยกเลิกการคัดกรองในชุมชนและรวมบริการที่โรงพยาบาลใหญ่','ใช้มาตรการรักษาโดยไม่มีการปรับสิ่งแวดล้อมหรือพฤติกรรม'],0,'สไลด์ประเทศไทยยกตัวอย่าง national NCD strategy, sugar-sweetened beverage tax, sodium reduction และ อสม.ในชุมชน','NCD p.27','Remember','1.1.2'),
HQ('C1-U1-L04-F03','ข้อใดอธิบาย “ความรอบรู้ด้านสุขภาพ” ตามแผนปฏิรูปได้ดีที่สุด?',['การได้รับแผ่นพับสุขภาพจำนวนมาก','ความสามารถเข้าถึง เข้าใจ ประเมิน และนำข้อมูล/บริการสุขภาพไปใช้ตัดสินใจดูแลตนเองและครอบครัว','ความสามารถจดจำชื่อโรคได้ทุกโรค','การใช้แอปสุขภาพโดยไม่จำเป็นต้องเข้าใจข้อมูล'],1,'แผนปฏิรูประบุ access, understand, evaluate และ apply/use information/services เพื่อการตัดสินใจสุขภาพ','Health Reform p.6','Understand','1.1.2'),
HQ('C1-U1-L04-F04','จังหวัดหนึ่งทำ campaign ให้ความรู้เรื่อง NCD ต่อเนื่อง แต่ระบบ P&P ยังอ่อนแอ แนวทางใดสอดคล้องกับแผนปฏิรูปมากที่สุด?',['เพิ่มแผ่นพับอย่างเดียว','พัฒนาระบบ P&P ทั้งโครงสร้างการทำงาน งบประมาณ กฎหมาย กำลังคน และโครงสร้างพื้นฐาน','ยุติงานป้องกันและย้ายงบไปการรักษาทั้งหมด','ให้ประชาชนรับผิดชอบความเสี่ยงด้วยตนเองโดยไม่ปรับระบบ'],1,'แผนปฏิรูปกำหนดการพัฒนา P&P ครบทั้ง structure, budget, law, workforce และ infrastructure','Health Reform p.6','Analyze','1.1.2'),
HQ('C1-U1-L05-F01','ในผู้ป่วยกลุ่มเสี่ยงต่อ CKD แนวทางคัดกรองใดสอดคล้องกับ Service Plan มากที่สุด?',['ตรวจ eGFR อย่างเดียว','ตรวจ UACR อย่างเดียว','ประเมินทั้ง eGFR และ UACR/albuminuria เพื่อครอบคลุม filtration และ kidney damage','รอมี edema ก่อนจึงตรวจ'],2,'สไลด์ระบุว่าการใช้ eGFR หรือ UACR เดี่ยวอาจพลาดผู้ป่วยบางส่วน และเสนอ combined screening','Service Plan p.18','Apply','1.1.3'),
HQ('C1-U1-L05-F02','ข้อใดเป็นหลักสำคัญในการยืนยัน “ความเรื้อรัง” ของความผิดปกติทางไตตาม Service Plan?',['ผิดปกติครั้งเดียวถือเป็น CKD ทันที','มีหลักฐานความผิดปกติต่อเนื่องอย่างน้อย 3 เดือน','ต้องมีอาการบวมเท่านั้น','ต้องมี eGFR <15 เท่านั้น'],1,'Service Plan ระบุประเมิน chronicity จากหลักฐานว่าความผิดปกติคงอยู่อย่างน้อย 3 เดือน','Service Plan p.16','Remember','1.1.3'),
HQ('C1-U1-L05-F03','การตรวจ albuminuria เบื้องต้นในผู้ใหญ่ตามสไลด์ Service Plan ควรเลือกข้อใดเป็นลำดับแรก?',['24-hour urine protein ในทุกคน','Urine ACR และหากเป็นไปได้ใช้ first-void morning midstream sample','Urine glucose อย่างเดียว','Serum albumin แทน urine test'],1,'Practice point ในสไลด์ให้ urine ACR เป็นลำดับแรก และระบุ first-void morning midstream sample เป็น preferred sample','Service Plan p.17','Remember','1.1.3'),
HQ('C1-U1-L05-F04','ข้อใดเป็นองค์ประกอบครบของ “Ideal CKD Clinic Model” ตามเอกสาร?',['CKD Registry + Integrated MDT Care + Educational Program + Community Network','Nephrologist + Dialysis machine + ICU + Pharmacy เท่านั้น','Laboratory + Imaging + Surgery + Ward','Screening + Admission + Dialysis + Discharge โดยไม่มี registry'],0,'Ideal CKD Clinic Model ประกอบด้วย registry, multidisciplinary integrated care, education และ community network','Service Plan p.23','Remember','1.1.3'),
HQ('C1-U1-L06-F01','ข้อใดเป็นทีมสหสาขาวิชาชีพที่ปรากฏในโครงสร้าง Thai MDT ของ Service Plan?',['แพทย์ พยาบาล เภสัชกร นักโภชนาการ และนักกายภาพบำบัด','แพทย์และพยาบาลเท่านั้น','นักบัญชี วิศวกร เภสัชกร และพยาบาล','แพทย์ นักกฎหมาย และนักเศรษฐศาสตร์เท่านั้น'],0,'สไลด์ Anatomy of the Thai MDT แสดง doctor, nurse, pharmacist, dietitian และ physical therapist','Service Plan p.26','Remember','1.1.3'),
HQ('C1-U1-L06-F02','บทบาทใดสอดคล้องกับ Community Network ใน Service Plan มากที่สุด?',['ติดตามเยี่ยมบ้าน ประเมินความดัน/อาหาร และสร้างความตระหนักในชุมชน','ทำเฉพาะการผ่าตัด vascular access','ให้บริการ ICU ในทุกหมู่บ้าน','ติดตามเฉพาะเมื่อผู้ป่วยเริ่มฟอกไตแล้ว'],0,'สไลด์ community level ระบุ quarterly home visits, BP/diet monitoring และ awareness','Service Plan p.27','Understand','1.1.3'),
HQ('C1-U1-L06-F03','ลำดับใดสอดคล้องกับ CKD Patient Journey ในเอกสารมากที่สุด?',['เริ่ม dialysis → ประเมินความเสี่ยง → คัดกรอง → Shared Decision','ประเมินความเสี่ยง/คัดกรอง → CKD stage 1–4 ชะลอการเสื่อมและรักษาภาวะแทรกซ้อน → Shared Decision ใน advanced CKD → HD/PD/KT/Conservative care','รอ pulmonary edema → ใส่ CVC → จึงให้ความรู้เรื่อง CKD','ตรวจ UACR → ส่ง KT ทันทีในผู้ป่วยทุกคน'],1,'Patient Journey แสดงการประเมิน risk/ACR/eGFR ก่อนช่วง stage 1–4 และเข้าสู่ SDM ก่อน modality pathways','Service Plan p.28','Apply','1.1.3'),
HQ('C1-U1-L06-F04','ผู้ป่วย CKD ระยะก้าวหน้าที่ยัง stable ควรได้รับแนวทางใดเพื่อช่วยลดโอกาส “crash start” ตามเส้นทางการดูแลในเอกสาร?',['รอจนมี pulmonary edema แล้วจึงเริ่มอธิบายทางเลือก','ดำเนินการชะลอโรค/ดูแลภาวะแทรกซ้อน พร้อมเริ่ม Shared Decision และวางแผน RRT อย่างเหมาะสมก่อนภาวะฉุกเฉิน','เริ่ม HD ทันทีในผู้ป่วย CKD4 ทุกคนโดยไม่ประเมินบริบท','หยุดติดตามเพราะยังไม่มีอาการ uremia'],1,'Service Plan แยกช่วง slowing progression/complication care ออกจากช่วง SDM และ RRT preparation; planning ไม่เท่ากับ automatic dialysis start','Service Plan pp.28–30','Analyze','1.1.3')];

const HARD_C1U2=[
HQ('C1-U2-L01-F01','ข้อใดเป็นชุดปัญหาระบบสุขภาพที่เอกสารแผนปฏิรูปใช้เป็นเหตุผลสำคัญของการปฏิรูป?',['ภาระ NCD สูง ระบบแยกส่วน การกระจายทรัพยากรไม่เท่าเทียม ความรอบรู้สุขภาพไม่เพียงพอ และแรงกดดันด้านการเงิน','มีโรงพยาบาลมากเกินไปและไม่มีโรคเรื้อรัง','ประชาชนเข้าถึงบริการเท่าเทียมแล้วจึงไม่ต้องปรับระบบ','ปัญหาหลักมีเฉพาะการขาดเครื่องมือแพทย์'],0,'แผนปฏิรูปกล่าวถึงภาระ NCD/ภัยสุขภาพ ความไม่เป็นเอกภาพและทรัพยากรไม่เท่าเทียม health literacy ไม่เพียงพอ และแรงกดดันด้านสิทธิ/การเงิน','Health Reform p.2','Understand','2.1'),
HQ('C1-U2-L01-F02','ระบบสุขภาพที่พึงประสงค์ตามแผนปฏิรูปควรมีลักษณะใดมากที่สุด?',['ประชาชนมี health literacy และมีส่วนร่วม เข้าถึงบริการจำเป็นอย่างเท่าเทียม และระบบมีความเป็นเอกภาพ/ธรรมาภิบาล','รวมบริการทุกอย่างไว้ที่โรงพยาบาลตติยภูมิ','ให้แต่ละหน่วยทำงานแยกกันเพื่อเพิ่มความเร็ว','เน้นรักษาเมื่อป่วยและลดงานส่งเสริมป้องกัน'],0,'เอกสารวางภาพระบบที่ประชาชนมี health literacy/participation มี equitable access และระบบเป็นเอกภาพภายใต้ good governance','Health Reform pp.3–4','Understand','2.1'),
HQ('C1-U2-L01-F03','บทบาทของระบบข้อมูลสุขภาพอิเล็กทรอนิกส์ในแผนปฏิรูปคือข้อใด?',['เก็บข้อมูลเพื่อสถิติเท่านั้น','เชื่อมข้อมูลเพื่อการดูแล การส่งต่อ การบริหาร และการตัดสินใจระหว่างระดับบริการ','ใช้แทนบุคลากรทางคลินิกทั้งหมด','ใช้เฉพาะการเบิกจ่ายโดยไม่เกี่ยวกับ continuity'],1,'เป้าหมายด้าน IT ในแผนปฏิรูปเน้นข้อมูลสุขภาพส่วนบุคคลและการเชื่อมโยงข้อมูลเพื่อการดูแล/ส่งต่อ/บริหาร','Health Reform p.5','Apply','2.1'),
HQ('C1-U2-L01-F04','ข้อใดตรงกับ 4 พื้นที่ปฏิรูปหลักในเอกสารมากที่สุด?',['การบริหาร/ข้อมูล/กำลังคน; ระบบบริการรวม primary care/P&P; การคุ้มครองผู้บริโภคและ health literacy; การคลังสุขภาพ/UHC','การผ่าตัด; รังสีรักษา; ห้องปฏิบัติการ; เภสัชกรรม','โรงพยาบาลรัฐ; โรงพยาบาลเอกชน; คลินิก; ร้านยา','การรักษา; การวิจัย; การตลาด; การท่องเที่ยวสุขภาพ'],0,'แผนปฏิรูปจัดประเด็นเป็น governance/IT/workforce, service system, consumer/health literacy และ financing/UHC','Health Reform p.4','Remember','2.1'),
HQ('C1-U2-L02-F01','การปฏิรูปกำลังคนสุขภาพควรมองอะไรนอกเหนือจาก “จำนวนคน” ตามเอกสาร?',['การกระจายกำลังคนและสมรรถนะ/ความสามารถในการบริหารกำลังคน','สีเครื่องแบบของบุคลากร','จำนวนอาคารของโรงพยาบาลเท่านั้น','จำนวนผู้ป่วยโดยไม่ดูพื้นที่หรือทักษะ'],0,'เอกสารเน้นลดความเหลื่อมล้ำการกระจายกำลังคนและเพิ่มขีดความสามารถในการบริหารกำลังคน','Health Reform p.5','Understand','2.1'),
HQ('C1-U2-L02-F02','ระบบส่งเสริมสุขภาพและป้องกันโรค (P&P) ที่เข้มแข็งตามแผนปฏิรูปควรมีองค์ประกอบใด?',['โครงสร้างการทำงาน งบประมาณ กฎหมาย กำลังคน และโครงสร้างพื้นฐาน','การรณรงค์ประชาสัมพันธ์เพียงอย่างเดียว','ยารักษาโรคเพียงอย่างเดียว','การตรวจสุขภาพเฉพาะในโรงพยาบาลศูนย์'],0,'แผนปฏิรูปกำหนดการพัฒนา P&P ทั้ง structure, budget, law, workforce และ infrastructure','Health Reform p.6','Remember','2.1'),
HQ('C1-U2-L02-F03','ข้อใดอธิบาย health literacy ตามเอกสารได้เหมาะสมที่สุด?',['ความสามารถเข้าถึง เข้าใจ ประเมิน และนำข้อมูล/บริการสุขภาพไปใช้ตัดสินใจ','การรับเอกสารสุขศึกษาโดยไม่ต้องเข้าใจ','การจำชื่อยาได้ทุกชนิด','การใช้โทรศัพท์มือถือเพื่อสุขภาพเท่านั้น'],0,'แผนปฏิรูปนิยามองค์ประกอบเชิงความสามารถเป็น access-understand-evaluate-apply','Health Reform p.6','Understand','2.1'),
HQ('C1-U2-L02-F04','หลักคิดด้านความยั่งยืนของ UHC ตามแผนปฏิรูปคือข้อใด?',['ให้ประชาชนเข้าถึงบริการจำเป็นที่มีคุณภาพอย่างเท่าเทียม พร้อมรักษาระดับค่าใช้จ่ายที่การคลังประเทศรองรับได้','เพิ่มสิทธิทุกบริการโดยไม่ต้องพิจารณาทรัพยากร','ลดคุณภาพบริการเพื่อประหยัดงบเสมอ','ให้ผู้ป่วยทุกคนจ่ายเองเพื่อไม่ให้รัฐมีภาระ'],0,'เอกสารเชื่อม equitable access to necessary quality care กับ fiscal/financial sustainability','Health Reform p.7','Analyze','2.1'),
HQ('C1-U2-L03-F01','จังหวัดต้องการออกแบบ CKD Clinic ให้ตรงกับ “Ideal CKD Clinic Model” ควรมีองค์ประกอบใดครบที่สุด?',['CKD Registry + Integrated multidisciplinary care + Educational program + Community network','เครื่อง HD + ICU + ห้องผ่าตัด + CT scan','Nephrologist อย่างเดียว','การคัดกรองครั้งเดียวโดยไม่มีระบบติดตาม'],0,'Ideal CKD Clinic Model ใน Service Plan มี 4 องค์ประกอบดังกล่าว','Service Plan p.23','Remember','2.2–2.5'),
HQ('C1-U2-L03-F02','หลักฐาน ESCORT-1 ที่นำเสนอใน Service Plan สนับสนุนแนวทางใด?',['การดูแล CKD แบบบูรณาการร่วมกับการให้ความรู้ในชุมชน สามารถชะลอการเสื่อมและปรับการควบคุมปัจจัยเสี่ยงได้ในงานศึกษานั้น','การส่งผู้ป่วย CKD ทุกคนเข้ารับ HD เร็วขึ้น','การลดบทบาททีมสหสาขา','การยกเลิกการติดตามในชุมชน'],0,'สไลด์ ESCORT-1 ระบุ intervention เป็น integrated CKD care + comprehensive education และรายงานผลด้าน progression/BP/DM/bicarbonate ในงานนั้น','Service Plan p.24','Understand','2.2–2.5'),
HQ('C1-U2-L03-F03','ทีมสหสาขาวิชาชีพใน Service Plan ประกอบด้วยชุดใด?',['แพทย์ พยาบาล เภสัชกร นักโภชนาการ และนักกายภาพบำบัด','แพทย์และนักบัญชีเท่านั้น','พยาบาลและวิศวกรเท่านั้น','นักโภชนาการและนักกฎหมายเท่านั้น'],0,'Anatomy of the Thai MDT ใน Service Plan ระบุ doctor, nurse, pharmacist, dietitian และ physical therapist','Service Plan p.26','Remember','2.2–2.5'),
HQ('C1-U2-L03-F04','จังหวัดมี CKD Registry และ MDT แล้ว แต่ไม่มีการเยี่ยมบ้าน ติดตาม BP/อาหาร หรือกิจกรรมสร้างความตระหนักในชุมชน ช่องว่างหลักตรงกับองค์ประกอบใด?',['Community Network','Kidney Transplant Surgery','ICU Capacity','Radiology Network'],0,'Service Plan ระบุ community network ด้วย home visit, community monitoring และ awareness','Service Plan p.27','Apply','2.2–2.5'),
HQ('C1-U2-L04-F01','ก่อนเริ่ม PD First ในปี 2008 แหล่งเรียนรู้ระบุปัญหาการเข้าถึงแบบใด?',['ระบบเน้น HD การเบิกจ่ายจำกัด บริการกระจุกในเมือง ระยะทางเดินทางไกล และความเหลื่อมล้ำ','PD มีมากเกินความต้องการทั่วประเทศ','ผู้ป่วยทุกคนเข้าถึง KT ได้ทันที','ไม่มีข้อจำกัดด้านงบประมาณหรือภูมิศาสตร์'],0,'Redefining Accessibility อธิบาย pre-2008 ว่า HD-centered, limited reimbursement, urban concentration, long travel and inequity','Redefining Accessibility p.4','Remember','2.2–2.5'),
HQ('C1-U2-L04-F02','เหตุผลเชิงนโยบายที่ประเทศไทยเลือก PD First ในเอกสารประกอบด้วยข้อใด?',['เพิ่มการเข้าถึงและความเท่าเทียม ลดอุปสรรคทางภูมิศาสตร์ จัดการทรัพยากร และสร้างระบบ dialysis ที่ยั่งยืน','เพิ่มจำนวนการเดินทางไปศูนย์ HD','ลดบทบาทผู้ป่วยในการดูแลตนเอง','ยกเลิกการติดตามผลคุณภาพ'],0,'สไลด์ระบุ national objectives 5 ด้านดังกล่าว','Redefining Accessibility p.7','Understand','2.2–2.5'),
HQ('C1-U2-L04-F03','ข้อใดเป็นหนึ่งใน “8 strategies” สำหรับการขยาย PD ที่ระบุในเอกสารนโยบาย?',['กำหนดระบบ reimbursement ที่เหมาะสมและพัฒนาบุคลากรที่มีคุณสมบัติเหมาะสม','ลดจำนวน PD centers','ยุติ patient network','ยกเลิก CKD prevention ใน DM/HT'],0,'แหล่งนโยบายระบุ 8 strategies รวมเพิ่ม PD centers, qualified HR, appropriate reimbursement, solution cost, incentives, research, patient network และ CKD prevention','Policy Access pp.44–45','Remember','2.2–2.5'),

HQ('C1-U2-L05-F01','ลำดับ 4 ขั้นของ Shared Decision Making Roadmap ในเอกสารคือข้อใด?',['Timing of Initiation → Modalities Selection → Personal Dimensions → Advance Care Planning','Modalities Selection → Dialysis Start → Billing → Discharge','Advance Care Planning → Timing → ไม่มีการประเมินบริบท → Dialysis','HD → PD → KT → ICU'],0,'Roadmap ในเอกสารกำหนด 4 ขั้นตามลำดับนี้','Shared Renal Care Decisions p.3','Remember','2.2–2.5'),
HQ('C1-U2-L05-F02','ผู้ป่วย CKD ระยะก้าวหน้าต้องการรักษาที่บ้านและให้ความสำคัญกับความยืดหยุ่นในการใช้ชีวิต ข้อมูลจากบท modality selection ชี้ว่าควรทำอย่างไร?',['ใช้ความต้องการนี้เป็นข้อมูลหนึ่งในการ SDM และประเมินความเหมาะสมของ PD ร่วมกับความสามารถดูแลตนเอง/ผู้ดูแล','สรุป PD ทันทีโดยไม่ประเมินความเหมาะสม','ตัด PD ออกเพราะการรักษาที่บ้านไม่เกี่ยวกับ modality','เริ่ม HD โดยไม่อธิบายทางเลือก'],0,'PD source เน้น home-based care/flexibility แต่ยังต้องพิจารณาความเหมาะสมและ support; SDM ไม่ใช่ automatic modality assignment','Shared Renal Care Decisions pp.6–8','Apply','2.2–2.5'),
HQ('C1-U2-L05-F03','ข้อใดเป็น 4 มิติสำคัญใน “Factors in SDM” ตามเอกสาร?',['Medical context, Caregiver support, Financial & Welfare, Goal of Care','อายุ เพศ ส่วนสูง น้ำหนักเท่านั้น','โรงพยาบาล เครื่องมือ ยา ห้องพัก','ค่าใช้จ่ายเพียงอย่างเดียว'],0,'สไลด์ Personal Dimensions แบ่งเป็น medical context, caregiver, financial/welfare และ goal of care','Shared Renal Care Decisions p.13','Remember','2.2–2.5'),
HQ('C1-U2-L05-F04','Advance Care Planning ในเอกสารช่วยลดความเสี่ยงใดได้โดยตรงที่สุด?',['การเริ่ม dialysis แบบฉุกเฉินผ่าน emergency catheter โดยไม่มีการเตรียม access','การมีข้อมูลเกี่ยวกับ modality มากเกินไป','การติดตามผู้ป่วยต่อเนื่อง','การมีผู้ดูแลในครอบครัว'],0,'ACP slide เชื่อม execution ของ access preparation กับ prevention ของ emergency catheter และ severe complications','Shared Renal Care Decisions p.14','Apply','2.2–2.5'),
HQ('C1-U2-L06-F01','รัฐธรรมนูญฉบับปี 2550 มาตรา 51 ในเอกสารกล่าวถึงสิทธิใด?',['สิทธิเสมอกันในการรับบริการสาธารณสุขที่เหมาะสมและได้มาตรฐาน รวมทั้งกรอบสิทธิของผู้ยากไร้ตามบทบัญญัติ','สิทธิเลือกยาได้ทุกชนิดโดยไม่จำกัด','สิทธิรับ KT ทันทีทุกคน','สิทธิให้โรงพยาบาลเอกชนทุกแห่งรักษาฟรีทุกกรณี'],0,'มาตรา 51 ใน source ระบุ equal right to appropriate/standard health services และสิทธิผู้ยากไร้ในสถานบริการรัฐตามบทบัญญัติ','Legal Source p.7','Understand','2.6.1–2.6.2'),
HQ('C1-U2-L06-F02','ข้อใดจับคู่บทบัญญัติรัฐธรรมนูญปี 2550 ตามเอกสารได้ถูกต้อง?',['มาตรา 54 — ผู้พิการ/ทุพพลภาพมีสิทธิเข้าถึงสวัสดิการและความช่วยเหลือ; มาตรา 55 — ผู้ไร้ที่อยู่อาศัยและรายได้ไม่เพียงพอมีสิทธิได้รับความช่วยเหลือที่เหมาะสม','มาตรา 54 — สิทธิเลือก dialysis; มาตรา 55 — กำหนดอัตรา reimbursement','มาตรา 54 — ตั้ง CKD registry; มาตรา 55 — ตั้ง HD unit','มาตรา 54 — DRG; มาตรา 55 — FTE'],0,'เอกสารแสดงเนื้อหามาตรา 54 และ 55 ตามตัวเลือกแรก','Legal Source p.8','Remember','2.6.1–2.6.2'),
HQ('C1-U2-L06-F03','รัฐธรรมนูญฉบับปี 2560 มาตรา 47 ตามเอกสารระบุหลักสำคัญใด?',['บุคคลย่อมมีสิทธิได้รับบริการสาธารณสุขของรัฐ และผู้ยากไร้มีสิทธิได้รับบริการโดยไม่เสียค่าใช้จ่ายตามที่กฎหมายบัญญัติ','รัฐต้องให้ dialysis modality ทุกชนิดในทุกสถานพยาบาล','ผู้ป่วยมีสิทธิข้ามระบบ referral ทุกกรณี','กำหนดให้ทุกคนต้องทำ PD'],0,'มาตรา 47 ใน source ระบุสิทธิได้รับบริการสาธารณสุขของรัฐและสิทธิผู้ยากไร้ตามที่กฎหมายบัญญัติ','Legal Source p.11','Understand','2.6.1–2.6.2'),
HQ('C1-U2-L06-F04','รัฐธรรมนูญปี 2560 มาตรา 43 ในเอกสารเกี่ยวข้องกับข้อใด?',['สิทธิของบุคคลและชุมชน รวมถึงการจัดให้มีระบบสวัสดิการชุมชนและการร่วมกับองค์กรปกครองส่วนท้องถิ่นหรือรัฐ','สูตรคำนวณ eGFR','อัตราจ่ายค่าฟอกเลือด','มาตรฐานน้ำ RO'],0,'หน้า 10 ของ legal source แสดงมาตรา 43 และสิทธิบุคคล/ชุมชน รวมถึงระบบสวัสดิการชุมชน','Legal Source pp.9–10','Remember','2.6.1–2.6.2'),
HQ('C1-U2-L07-F01','ตาม พ.ร.บ.ระบบสุขภาพปฐมภูมิ พ.ศ.2562 มาตรา 15 ในเอกสาร ข้อใดถูกต้อง?',['บุคคลทุกคนมีสิทธิได้รับบริการสุขภาพปฐมภูมิโดยแพทย์เวชศาสตร์ครอบครัวและคณะผู้ให้บริการสุขภาพปฐมภูมิ และต้องมีการบันทึกข้อมูลสุขภาพตามหลักเกณฑ์','ให้บริการได้โดยไม่ต้องมีข้อมูลสุขภาพ','จำกัดบริการปฐมภูมิเฉพาะผู้ไม่มีสิทธิอื่น','กำหนดให้ผู้ป่วย CKD ต้องเริ่ม HD'],0,'มาตรา 15 ระบุ family physician/primary-care team และ health-data recording','Legal Source p.72','Understand','2.6.3–2.6.6'),
HQ('C1-U2-L07-F02','มาตรา 16 ของ พ.ร.บ.ระบบสุขภาพปฐมภูมิในเอกสารมีความหมายอย่างไรต่อผู้ที่มีสิทธิรักษาตามสวัสดิการอื่นอยู่แล้ว?',['ยังมีสิทธิได้รับบริการสุขภาพปฐมภูมิตามมาตรา 15 โดยการใช้สิทธิเป็นไปตามหลักเกณฑ์ของสวัสดิการ/สิทธินั้น','สูญเสียสิทธิบริการปฐมภูมิ','ต้องเปลี่ยนเป็น UCS ทุกคน','ต้องชำระค่าบริการเองทุกกรณี'],0,'มาตรา 16 เชื่อมสิทธิสุขภาพที่มีอยู่กับสิทธิบริการปฐมภูมิ ไม่ได้ตัดสิทธิเดิม','Legal Source p.73','Understand','2.6.3–2.6.6'),
HQ('C1-U2-L07-F03','หน่วยบริการปฐมภูมิให้ข้อมูลสิทธิและทางเลือกไม่เพียงพอ ทำให้ผู้ป่วยไม่เข้าใจว่าจะเข้าสู่ระบบส่งต่ออย่างไร หน้าที่ใดในมาตรา 20 เกี่ยวข้องมากที่สุด?',['หน้าที่ให้ข้อมูลบริการและสิทธิอย่างเพียงพอเพื่อให้ผู้รับบริการตัดสินใจเลือกรับบริการหรือเข้าสู่ระบบส่งต่อ','หน้าที่จัดซื้อเครื่อง HD','หน้าที่กำหนดราคายา','หน้าที่อนุมัติปลูกถ่ายไต'],0,'มาตรา 20(2) ใน source ระบุการให้ข้อมูลบริการและสิทธิอย่างเพียงพอเพื่อการตัดสินใจ/เข้าสู่ referral','Legal Source p.78','Apply','2.6.3–2.6.6'),
HQ('C1-U2-L07-F04','ผู้ป่วย CKD ต้องส่งต่อจาก primary care ไปหน่วยเฉพาะทาง แนวทางใดสอดคล้องมาตรา 23 มากที่สุด?',['ทีมปฐมภูมิจัดการส่งต่อ และระบบต้องสนับสนุนการเชื่อมโยงข้อมูลสุขภาพเพื่อการส่งต่อและ continuity','ให้ผู้ป่วยนำความจำไปบอกโรงพยาบาลปลายทางเองโดยไม่มีข้อมูล','ส่งต่อได้เฉพาะเมื่อเกิดภาวะฉุกเฉิน','ไม่ต้องส่งข้อมูลกลับหรือเชื่อมระบบ'],0,'มาตรา 23 ระบุการดำเนินการส่งต่อและการจัดระบบข้อมูลสุขภาพ/การเชื่อมโยงเพื่อใช้ข้อมูล','Legal Source p.83','Apply','2.6.3–2.6.6'),
HQ('C1-U2-L08-F01','ก่อนออกใบอนุญาตประกอบกิจการสถานพยาบาล ตามมาตรา 18 ที่ปรากฏในเอกสาร ต้องพิจารณาความพร้อมใด?',['แผนจัดตั้ง ลักษณะสถานพยาบาล เครื่องมือ/เวชภัณฑ์ที่จำเป็น และผู้ประกอบวิชาชีพตามเกณฑ์','มีเครื่อง HD เพียงเครื่องเดียวก็เพียงพอ','มีชื่อสถานพยาบาลโดยไม่ต้องมีบุคลากร','มีงบประมาณแต่ไม่ต้องมีสถานที่จริง'],0,'มาตรา 18 ใน source กำหนดแผน สถานที่ เครื่องมือ/เวชภัณฑ์ และผู้ประกอบวิชาชีพตามกฎกระทรวง','Legal Source p.96','Understand','2.6.3–2.6.6'),
HQ('C1-U2-L08-F02','มาตรา 35 ของ พ.ร.บ.สถานพยาบาลในเอกสารกำหนดหน้าที่ร่วมของผู้รับอนุญาตและผู้ดำเนินการข้อใด?',['จัดให้มีผู้ประกอบวิชาชีพ เครื่องมือ/ยา/เวชภัณฑ์ที่จำเป็น และหลักฐานเกี่ยวกับผู้ประกอบวิชาชีพ/ผู้ป่วยตามเกณฑ์','จัดให้มีเฉพาะเครื่องมือโดยไม่ต้องมีวิชาชีพ','ให้ผู้ป่วยเป็นผู้จัดหาเวชภัณฑ์ฉุกเฉินเอง','ไม่ต้องเก็บหลักฐานผู้ป่วย'],0,'มาตรา 35 ระบุบุคลากร อุปกรณ์/ยา/เวชภัณฑ์ และ records เป็นหน้าที่ร่วม','Legal Source p.97','Remember','2.6.3–2.6.6'),
HQ('C1-U2-L08-F03','สถานพยาบาลพบผู้ป่วยอยู่ในภาวะอันตรายและต้องรักษาฉุกเฉิน แนวทางใดสอดคล้องมาตรา 36 ในเอกสาร?',['ช่วยเหลือให้พ้นอันตรายตามมาตรฐานวิชาชีพ/ประเภทสถานพยาบาล และหากจำเป็นต้องส่งต่อให้จัดการส่งต่ออย่างเหมาะสม','ปฏิเสธทันทีหากไม่ใช่ผู้ป่วยประจำ','ให้ญาติจัดรถส่งต่อเองก่อนการช่วยเหลือ','รอการเบิกจ่ายเสร็จก่อนช่วยเหลือ'],0,'มาตรา 36 กำหนดการช่วยเหลือฉุกเฉินและการจัดส่งต่อเมื่อจำเป็น','Legal Source p.98','Apply','2.6.3–2.6.6'),

VQ('C1-U2-L01-F01','จังหวัดมีโรงพยาบาลหลายระดับ แต่ผู้ป่วย CKD หลุดจากการติดตามเพราะข้อมูลไม่เชื่อม การส่งต่อเป็นกระดาษ และไม่มี back-referral หากต้องเลือก reform priority ที่แก้ root cause มากที่สุดควรเป็นข้อใด?',['เพิ่มจำนวนเตียงโรงพยาบาลศูนย์โดยคง referral เดิม','สร้าง integrated network พร้อมข้อมูลอิเล็กทรอนิกส์ที่เชื่อม referral และ continuity','เพิ่มคลินิกเฉพาะทางโดยให้แต่ละแห่งเก็บข้อมูลแยกกัน','เพิ่มงบประชาสัมพันธ์โดยไม่เปลี่ยนระบบบริการ'],1,'ปัญหาใน source คือ fragmentation และ information/referral linkage จึงต้องแก้ด้วย integrated network มากกว่าขยาย capacity แบบแยกส่วน','Health Reform pp.2–5','Analyze','2.1'),
VQ('C1-U2-L01-F02','แผนปฏิรูปสองแบบมีงบเท่ากัน: แผน A รวมบริการไว้ตติยภูมิและลดบทบาท primary care; แผน B เสริม primary care เชื่อมข้อมูลและ referral พร้อม governance ร่วมกัน ข้อใดเหมาะสมกว่าและเพราะเหตุใด?',['แผน A เพราะบริการเฉพาะทางควรเป็น first contact ทุกกรณี','แผน B เพราะสอดคล้องกับ equitable access, integration และ good governance','แผน A เพราะข้อมูลสุขภาพไม่เกี่ยวกับ continuity','ทั้งสองเท่ากันเพราะโครงสร้างระบบไม่เปลี่ยนผลลัพธ์'],1,'ภาพระบบที่พึงประสงค์ใน source เน้น equitable access, integrated system และ governance พร้อมการเชื่อมโยงบริการ','Health Reform pp.3–5','Analyze','2.1'),
VQ('C1-U2-L02-F01','เครือข่ายมีจำนวนบุคลากรรวมเพียงพอ แต่พื้นที่ชนบทขาดทีมที่มี competency ด้าน CKD ขณะที่เมืองมีบุคลากรกระจุกตัว แนวทางใดตรงกับ reform workforce มากที่สุด?',['เพิ่ม headcount เฉพาะเมืองเพราะมีผู้ป่วยมากกว่า','ปรับ distribution พร้อมพัฒนาสมรรถนะและระบบบริหารกำลังคนตามความต้องการพื้นที่','คงการกระจายเดิมแล้วซื้อเครื่องเพิ่ม','ใช้จำนวนบุคลากรรวมประเทศเป็นตัวชี้วัดเดียว'],1,'source เน้นทั้ง adequacy, distribution และ management/competency ของ workforce ไม่ใช่จำนวนรวมเพียงอย่างเดียว','Health Reform p.5','Apply','2.1'),
VQ('C1-U2-L02-F02','จังหวัดทำ P&P โดยมีเพียง campaign รายปี แต่ไม่มีงบประจำ กำลังคน โครงสร้างการทำงานหรือ infrastructure รองรับ ข้อใดเป็นการแก้ระบบที่สอดคล้องกับแผนปฏิรูป?',['เพิ่มจำนวนโปสเตอร์โดยไม่เปลี่ยนระบบ','พัฒนา P&P ให้ครบ structure, budget, law, workforce และ infrastructure','ย้ายงบทั้งหมดไปการรักษาในโรงพยาบาล','วัดผลจากจำนวนผู้เข้าร่วม campaign เพียงตัวเดียว'],1,'P&P reform ใน source ระบุองค์ประกอบระบบหลายด้าน จึงควรแก้ช่องว่างเชิงโครงสร้างร่วมกัน','Health Reform p.6','Apply','2.1'),
VQ('C1-U2-L02-F03','โครงการ health literacy แจกข้อมูลจำนวนมาก แต่ผู้ป่วยยังไม่สามารถประเมินความน่าเชื่อถือหรือใช้ข้อมูลตัดสินใจได้ ตัวชี้วัดใดควรถูกเพิ่มเพื่อให้ตรงกับกรอบ source?',['จำนวนแผ่นพับที่แจก','ความสามารถ access, understand, evaluate และ apply ข้อมูล/บริการในสถานการณ์จริง','จำนวนครั้งที่เปิดโทรศัพท์','จำนวนคำศัพท์ทางการแพทย์ที่จำได้'],1,'health literacy ตาม source เป็น capability ที่ไปถึง evaluate และ apply ไม่ใช่เพียงการได้รับข้อมูล','Health Reform p.6','Apply','2.1'),
VQ('C1-U2-L03-F01','จังหวัดมี CKD Registry และทีมสหสาขา แต่ยังไม่มี structured education และ community follow-up ทำให้ขาดนัดและควบคุมปัจจัยเสี่ยงไม่ดี ข้อใดเป็น gap analysis ที่ตรงกับ Ideal CKD Clinic Model มากที่สุด?',['ระบบสมบูรณ์แล้วเพราะมี registry กับ MDT','ยังขาด Educational Program และ Community Network ซึ่งเป็นอีกสององค์ประกอบของ model','ควรยกเลิก registry แล้วเพิ่มเครื่อง HD','ควรส่งผู้ป่วยทุกคนไปตติยภูมิแทนการพัฒนา network'],1,'Ideal CKD Clinic Model มี registry, integrated MDT, education และ community network จึงต้องวิเคราะห์องค์ประกอบที่ขาด ไม่ใช่ท่องรายชื่อเท่านั้น','Service Plan p.23','Analyze','2.2–2.5'),
VQ('C1-U2-L03-F02','ผู้บริหารอ้างผล ESCORT-1 เพื่อสรุปว่า “education อย่างเดียวเพียงพอและไม่จำเป็นต้องมี MDT/community system” ข้อใดวิเคราะห์การอ้างอิงนี้ได้เหมาะสมที่สุด?',['เหมาะสม เพราะงานดังกล่าวทดสอบ education แบบเดี่ยว','ไม่เหมาะสม เพราะ intervention ใน source เป็น integrated CKD care ร่วมกับ comprehensive education จึงไม่ควรตัดองค์ประกอบระบบออกจากข้อสรุป','เหมาะสม เพราะผลการศึกษาใช้ยืนยันการเริ่ม HD เร็วในทุกคน','ไม่เหมาะสมเพราะงานดังกล่าวไม่เกี่ยวกับ CKD progression เลย'],1,'source นำเสนอ ESCORT-1 ในกรอบ integrated CKD care + comprehensive education จึงต้องตีความผลตามองค์ประกอบ intervention','Service Plan p.24','Analyze','2.2–2.5'),
VQ('C1-U2-L03-F03','ผู้ป่วย CKD มีปัญหายาไม่ต่อเนื่อง อาหารเค็ม และกล้ามเนื้ออ่อนแรง การประสานทีมแบบใดตรงกับ MDT ที่ปรากฏใน Service Plan มากที่สุด?',['ใช้แพทย์เพียงคนเดียวดูทุกปัญหา','ให้พยาบาลประสานแพทย์ เภสัชกร นักโภชนาการ และนักกายภาพบำบัดตามปัญหาของผู้ป่วย','ส่งเฉพาะนักบัญชีและเจ้าหน้าที่ทะเบียน','ให้ผู้ป่วยเลือกวิชาชีพหนึ่งคนแล้วตัดบทบาททีมอื่น'],1,'MDT ใน source ประกอบด้วย doctor, nurse, pharmacist, dietitian และ physical therapist จึงนำไปใช้จัดบทบาทตามปัญหาได้','Service Plan p.26','Apply','2.2–2.5'),
VQ('C1-U2-L04-F01','ก่อนปี 2008 ระบบ RRT มี HD กระจุกในเมือง การเบิกจ่ายจำกัดและผู้ป่วยชนบทต้องเดินทางไกล หากวิเคราะห์เชิงนโยบาย ปัญหาหลักคืออะไร?',['มี PD มากเกินไปจนเกิด oversupply','ข้อจำกัดด้าน reimbursement, geography และ service concentration ทำให้เกิด access inequity','ผู้ป่วยมีทางเลือก KT มากเกินไป','ระบบมีทรัพยากรมากเกินความต้องการทุกพื้นที่'],1,'source อธิบาย pre-2008 ด้วย HD-centered care, limited reimbursement, urban concentration, travel burden และ inequity','Redefining Accessibility p.4','Analyze','2.2–2.5'),
VQ('C1-U2-L04-F02','ประเทศหนึ่งมีประชากรกระจายตัวไกลจากศูนย์ HD และทรัพยากร specialist จำกัด เหตุผลใดสนับสนุนการพิจารณา home-based PD policy ตาม rationale ในเอกสารมากที่สุด?',['เพิ่มการเดินทางไปศูนย์และรวมบริการไว้เมืองใหญ่','เพิ่ม access/equity ลด geographic barrier และใช้ทรัพยากรอย่างยั่งยืน','ลดการติดตามคุณภาพเพื่อขยายจำนวนผู้ป่วยเร็วขึ้น','เลือก PD โดยไม่ต้องพิจารณาระบบ supply หรือบุคลากร'],1,'rationale ใน source เชื่อม PD-First กับ access, equity, geography, resource constraints และ sustainability','Redefining Accessibility p.7','Analyze','2.2–2.5'),
VQ('C1-U2-L04-F03','โครงการ PD มีศูนย์บริการแล้วแต่ uptake ต่ำเพราะบุคลากรไม่พร้อมและ reimbursement ไม่จูงใจ การปรับใดสอดคล้องกับ 8 strategies ใน source มากที่สุด?',['ลดจำนวนศูนย์และยุติการฝึกบุคลากร','พัฒนาบุคลากรที่มีคุณสมบัติพร้อมปรับระบบ reimbursement และสนับสนุน network ที่จำเป็น','ยกเลิก patient network และ CKD prevention','เพิ่มเฉพาะโฆษณาโดยไม่แก้ payment หรือ workforce'],1,'8 strategies ใน source ครอบคลุม qualified HR, reimbursement, centers, incentives, patient network และองค์ประกอบอื่นของระบบ','Policy Access pp.44–45','Apply','2.2–2.5'),
VQ('C1-U2-L05-F03','ชายวัยทำงาน CKD5 ต้องการรักษาที่กระทบงานน้อย แต่ภรรยาทำงานต่างจังหวัดและสิทธิประโยชน์มีเงื่อนไข ก่อนแนะนำ modality ควรวิเคราะห์ข้อมูลใดร่วมกันมากที่สุด?',['อายุและเพศเท่านั้น','Medical context, caregiver support, financial/welfare และ goal of care','ระยะทางอย่างเดียว','ชนิดเครื่องที่โรงพยาบาลมีมากที่สุด'],1,'Personal Dimensions ใน SDM source ประกอบด้วย medical context, caregiver, financial/welfare และ goal of care','Shared Renal Care Decisions p.13','Analyze','2.2–2.5'),
VQ('C1-U2-L06-F01','ผู้ป่วยมีสิทธิรับบริการตามกรอบรัฐธรรมนูญ แต่สถานพยาบาลที่มารับบริการไม่มี modality ที่เหมาะสมกับแผนการรักษา การตอบสนองใดสอดคล้องกับกรอบสิทธิในบทเรียนมากที่สุด?',['บอกว่ามีสิทธิจึงต้องให้ modality นั้นที่สถานพยาบาลนี้ทันที','ให้ข้อมูลอย่างเหมาะสมและประสานทางเข้าถึง/ส่งต่อภายใต้ระบบที่เกี่ยวข้อง','ปฏิเสธโดยไม่อธิบายเพราะสถานพยาบาลไม่มีบริการ','ให้ผู้ป่วยหาสถานพยาบาลเองโดยไม่ต้องมีข้อมูล'],1,'กรอบสิทธิใน source ต้องแปลสู่ access/information/service pathway และไม่เท่ากับการรับประกันทุก modality ในทุกสถานที่','Legal Source pp.7,11','Apply','2.6.1–2.6.2'),
VQ('C1-U2-L06-F02','ผู้รับบริการมีความพิการและข้อจำกัดทางสังคมจนเข้าถึงการรักษาได้ยาก การวางแผนบริการใดสอดคล้องกับบทบัญญัติปี 2550 ที่นำเสนอในเอกสารมากที่สุด?',['ใช้มาตรฐานเดียวโดยไม่ต้องพิจารณาความช่วยเหลือเพิ่มเติม','ประเมินความต้องการช่วยเหลือและการเข้าถึงสวัสดิการ/บริการที่เหมาะสมตามกรอบสิทธิของกลุ่มเปราะบาง','จำกัดบริการเฉพาะผู้ไม่มีโรคร่วม','ให้ผู้ป่วยเลือก reimbursement rate เอง'],1,'มาตรา 54–55 ใน teaching source กล่าวถึงสิทธิและความช่วยเหลือของผู้พิการ/ทุพพลภาพและกลุ่มที่มีข้อจำกัดทางสังคม','Legal Source p.8','Apply','2.6.1–2.6.2'),
VQ('C1-U2-L06-F04','ชุมชนเสนอให้ท้องถิ่นร่วมจัดระบบสนับสนุนผู้ป่วย CKD แต่มีผู้ตีความว่า “มาตรา 43 หมายถึงชุมชนสามารถเรียกร้อง modality ใดก็ได้จากทุกโรงพยาบาล” ข้อใดวิเคราะห์ได้เหมาะสมที่สุด?',['ถูก เพราะสิทธิชุมชนเท่ากับสิทธิเลือกบริการไม่จำกัด','ไม่ถูก เพราะ source เชื่อมมาตรา 43 กับสิทธิบุคคล/ชุมชนและระบบสวัสดิการชุมชน ไม่ได้กำหนด unlimited modality entitlement','ถูกเฉพาะเมื่อเป็น HD','ไม่ถูกเพราะมาตรา 43 ไม่เกี่ยวกับชุมชนเลย'],1,'source กล่าวถึงสิทธิของบุคคล/ชุมชนและ community welfare จึงไม่ควรขยายความเป็นสิทธิ modality แบบไม่จำกัด','Legal Source pp.9–10','Analyze','2.6.1–2.6.2'),

let order=[],ans={},eq=0,etype='pre',t0=0,timerHandle=null;function startExam(t){if(t!=='pre'&&!confirm('นี่คือ EXAM PREP v3.8 Assessment Bank ที่ได้รับ lead-reviewer approval 180/180 แล้ว ต้องการเริ่มทดสอบหรือไม่?'))return;etype=t;let p=t==='c1'?QB.filter(x=>x.course===1):t==='c2'?QB.filter(x=>x.course===2):QB.slice();if(t==='pre')p=p.sort(()=>Math.random()-.5).slice(0,30);order=p.map(x=>x.id);ans={};eq=0;t0=Date.now();exam()}function exam(){let q=QB.find(x=>x.id===order[eq]);document.getElementById('app').innerHTML='<div class="examwrap"><div class="card"><div class="head"><span class="tag">'+etype.toUpperCase()+'</span><span>ข้อ '+(eq+1)+' / '+order.length+'</span></div><h2>'+q.stem+'</h2><p class="muted">'+q.lesson+' • '+q.level+' • '+q.status+'</p><div class="choice">'+q.opts.map((o,i)=>'<label><input type="radio" name="a" '+(ans[q.id]===i?'checked':'')+' onchange="setA(\''+q.id+'\','+i+')">'+String.fromCharCode(65+i)+'. '+o+'</label>').join('')+'</div><div class="foot"><button class="btn" onclick="eprev()">← ก่อนหน้า</button><button class="btn pri" onclick="enext()">ถัดไป →</button></div></div><div class="card examnav"><b>Question navigator</b><p class="muted" id="timer"></p><div class="qnums">'+order.map((x,k)=>'<button class="qnum '+(ans[x]!==undefined?'done ':'')+(k===eq?'current':'')+'" onclick="eq='+k+';exam()">'+(k+1)+'</button>').join('')+'</div><button class="btn good" style="width:100%;margin-top:12px" onclick="submitExam()">ส่งข้อสอบ</button></div></div>';tick()}function setA(id,i){ans[id]=i;exam()}function enext(){if(eq<order.length-1){eq++;exam()}}function eprev(){if(eq>0){eq--;exam()}}function tick(){if(timerHandle)clearTimeout(timerHandle);let e=document.getElementById('timer');if(!e){timerHandle=null;return}let s=Math.floor((Date.now()-t0)/1000);e.textContent='เวลา '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');timerHandle=setTimeout(tick,1000)}function submitExam(){if(!confirm('ส่งข้อสอบตอนนี้หรือไม่?'))return;if(timerHandle){clearTimeout( function ensureSME(){if(!st.smeReview)st.smeReview={};if(!st.smeMeta)st.smeMeta={reviewer:'',startedAt:new Date().toISOString(),lastUpdated:null};if(typeof RELEASE_ATTESTATION!=='undefined'&&RELEASE_ATTESTATION.approved===QB.length){st.smeMeta.reviewer=RELEASE_ATTESTATION.reviewer;QB.forEach(q=>{if(!st.smeReview[q.id])st.smeReview[q.id]={status:'approved',checks:Object.fromEntries(SME_CRITERIA.map(c=>[c[0],true])),comment:'Bulk lead-reviewer approval recorded in SME Review 180 sheet.',reviewer:RELEASE_ATTESTATION.reviewer,reviewedAt:RELEASE_ATTESTATION.approvedAt};});st.smeMeta.lastUpdated=RELEASE_ATTESTATION.approvedAt;}save()}
function reviewFor(id){ensureSME();if(!st.smeReview[id])st.smeReview[id]={status:'pending',checks:{},comment:'',reviewer:'',reviewedAt:null};return st.smeReview[id]}
function allCriteriaPassed(r){return SME_CRITERIA.every(c=>r.checks&&r.checks[c[0]]===true)}
function smeStats(){ensureSME();let s={approved:0,revise:0,rejected:0,pending:0,completeChecks:0};QB.forEach(q=>{let r=reviewFor(q.id);if(r.status==='approved')s.approved++;else if(r.status==='revise')s.revise++;else if(r.status==='rejected')s.rejected++;else s.pending++;if(allCriteriaPassed(r))s.completeChecks++});return s}
function smeReviewHome(){side();ensureSME();let s=smeStats();document.getElementById('app').innerHTML='<div class="hero"><span class="tag">SME Review Pack • 180 items</span><h1>Item-by-item Expert Sign-off</h1><p>ทุกข้อจะผ่าน gate ได้เมื่อผู้เชี่ยวชาญตรวจ 8 เกณฑ์ครบ ระบุชื่อ reviewer และเลือก <b>Approve</b>. สถานะ Revise/Reject จะ block Production Release.</p><div class="stats"><div class="card stat"><b>'+s.approved+'</b><span class="muted">Approved</span></div><div class="card stat"><b>'+s.revise+'</b><span class="muted">Needs revision</span></div><div class="card stat"><b>'+s.rejected+'</b><span class="muted">Rejected</span></div><div class="card stat"><b>'+s.pending+'</b><span class="muted">Pending</span></div><div class="card stat"><b>'+s.completeChecks+'</b><span class="muted">8/8 criteria checked</span></div></div><div class="progress"><div class="bar" style="width:'+Math.round(s.approved/180*100)+'%"></div></div><p class="muted">Approval progress '+s.approved+'/180 ('+Math.round(s.approved/180*100)+'%)</p><div class="card"><label>Lead SME / Reviewer name</label><input class="search" value="'+(st.smeMeta.reviewer||'')+'" placeholder="ชื่อผู้เชี่ยวชาญ" oninput="st.smeMeta.reviewer=this.value;st.smeMeta.lastUpdated=new Date().toISOString();save()"></div><p><button class="btn pri" onclick="smeItem(0)">เริ่ม Review ข้อ 1</button> <button class="btn" '+(s.pending?'onclick="smeItem('+QB.findIndex(q=>reviewFor(q.id).status==='pending')+')"':'disabled')+'>ไปข้อ Pending แรก</button> <button class="btn" onclick="exportSME()">Export Sign-off JSON</button> <label class="btn">Import Sign-off JSON<input type="file" accept=".json" style="display:none" onchange="importSME(this.files[0])"></label></p><h3>Review Criteria</h3><table class="tbl"><tr><th>#</th><th>Criterion</th><th>Pass when...</th></tr>'+SME_CRITERIA.map((c,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+c[1]+'</b></td><td>'+c[2]+'</td></tr>').join('')+'</table><div class="call warn"><b>Governance:</b> AI/model validation ไม่ถือเป็น SME sign-off. การกด Approve ต้องทำโดยผู้เชี่ยวชาญมนุษย์ที่รับผิดชอบเนื้อหา.</div></div>'}
function smeItem(i){ensureSME();i=Math.max(0,Math.min(QB.length-1,i));let q=QB[i],r=reviewFor(q.id);let reviewer=r.reviewer||st.smeMeta.reviewer||'';document.getElementById('app').innerHTML='<div class="examwrap"><div class="card"><div class="head"><span class="tag">SME '+(i+1)+' / '+QB.length+'</span><span class="muted">'+q.id+' • '+q.unit+' • '+q.level+'</span></div><h2>'+q.stem+'</h2><div>'+q.opts.map((o,k)=>'<div class="opt '+(k===q.ans?'correct':'')+'"><b>'+String.fromCharCode(65+k)+'.</b> '+o+(k===q.ans?' <b>✓ KEY</b>':'')+'</div>').join('')+'</div><div class="call"><b>Rationale</b><br>'+q.why+'</div><div class="src"><b>Source:</b> '+(q.source||'Missing')+'<br><b>Blueprint:</b> '+(q.blueprint||'Missing')+'<br><b>Current status:</b> '+q.status+'</div><h3>8-point SME checklist</h3>'+SME_CRITERIA.map(c=>'<label class="choice" style="display:block;margin:8px 0"><input type="checkbox" '+(r.checks&&r.checks[c[0]]?'checked':'')+' onchange="toggleSMECheck(\''+q.id+'\',\''+c[0]+'\',this.checked,'+i+')"> <b>'+c[1]+'</b> — '+c[2]+'</label>').join('')+'<label>Reviewer</label><input class="search" value="'+reviewer.replace(/"/g,'&quot;')+'" oninput="saveSMEReviewer(\''+q.id+'\',this.value)"><label style="display:block;margin-top:10px">Comment / Revision instruction</label><textarea class="search" rows="5" oninput="saveSMEComment(\''+q.id+'\',this.value)">'+(r.comment||'')+'</textarea><div class="foot"><button class="btn" onclick="smeItem('+(i-1)+')">← Previous</button><button class="btn good" onclick="setSMEStatus(\''+q.id+'\',\'approved\','+i+')">✓ Approve</button><button class="btn" onclick="setSMEStatus(\''+q.id+'\',\'revise\','+i+')">✎ Needs revision</button><button class="btn danger" onclick="setSMEStatus(\''+q.id+'\',\'rejected\','+i+')">✕ Reject</button><button class="btn pri" onclick="smeItem('+(i+1)+')">Next →</button></div></div><div class="card examnav"><b>Sign-off status</b><p class="muted">'+r.status.toUpperCase()+'</p><div class="qnums">'+QB.map((x,k)=>{let rr=reviewFor(x.id),cl=rr.status==='approved'?'done':rr.status==='revise'?'current':'';return'<button title="'+x.id+' • '+rr.status+'" class="qnum '+cl+'" onclick="smeItem('+k+')">'+(k+1)+'</button>'}).join('')+'</div><p><button class="btn" style="width:100%" onclick="smeReviewHome()">Review Summary</button></p><p><button class="btn" style="width:100%" onclick="releaseCandidateHome()">Release</button></p></div></div>'}
function toggleSMECheck(id,key,val,i){let r=reviewFor(id);r.checks[key]=val;r.reviewedAt=new Date().toISOString();st.smeMeta.lastUpdated=r.reviewedAt;save();smeItem(i)}
function saveSMEReviewer(id,v){let r=reviewFor(id);r.reviewer=v;st.smeMeta.lastUpdated=new Date().toISOString();save()}
function saveSMEComment(id,v){let r=reviewFor(id);r.comment=v;st.smeMeta.lastUpdated=new Date().toISOString();save()}
function setSMEStatus(id,status,i){let r=reviewFor(id),reviewer=(r.reviewer||st.smeMeta.reviewer||'').trim();if(status==='approved'&&!allCriteriaPassed(r)){alert('Approve ไม่ได้: ต้องตรวจผ่านทั้ง 8 criteria ก่อน');return}if(status==='approved'&&!reviewer){alert('Approve ไม่ได้: กรุณาระบุชื่อ reviewer');return}r.status=status;r.reviewer=reviewer;r.reviewedAt=new Date().toISOString();st.smeMeta.lastUpdated=r.reviewedAt;save();if(status==='approved'&&i<QB.length-1)smeItem(i+1);else smeItem(i)}
function exportSME(){ensureSME();let payload={schema:'Kidney_RRT_SME_Signoff_v1',build:META.version,exportedAt:new Date().toISOString(),reviewMeta:st.smeMeta,reviews:st.smeReview,summary:smeStats()};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Kidney_RRT_v3_SME_signoff.json';a.click();URL.revokeObjectURL(a.href)}
function importSME(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.schema!=='Kidney_RRT_SME_Signoff_v1')throw new Error('schema');st.smeReview=x.reviews||{};st.smeMeta=x.reviewMeta||{};save();alert('Import SME sign-off สำเร็จ');smeReviewHome()}catch(e){alert('ไฟล์ sign-off ไม่ถูกต้อง')}};r.readAsText(f)}
function rcEligibility(){let s=smeStats(),allApproved=s.approved===QB.length&&s.revise===0&&s.rejected===0&&s.pending===0;let missingReviewer=QB.filter(q=>{let r=reviewFor(q.id);return r.status==='approved'&&!(r.reviewer||'').trim()}).length;let incomplete=QB.filter(q=>!allCriteriaPassed(reviewFor(q.id))).length;return{eligible:allApproved&&missingReviewer===0&&incomplete===0,stats:s,missingReviewer,incomplete}}
function releaseCandidateHome(){side();let g=rcEligibility();document.getElementById('app').innerHTML='<div class="hero"><span class="tag">Study Edition Status</span><h1>Exam Prep v3.8</h1><p>เวอร์ชันนี้เป็นชุดอ่านทบทวนก่อนสอบที่สร้างจาก FINAL v3.7 โดยคง Final Bank 180 ข้อเดิมไว้ ไม่ใช่การประกาศ production release ใหม่หรือการรับรอง SME รอบใหม่.</p><div class="stats"><div class="card stat"><b>'+g.stats.approved+'/180</b><span class="muted">Base-bank approvals retained</span></div><div class="card stat"><b>'+BUILD_QC.hardened+'/180</b><span class="muted">Source-hardened items</span></div></div><div class="call"><b>Study-edition gate:</b> '+(g.eligible?'ฐานข้อสอบ v3.7 ที่อนุมัติไว้ครบและพร้อมใช้ประกอบการอ่านสอบ':'ฐานการอนุมัติไม่ครบ — ตรวจ SME state ก่อนใช้ Final Bank')+'</div><div class="call warn"><b>Governance:</b> การเปลี่ยนแปลงของ v3.8 อยู่ที่ presentation/reading flow; หากแก้ stem, option, key, rationale หรือ source mapping ของ Final Bank ต้อง version และ revalidate ข้อนั้นใหม่.</div></div>'}
function exportRCManifest(){let g=rcEligibility();if(!g.eligible){alert('RC gate ยังไม่ผ่าน');return}let payload={schema:'Kidney_RRT_Final_RC_Manifest_v1',candidate:'Kidney & RRT Exam Prep v3.8',sourceBuild:META.version,generatedAt:new Date().toISOString(),questionCount:QB.length,course1:QB.filter(q=>q.course===1).length,course2:QB.filter(q=>q.course===2).length,reviewMeta:st.smeMeta,itemSignoff:QB.map(q=>{let r=reviewFor(q.id);return{id:q.id,status:r.status,reviewer:r.reviewer,reviewedAt:r.reviewedAt,source:q.source,blueprint:q.blueprint}})};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Kidney_RRT_ExamPrep_v3.8_manifest.json';a.click();URL.revokeObjectURL(a.href)}

let v4TimerHandle=null;
function v4Init(){if(!Array.isArray(st.v4History))st.v4History=[];if(!st.v4Weak||typeof st.v4Weak!=='object')st.v4Weak={};if(!st.v4Settings||typeof st.v4Settings!=='object')st.v4Settings={shuffleQ:true,shuffleC:true,timeMin:0};if(st.v4Active&&typeof st.v4Active!=='object')st.v4Active=null;save()}
function v4Esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function v4Shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function v4ModeLabel(t){if(t==='pre')return'Pre-test 30';if(t==='quick10')return'Quick 10';if(t==='random30')return'Random 30';if(t==='mock60')return'Mock 60';if(t==='c1')return'Course 1 • 120';if(t==='c2')return'Course 2 • 60';if(t==='full')return'Master • 180';if(t.startsWith('set')){let n=Number(t.slice(3));return'ชุด '+n+' • ข้อ '+((n-1)*10+1)+'–'+(n*10)}return t}
function v4Pool(t){if(t==='pre'||t==='random30')return v4Shuffle(QB).slice(0,30);if(t==='quick10')return v4Shuffle(QB).slice(0,10);if(t==='mock60')return v4Shuffle([...v4Shuffle(QB.filter(q=>q.course===1)).slice(0,40),...v4Shuffle(QB.filter(q=>q.course===2)).slice(0,20)]);if(t==='c1')return QB.filter(q=>q.course===1);if(t==='c2')return QB.filter(q=>q.course===2);if(t==='full')return QB.slice();if(t.startsWith('set')){let n=Number(t.slice(3));return QB.slice((n-1)*10,n*10)}return QB.slice(0,10)}
function v4Fmt(s){s=Math.max(0,Math.floor(s));let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function v4WeakHTML(obj){let a=Object.entries(obj||{}).sort((x,y)=>y[1]-x[1]).slice(0,6);if(!a.length)return'<p class="muted">ยังไม่มีข้อมูลข้อที่ตอบผิด</p>';let mx=a[0][1]||1;return a.map(([u,n])=>'<div style="margin:9px 0"><div class="head"><span><b>'+u+'</b> '+(UNITS[u]?UNITS[u][0]:'')+'</span><b>'+n+'</b></div><div class="progress"><div class="bar" style="width:'+Math.round(n/mx*100)+'%"></div></div></div>').join('')}
function assessmentHome(){v4Init();side();if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let h=st.v4History||[],best=h.length?Math.max(...h.map(x=>x.pct||0)):0,active=st.v4Active&&!st.v4Active.submitted?st.v4Active:null;document.getElementById('app').innerHTML='<div class="hero"><span class="tag">v4.1 Harder Exam Mode</span><h1>Practice & Final Questions</h1><p>ใช้ Final Bank เดิม 180 ข้อจาก stable v3.8: Course 1 = 120 • Course 2 = 60. v4.0 เพิ่มระบบทำข้อสอบและวิเคราะห์ผล โดยไม่แก้เนื้อหาข้อสอบ</p>'+(active?'<div class="call"><b>มีข้อสอบค้าง:</b> '+v4ModeLabel(active.mode)+' • ตอบแล้ว '+Object.keys(active.answers||{}).length+'/'+active.order.length+' <button class="btn pri" onclick="v4Resume()">ทำต่อ</button></div>':'')+'<div class="stats"><div class="card stat"><b>'+h.length+'</b><span class="muted">Attempts</span></div><div class="card stat"><b>'+best+'%</b><span class="muted">Best score</span></div><div class="card stat"><b>'+QB.length+'</b><span class="muted">Question bank</span></div><div class="card stat"><b>18</b><span class="muted">10-question sets</span></div><div class="card stat"><b>Local</b><span class="muted">Progress storage</span></div></div></div><h2>โหมดแนะนำ</h2><div class="grid">'+v4ModeCard('quick10','⚡ Quick 10','สุ่ม 10 ข้อ ทบทวนเร็ว')+v4ModeCard('random30','🎯 Random 30','สุ่ม 30 ข้อจากทั้ง bank')+v4ModeCard('mock60','🧪 Mock 60','สุ่ม 40 ข้อ Course 1 + 20 ข้อ Course 2')+v4ModeCard('c1','📘 Course 1','120 ข้อ')+v4ModeCard('c2','📗 Course 2','60 ข้อ')+v4ModeCard('full','🏁 Master Assessment','ครบ 180 ข้อ')+'</div><h2 style="margin-top:24px">ชุด 1–18 • ชุดละ 10 ข้อ</h2><div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px">'+Array.from({length:18},(_,i)=>'<button class="btn" onclick="v4Prepare(\'set'+(i+1)+'\')">ชุด '+(i+1)+'<br><small>'+(i*10+1)+'–'+((i+1)*10)+'</small></button>').join('')+'</div></div><h2 style="margin-top:24px">จุดที่ควรทบทวน</h2><div class="card">'+v4WeakHTML(st.v4Weak)+'</div><div class="call warn"><b>หมายเหตุ:</b> คะแนนและ progress เก็บใน browser เครื่องนี้เท่านั้น และ static GitHub Pages ไม่สามารถซ่อน answer key จากผู้ที่ตรวจ source code ได้ จึงเหมาะกับการเตรียมสอบ/ฝึกทำมากกว่าการสอบที่ต้องปกปิดเฉลยอย่างเข้มงวด</div>'}

function v4Prepare(t){v4Init();let s=st.v4Settings||{};document.getElementById('app').innerHTML='<div class="hero"><span class="tag">'+v4ModeLabel(t)+'</span><h1>ตั้งค่าก่อนเริ่ม</h1><div class="grid"><div class="card"><h3>การสุ่ม</h3><label><input id="v4sq" type="checkbox" '+(s.shuffleQ?'checked':'')+'> สุ่มลำดับคำถาม</label><br><br><label><input id="v4sc" type="checkbox" '+(s.shuffleC?'checked':'')+'> สุ่มลำดับตัวเลือก A–D</label></div><div class="card"><h3>เวลา</h3><select id="v4tm" class="search">'+[0,10,20,30,60,90,120,180].map(x=>'<option value="'+x+'" '+(Number(s.timeMin)===x?'selected':'')+'>'+(x?x+' นาที':'ไม่จำกัดเวลา')+'</option>').join('')+'</select><p class="muted">Timer เป็นเครื่องมือฝึก ไม่ใช่เกณฑ์จาก source curriculum</p></div></div><div class="call"><b>ระหว่างทำข้อสอบ:</b> เฉลยและ rationale จะไม่แสดง จนกว่าจะ Submit</div><p><button class="btn" onclick="assessmentHome()">← กลับ</button> <button class="btn pri" onclick="v4Start(\''+t+'\')">เริ่มข้อสอบ</button></p></div>'}
function v4Start(t){let settings={shuffleQ:document.getElementById('v4sq')?.checked??true,shuffleC:document.getElementById('v4sc')?.checked??true,timeMin:Number(document.getElementById('v4tm')?.value||0)};st.v4Settings=settings;let p=v4Pool(t);if(settings.shuffleQ&&!['pre','quick10','random30','mock60'].includes(t))p=v4Shuffle(p);let maps={};p.forEach(q=>maps[q.id]=settings.shuffleC?v4Shuffle([0,1,2,3]):[0,1,2,3]);st.v4Active={mode:t,order:p.map(q=>q.id),maps,answers:{},flags:{},pos:0,startedAt:Date.now(),timeMin:settings.timeMin,submitted:false};save();v4Exam()}

const LEGACY_QB_V40=QB.map(q=>Object.assign({},q,{opts:q.opts.slice(),bank:'legacy-v4.0'}));
const V41_KEY_PATTERN=[2,0,3,1,1,3,0,2,0,2,1,3];
const V41_CUE_RE=/(รอให้|เพียงค่าเดียว|ข้ามการ|เสมอ|เท่านั้น|ทุกกรณี|ทันที|ไม่ต้อง|ไม่มีทาง|อย่างเดียว|เฉพาะเมื่อ|เฉพาะผู้|ไม่เกี่ยวข้อง|ไม่มีผล)/;
function v41Norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function v41Same(a,b){a=v41Norm(a);b=v41Norm(b);return a===b||a.includes(b)||b.includes(a)}
function v41Swap(a,i,j){let x=a.slice(),t=x[i];x[i]=x[j];x[j]=t;return x}
function v41SeqDistractors(L){let f=(L&&L.flow?L.flow:[]).slice();if(f.length<4)return[];let out=[];let a=v41Swap(f,0,1),b=v41Swap(f,Math.max(1,f.length-3),Math.max(2,f.length-2)),c=v41Swap(f,f.length-2,f.length-1);[a,b,c].forEach(x=>{let s=x.join(' → ');if(!out.includes(s))out.push(s)});if(out.length<3){let d=f.slice(1,3).concat(f.slice(0,1),f.slice(3));let s=d.join(' → ');if(!out.includes(s))out.push(s)}return out.slice(0,3)}
function v41CandidatePool(q){let correct=q.opts[q.ans],pool=[];q.opts.forEach((o,i)=>{if(i!==q.ans)pool.push({t:o,kind:'old',lesson:q.lesson,unit:q.unit,level:q.level})});LEGACY_QB_V40.forEach(x=>{if(x.id===q.id)return;let t=x.opts[x.ans];if(x.lesson===q.lesson)pool.push({t,kind:'lesson-key',lesson:x.lesson,unit:x.unit,level:x.level});else if(x.unit===q.unit)pool.push({t,kind:'unit-key',lesson:x.lesson,unit:x.unit,level:x.level});});return pool.filter(x=>x.t&&!v41Same(x.t,correct))}
function v41ScoreCandidate(x,q,correct){let cl=Math.max(12,correct.length),d=Math.abs(x.t.length-cl)/cl,s=100-Math.min(70,d*70);if(x.kind==='old')s+=22;if(x.kind==='lesson-key')s+=32;if(x.kind==='unit-key')s+=10;if(x.level===q.level)s+=6;if(V41_CUE_RE.test(x.t))s-=70;if(x.t.length<8)s-=20;return s}
function v41PickDistractors(q,L,idx){let correct=q.opts[q.ans];if((q.stem||'').includes('ลำดับ')&&correct.includes('→')){let seq=v41SeqDistractors(L);if(seq.length===3)return seq}let pool=v41CandidatePool(q).map(x=>Object.assign({},x,{s:v41ScoreCandidate(x,q,correct)})).sort((a,b)=>b.s-a.s),out=[];function add(x){if(!x||!x.t||v41Same(x.t,correct)||out.some(y=>v41Same(y,x.t)))return;out.push(x.t)}let old=pool.filter(x=>x.kind==='old'&&!V41_CUE_RE.test(x.t));let lessonKeys=pool.filter(x=>x.kind==='lesson-key');let unitKeys=pool.filter(x=>x.kind==='unit-key');add(old[0]);add(lessonKeys[0]);add(lessonKeys[1]);for(let x of unitKeys){if(out.length>=3)break;add(x)}for(let x of pool){if(out.length>=3)break;add(x)}q.opts.forEach((o,i)=>{if(out.length<3&&i!==q.ans)add({t:o})});return out.slice(0,3)}
function v41BuildItem(q,idx){let L=LESSONS.find(x=>x.id===q.lesson),correct=q.opts[q.ans],ds=v41PickDistractors(q,L,idx);while(ds.length<3)ds.push('ทบทวนข้อมูลในบทและเลือกข้อสรุปที่สอดคล้องกับ source มากที่สุด '+(ds.length+1));let ans=V41_KEY_PATTERN[idx%V41_KEY_PATTERN.length],opts=ds.slice(0,3);opts.splice(ans,0,correct);return Object.assign({},q,{opts,ans,bank:'harder-v4.1',difficulty:'Harder but fair',revision:'HBF v4.1',status:'v4.1 Harder Exam Bank — review candidate; SME re-review required',legacyStatus:q.status,legacyAnswer:q.opts[q.ans],distractorMethod:'plausible same-lesson/unit concepts; obvious cue options deprioritized'})}
const HARDER_QB=LEGACY_QB_V40.map((q,i)=>v41BuildItem(q,i));
function v41QC(){let ids=new Set(),dup=0,cues=0,key=[0,0,0,0];HARDER_QB.forEach(q=>{if(ids.has(q.id))dup++;ids.add(q.id);key[q.ans]++;let seen=new Set();q.opts.forEach((o,i)=>{let n=v41Norm(o);if(seen.has(n))dup++;seen.add(n);if(i!==q.ans&&V41_CUE_RE.test(o))cues++})});return{ok:HARDER_QB.length===180&&HARDER_QB.filter(q=>q.course===1).length===120&&HARDER_QB.filter(q=>q.course===2).length===60&&dup===0,count:HARDER_QB.length,c1:HARDER_QB.filter(q=>q.course===1).length,c2:HARDER_QB.filter(q=>q.course===2).length,key,dup,cues}}

v4Exam=function(scroll=true){v4Init();if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let e=st.v4Active;if(!e||e.submitted){assessmentHome();return}let B=v41Bank(e.bank||'legacy'),id=e.order[e.pos],q=B.find(x=>x.id===id),map=e.maps[id]||[0,1,2,3],done=Object.keys(e.answers).length,p=Math.round(done/e.order.length*100);document.getElementById('app').innerHTML='<div class="examwrap"><div class="card"><div class="head"><span><span class="tag">'+v41BankLabel(e.bank)+'</span> <span class="tag">'+v4ModeLabel(e.mode)+'</span></span><b>ข้อ '+(e.pos+1)+' / '+e.order.length+'</b></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><p class="muted">ตอบแล้ว '+done+' • Flag '+Object.values(e.flags||{}).filter(Boolean).length+'</p><h2 style="line-height:1.55">'+v4Esc(q.stem)+'</h2><div class="choice">'+map.map((orig,di)=>'<label><input type="radio" name="v4a" '+(e.answers[id]===orig?'checked':'')+' onchange="v4SetA(\''+id+'\','+orig+')"><b>'+String.fromCharCode(65+di)+'.</b> '+v4Esc(q.opts[orig])+'</label>').join('')+'</div><div class="foot"><div><button class="btn" onclick="v4Move(-1)" '+(e.pos===0?'disabled':'')+'>← ก่อนหน้า</button> <button class="btn" onclick="v4Flag(\''+id+'\')">'+(e.flags[id]?'★ ยกเลิก Flag':'☆ Flag')+'</button></div><div><button class="btn pri" onclick="v4Move(1)" '+(e.pos===e.order.length-1?'disabled':'')+'>ถัดไป →</button> <button class="btn good" onclick="v4RequestSubmit()">Submit</button></div></div></div><div class="card examnav"><div class="head"><b>Question navigator</b><b id="v4timer">--:--</b></div><div class="qnums">'+e.order.map((x,k)=>'<button class="qnum '+(e.answers[x]!==undefined?'done ':'')+(k===e.pos?'current ':'')+'" style="'+(e.flags[x]?'box-shadow:inset 0 0 0 2px var(--warn)':'')+'" onclick="v4Jump('+k+')">'+(k+1)+'</button>').join('')+'</div></div></div>';if(scroll)window.scrollTo({top:0,behavior:'smooth'});v4Tick();v4TimerHandle=setInterval(v4Tick,1000)};
v4Submit=function(auto=false){if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let e=st.v4Active;if(!e||e.submitted)return;let B=v41Bank(e.bank||'legacy'),cor=0,wrong=0,un=0,wu={};e.order.forEach(id=>{let q=B.find(x=>x.id===id),a=e.answers[id];if(a===undefined){un++;wu[q.unit]=(wu[q.unit]||0)+1}else if(a===q.ans)cor++;else{wrong++;wu[q.unit]=(wu[q.unit]||0)+1}});let ended=Date.now(),r={id:'A'+ended,mode:e.mode,bank:e.bank||'legacy',label:v4ModeLabel(e.mode),date:new Date(ended).toISOString(),correct:cor,wrong,unanswered:un,total:e.order.length,answered:e.order.length-un,pct:Math.round(cor/e.order.length*100),seconds:Math.floor((ended-e.startedAt)/1000),autoSubmitted:auto,wrongUnits:wu};Object.entries(wu).forEach(([u,n])=>st.v4Weak[u]=(st.v4Weak[u]||0)+n);st.v4History=[r,...(st.v4History||[])].slice(0,60);e.submitted=true;e.result=r;e.endedAt=ended;save();v4Result()};
v4Result=function(){v4Init();if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let e=st.v4Active,r=e?.result;if(!e||!r){assessmentHome();return}document.getElementById('app').innerHTML='<div class="hero" style="text-align:center"><span class="tag">Submitted</span><span class="tag">'+v41BankLabel(r.bank)+'</span><h1>ผลการทำข้อสอบ</h1><div class="big">'+r.pct+'%</div><h2>'+r.correct+' / '+r.total+'</h2><div class="stats"><div class="card stat"><b>'+r.correct+'</b><span class="muted">ถูก</span></div><div class="card stat"><b>'+r.wrong+'</b><span class="muted">ผิด</span></div><div class="card stat"><b>'+r.unanswered+'</b><span class="muted">ไม่ได้ตอบ</span></div><div class="card stat"><b>'+v4Fmt(r.seconds)+'</b><span class="muted">เวลา</span></div><div class="card stat"><b>'+v4ModeLabel(r.mode)+'</b><span class="muted">Mode</span></div></div><p><button class="btn pri" onclick="v4Review(\'wrong\')">Review ข้อผิด</button> <button class="btn" onclick="v4Review(\'all\')">Review ทั้งหมด</button> <button class="btn" onclick="v4CopyResult()">Copy Summary</button> <button class="btn" onclick="assessmentHome()">กลับ Practice</button></p></div><div class="call warn"><b>สถานะข้อสอบ:</b> '+(r.bank==='legacy'?'Legacy approved bank เดิม':'v4.1 Harder Bank เป็น Review Candidate; การแก้ตัวเลือกทั้ง 180 ข้อต้อง re-review ก่อน FINAL')+'</div>'};
v4Review=function(filter){let e=st.v4Active,r=e?.result;if(!e||!r){assessmentHome();return}let B=v41Bank(e.bank||'legacy'),rows=e.order.map((id,i)=>({q:B.find(x=>x.id===id),i,sel:e.answers[id]}));if(filter==='wrong')rows=rows.filter(x=>x.sel===undefined||x.sel!==x.q.ans);document.getElementById('app').innerHTML='<div class="hero"><span class="tag">Review</span><span class="tag">'+v41BankLabel(e.bank)+'</span><h1>'+v4ModeLabel(r.mode)+'</h1><p>'+rows.length+' ข้อ • เฉลยเปิดหลัง Submit</p><button class="btn" onclick="v4Result()">← ผลคะแนน</button></div>'+rows.map(x=>v4ReviewBlock(x.q,x.i,x.sel,e.maps[x.q.id]||[0,1,2,3])).join('');window.scrollTo({top:0,behavior:'smooth'})};
v4CopyResult=function(){let r=st.v4Active?.result;if(!r)return;let nl=String.fromCharCode(10),t='Kidney & RRT Exam Prep v4.3'+nl+v41BankLabel(r.bank)+nl+r.label+nl+'Score '+r.correct+'/'+r.total+' ('+r.pct+'%)'+nl+'Wrong '+r.wrong+' • Unanswered '+r.unanswered+nl+'Time '+v4Fmt(r.seconds);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Copied'));else prompt('Copy result:',t)};

function v42Stem(q,idx){let L=LESSONS.find(x=>x.id===q.lesson),s=String(q.stem||''),correct=q.opts[q.ans],sec=L&&L.sections?L.sections:[],caseTxt=L&&L.case?L.case:'',a=sec.length?sec[(idx+1)%sec.length]:'',b=sec.length>1?sec[(idx+2)%sec.length]:a,src=q.source||((L&&L.src||[]).map(k=>SOURCES[k]?.[0]||k).join(' • '));if(correct&&correct.includes('→'))return 'สถานการณ์: '+caseTxt+' หากต้องจัดลำดับการคิด/การดำเนินการให้สอดคล้องกับกรอบในบทและไม่ข้ามขั้นสำคัญ ข้อใดเรียงลำดับได้เหมาะสมที่สุด?';if(/pitfall|ควรหลีกเลี่ยง|สับสน/i.test(s))return 'ทีมกำลังทบทวนกรณีต่อไปนี้: '+caseTxt+' เมื่อเทียบกับสาระ “'+a+'” ข้อใดเป็นการตีความที่ควรถูกทักท้วงมากที่สุดตามเอกสารต้นทาง?';if(q.level==='Apply'||q.level==='Analyze')return 'สถานการณ์: '+caseTxt+' ขณะตัดสินใจต้องพิจารณาทั้ง “'+a+'” และ “'+b+'” ไม่ใช่ดูข้อมูลเพียงจุดเดียว ข้อใดเป็นข้อสรุป/แนวทางที่สอดคล้องกับบทเรียนมากที่สุด?';if(q.level==='Remember')return 'ในการทบทวนเอกสารต้นทางของบท “'+(L?L.title:q.lesson)+'” ผู้เรียนต้องแยกข้อเท็จจริงเฉพาะของเนื้อหาออกจากข้อความที่ดูสมเหตุสมผลทั่วไป ข้อใดตรงกับสาระใน source มากที่สุด?';return 'เมื่อเปรียบเทียบข้อความ 4 ข้อต่อกรอบของบท “'+(L?L.title:q.lesson)+'” โดยเน้น “'+a+'” ข้อใดสอดคล้องกับเอกสารต้นทางมากที่สุด?'}
const REWRITE_QB=HARDER_QB.map((q,i)=>Object.assign({},q,{stem:v42Stem(q,i),bank:'rewrite-v4.2',difficulty:'Harder — rewritten stem',revision:'Rewrite Stem v4.2',status:'v4.2 Rewrite Stem — review candidate; SME re-review required',previousStem:q.stem}));
function v42QC(){let seen=new Set(),dups=0;REWRITE_QB.forEach(q=>{let n=v41Norm(q.stem);if(seen.has(n))dups++;seen.add(n)});return{count:REWRITE_QB.length,c1:REWRITE_QB.filter(q=>q.course===1).length,c2:REWRITE_QB.filter(q=>q.course===2).length,dups,ok:REWRITE_QB.length===180&&REWRITE_QB.filter(q=>q.course===1).length===120&&REWRITE_QB.filter(q=>q.course===2).length===60&&dups===0}}

v4Pool=function(t,bankName='rewrite'){let B=v41Bank(bankName);if(t==='pre'||t==='random30')return v4Shuffle(B).slice(0,30);if(t==='quick10')return v4Shuffle(B).slice(0,10);if(t==='mock60')return v4Shuffle([...v4Shuffle(B.filter(q=>q.course===1)).slice(0,40),...v4Shuffle(B.filter(q=>q.course===2)).slice(0,20)]);if(t==='c1')return B.filter(q=>q.course===1);if(t==='c2')return B.filter(q=>q.course===2);if(t==='full')return B.slice();if(t.startsWith('set')){let n=Number(t.slice(3));return B.slice((n-1)*10,n*10)}return B.slice(0,10)};

}

v4Exam=function(scroll=true){v4Init();if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let e=st.v4Active;if(!e||e.submitted){assessmentHome();return}let B=v41Bank(e.bank||'entrance'),id=e.order[e.pos],q=B.find(x=>x.id===id),map=e.maps[id]||[0,1,2,3],done=Object.keys(e.answers).length,p=Math.round(done/e.order.length*100),answered=e.answers[id]!==undefined,sel=e.answers[id],correctLetter=String.fromCharCode(65+Math.max(0,map.indexOf(q.ans))),isCorrect=answered&&sel===q.ans;let choices=map.map((orig,di)=>{let bg='#ffffff',bd='#cbd5e1',mark='';if(answered&&orig===q.ans){bg='#e8f4ec';bd='#7db394';mark=' ✓'}else if(answered&&orig===sel&&sel!==q.ans){bg='#fbeaea';bd='#d49a9a';mark=' ✕'}return '<label style="background:'+bg+'!important;border-color:'+bd+'!important"><input type="radio" name="v4a" '+(sel===orig?'checked':'')+' '+(answered?'disabled':'')+' onchange="v4SetA(\''+id+'\','+orig+')"><b>'+String.fromCharCode(65+di)+'.</b> '+v4Esc(q.opts[orig])+mark+'</label>'}).join('');let feedback=answered?'<div class="call '+(isCorrect?'':'bad')+'" style="margin-top:16px"><h3 style="margin:0 0 8px">'+(isCorrect?'✓ ถูกต้อง':'✕ ยังไม่ถูก')+'</h3><div><b>เฉลย:</b> '+correctLetter+'. '+v4Esc(q.opts[q.ans])+'</div><div style="margin-top:8px"><b>เหตุผล:</b> '+v4Esc(q.why||'—')+'</div><div style="margin-top:6px"><b>Source:</b> '+v4Esc(q.source||'—')+'</div></div>':'';document.getElementById('app').innerHTML='<div class="examwrap"><div class="card"><div class="head"><span><span class="tag">v4.3.3 Practice + เฉลยทันที</span> <span class="tag">'+v4ModeLabel(e.mode)+'</span></span><b>ข้อ '+(e.pos+1)+' / '+e.order.length+'</b></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><p class="muted">ตอบแล้ว '+done+' • เลือกคำตอบแล้วจะแสดงเฉลยและเหตุผลทันที</p><h2 style="line-height:1.55">'+v4Esc(q.stem)+'</h2><div class="choice">'+choices+'</div>'+feedback+'<div class="foot"><div><button class="btn" onclick="v4Move(-1)" '+(e.pos===0?'disabled':'')+'>← ก่อนหน้า</button> <button class="btn" onclick="v4Flag(\''+id+'\')">'+(e.flags[id]?'★ ยกเลิก Flag':'☆ Flag')+'</button></div><div>'+(e.pos<e.order.length-1?'<button class="btn pri" onclick="v4Move(1)">ถัดไป →</button>':'<button class="btn good" onclick="v4RequestSubmit()">Submit</button>')+'</div></div></div><div class="card examnav"><div class="head"><b>Question navigator</b><b id="v4timer">--:--</b></div><div class="qnums">'+e.order.map((x,k)=>'<button class="qnum '+(e.answers[x]!==undefined?'done ':'')+(k===e.pos?'current ':'')+'" style="'+(e.flags[x]?'box-shadow:inset 0 0 0 2px var(--warn)':'')+'" onclick="v4Jump('+k+')">'+(k+1)+'</button>').join('')+'</div><p class="muted">เขียว = ตอบแล้ว • หลังเลือกคำตอบจะล็อกข้อนั้นและแสดงเฉลย</p></div></div>';if(scroll)window.scrollTo({top:0,behavior:'smooth'});v4Tick();v4TimerHandle=setInterval(v4Tick,1000)};
instructor=function(){v4Init();side();if(v4TimerHandle){clearInterval(v4TimerHandle);v4TimerHandle=null}let h=st.v4History||[],done=LESSONS.filter(L=>st.done[L.id]).length;document.getElementById('app').innerHTML='<div class="hero"><span class="tag">v4.3.3 Progress</span><h1>Learning Progress & Scores</h1><p>เรียนจบ '+done+'/'+LESSONS.length+' บท • Course 1 '+pct(1)+'% • Course 2 '+pct(2)+'% • Overall '+pct()+'%</p><p><button class="btn pri" onclick="eLearningHome()">กลับ E-Learning</button> <button class="btn" onclick="assessmentHome()">Practice</button></p></div><h2>Attempt History</h2><div class="card" style="overflow:auto"><table class="tbl"><tr><th>วันที่</th><th>ชุด</th><th>คะแนน</th><th>เวลา</th></tr>'+(h.length?h.map(x=>'<tr><td>'+new Date(x.date).toLocaleString('th-TH')+'</td><td>'+v4Esc(x.label)+'</td><td><b>'+x.pct+'%</b> ('+x.correct+'/'+x.total+')</td><td>'+v4Fmt(x.seconds)+'</td></tr>').join(''):'<tr><td colspan="4">ยังไม่มีประวัติข้อสอบ</td></tr>')+'</table></div><h2>Lesson Progress</h2><div class="card" style="overflow:auto"><table class="tbl"><tr><th>Lesson</th><th>Status</th><th>Screen</th><th>Bookmark</th></tr>'+LESSONS.map(L=>'<tr><td>'+L.id+' — '+L.title+'</td><td>'+(st.done[L.id]?'Completed':'In progress')+'</td><td>'+((st.screen[L.id]||0)+1)+'/'+L.screens.length+'</td><td>'+(st.bookmark[L.id]!==undefined?'S'+(st.bookmark[L.id]+1):'—')+'</td></tr>').join('')+'</table></div>'};
v4Init();home();
</script></body></html>
