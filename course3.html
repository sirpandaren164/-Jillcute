const DATA={"title":"วิชาที่ 3 หลักการพยาบาลผู้ป่วยโรคเรื้อรังและการวิเคราะห์ผลลัพธ์","version":"v1.0","passScore":80,"units":[{"id":"U1","title":"Chronic Care & Self-Management","thai":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","concepts":[["ความหมายของ Self-Management","ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ","ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ","เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ","Self-Management CKD pp.4–5"],["Self-Monitoring","การติดตามตนเองคือการสังเกตและบันทึกพฤติกรรม อาการ หรือข้อมูลสุขภาพของตนเองอย่างเป็นระบบ","ให้ผู้ป่วยติดตามข้อมูลที่มีความหมาย เช่น น้ำหนัก ความดัน อาการบวม หรือการรับประทานยา","ตรวจพบการเปลี่ยนแปลงและอุปสรรคได้เร็วขึ้น","Self-Management CKD p.6"],["Self-Evaluation","การประเมินตนเองคือการนำข้อมูลที่ติดตามไว้มาเทียบกับเป้าหมายหรือมาตรฐานเพื่อดูว่าต้องปรับอะไร","ทบทวนข้อมูลร่วมกับผู้ป่วยและถามว่าผลที่เกิดขึ้นตรงเป้าหมายเพียงใด","ผู้ป่วยเห็นช่องว่างระหว่างพฤติกรรมจริงกับเป้าหมาย","Self-Management CKD p.6"],["Self-Reinforcement","การเสริมแรงตนเองคือการให้รางวัลหรือกำลังใจตนเองเมื่อทำตามเป้าหมาย เพื่อคงแรงจูงใจภายใน","ช่วยผู้ป่วยกำหนดวิธีให้กำลังใจตนเองและปรับแผนเมื่อยังไม่บรรลุเป้าหมาย","เพิ่มความยั่งยืนของพฤติกรรมที่เหมาะสม","Self-Management CKD p.6"],["Core Self-Management Skills","ทักษะสำคัญประกอบด้วยการแก้ปัญหา การตัดสินใจ การใช้ทรัพยากร การร่วมมือกับทีมสุขภาพ การลงมือปฏิบัติ และ self-efficacy","ฝึกให้ผู้ป่วยเลือกทางแก้ปัญหาจริงและรู้ว่าจะขอความช่วยเหลือจากใครเมื่อจำเป็น","ผู้ป่วยตัดสินใจและลงมือดูแลตนเองได้ดีขึ้น","Self-Management CKD p.7"],["สามงานหลักของการจัดการตนเอง","การจัดการตนเองครอบคลุม Medical management, Role management และ Emotional management","ประเมินทั้งการรักษา บทบาทชีวิต/งาน/ครอบครัว และผลกระทบทางอารมณ์ ไม่เน้นเฉพาะยาและอาหาร","แผนดูแลครอบคลุมชีวิตจริงและคุณภาพชีวิตของผู้ป่วย","Self-Management CKD pp.9–10"],["แนวทาง 5A","5A คือ Assess, Advise, Agree, Assist และ Arrange ใช้เป็นวงจรสนับสนุนการเปลี่ยนพฤติกรรม","ประเมินความพร้อม ให้คำแนะนำเฉพาะบุคคล ตั้ง SMART goal ร่วมกัน ช่วยแก้อุปสรรค และนัดติดตาม","เพิ่มโอกาสที่เป้าหมายจะนำไปปฏิบัติจริงและติดตามต่อเนื่อง","Self-Management CKD p.10"],["Teach-back & Health Literacy","Teach-back ตรวจความเข้าใจโดยให้ผู้ป่วยอธิบายหรือสาธิตกลับด้วยคำของตนเอง ไม่ใช่ถามเพียงว่าเข้าใจหรือไม่","หลังให้ข้อมูล ให้ผู้ป่วยเล่ากลับว่าต้องทำอะไร และอธิบายใหม่หากยังไม่ครบ","ลดความคลาดเคลื่อนจากการสื่อสารและเพิ่มความเข้าใจที่นำไปใช้ได้","Self-Management CKD p.11"]]},{"id":"U2","title":"Pre-RRT CKD Nursing","thai":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","concepts":[["เป้าหมายการดูแล CKD ก่อน RRT","เป้าหมายสำคัญคือคัดกรอง/ส่งต่อ ชะลอไตเสื่อม ป้องกันภาวะแทรกซ้อน ลดความเสี่ยงหัวใจและหลอดเลือด และเตรียม RRT อย่างเหมาะสม","วางแผนดูแลตามระยะโรคโดยไม่รอจนเกิดภาวะฉุกเฉินหรือมีข้อบ่งชี้ฟอกไตแล้ว","ลดการเกิดภาวะแทรกซ้อนและเพิ่มความพร้อมก่อนเริ่ม RRT","การดูแล CKD ระยะก่อน RRT pp.4–7"],["การคัดกรองและยืนยัน CKD","การคัดกรองต้องประเมินการทำงานของไตและความผิดปกติในปัสสาวะ และความเรื้อรังต้องอาศัยข้อมูลต่อเนื่อง","เมื่อพบความผิดปกติที่อาจเป็น CKD ให้ติดตาม/ตรวจซ้ำตามแนวทางเพื่อยืนยัน chronicity","ลดการวินิจฉัยจากค่าผิดปกติครั้งเดียวและตรวจพบ CKD ได้เหมาะสม","การดูแล CKD ระยะก่อน RRT ข้อแนะนำ 1–3"],["โภชนบำบัดและพลังงาน","การจำกัดโปรตีนต้องทำร่วมกับการได้รับพลังงานเพียงพอ มิฉะนั้นเสี่ยงสลายโปรตีนในร่างกายและทุพโภชนาการ","ประเมิน intake น้ำหนัก แนวโน้มมวลกล้ามเนื้อ และส่งต่อผู้เชี่ยวชาญด้านโภชนาการเมื่อจำเป็น","ชะลอไตเสื่อมโดยไม่เพิ่มความเสี่ยง protein-energy wasting","Self-Management CKD nutrition section"],["การจำกัดโซเดียม","การลดโซเดียมช่วยควบคุมความดัน ปริมาตรสารน้ำ และลดภาวะบวม","สอนอ่านฉลากและลดอาหารแปรรูป/เครื่องปรุงเค็ม โดยเชื่อมกับพฤติกรรมจริงของผู้ป่วย","ควบคุมความดันและภาวะน้ำเกินได้ดีขึ้น","Self-Management CKD sodium section"],["การติดตามสารน้ำด้วยน้ำหนัก","น้ำหนักตัวที่ติดตามสม่ำเสมอเป็นข้อมูลที่ช่วยจับภาวะน้ำเกินได้เร็วกว่ารอให้บวมชัด","ให้ชั่งน้ำหนักเวลาใกล้เคียงกันและสังเกตแนวโน้มร่วมกับอาการบวม/หอบและปริมาณปัสสาวะ","ตรวจพบ fluid retention ได้เร็วและลดโอกาสเกิด pulmonary congestion","Self-Management CKD fluid section"],["การประเมินโพแทสเซียม","การจัดการโพแทสเซียมต้องดูผลเลือด ยาที่ใช้ อาหาร และอาการเตือนร่วมกัน ไม่ควรจำกัดแบบเหมารวมทุกคน","ทบทวน ACEI/ARB/ยาที่มีผลต่อโพแทสเซียมและสอนอาการเตือนที่ต้องมาพบแพทย์","ลดความเสี่ยงภาวะโพแทสเซียมผิดปกติที่มีผลต่อหัวใจ","Self-Management CKD potassium section"],["Medication Safety in CKD","ความปลอดภัยด้านยาต้องทบทวนยาทั้งหมด รวม OTC ยาชุด สมุนไพร/อาหารเสริม และปรับขนาดยาตามการทำงานของไต","ถามยาที่ซื้อเองทุกครั้ง เน้นหลีกเลี่ยง nephrotoxin โดยเฉพาะ NSAIDs และประสานแพทย์/เภสัชกร","ลด adverse drug event และการทำงานของไตแย่ลงจากยา","Self-Management CKD medication section"],["การเตรียมความพร้อมสู่ RRT","การเตรียม RRT เป็นกระบวนการก่อนเกิดวิกฤต ครอบคลุมข้อมูลทางเลือก การตัดสินใจ การเตรียม access/ส่งต่อปลูกถ่าย และการเตรียมครอบครัว","เริ่ม education และ shared planning ตั้งแต่ CKD ระยะก้าวหน้า ไม่รอ emergency start","ลด unplanned dialysis start และเพิ่มความพร้อมด้านกาย–จิตสังคม","การดูแล CKD ระยะก่อน RRT ข้อแนะนำ 17"]]},{"id":"U3","title":"Primary Nursing in Dialysis","thai":"Primary Nursing และความต่อเนื่องของการดูแล","concepts":[["Primary Nursing & Continuity","Primary Nursing เน้นความรับผิดชอบต่อผู้ป่วยที่ได้รับมอบหมายอย่างต่อเนื่อง ต่างจากการดูแลแบบเปลี่ยนผู้รับผิดชอบเป็นรอบ","กำหนด Primary Nurse ให้ติดตามผู้ป่วยคนเดิมและเชื่อมข้อมูลข้ามครั้งการรักษา","เกิด Continuity of Care และความสัมพันธ์เชิงรักษาที่ต่อเนื่อง","Primary Nursing pp.1–2"],["เป้าหมายของ Primary Nurse","เป้าหมายครอบคลุมการยกระดับคุณภาพชีวิต การดูแลเฉพาะบุคคล การป้องกันภาวะแทรกซ้อน คุณภาพการพยาบาล และความต่อเนื่อง","ใช้ข้อมูลผู้ป่วยรายบุคคลเพื่อจัดลำดับปัญหาและติดตามผลระยะยาว","ผู้ป่วยได้รับการดูแลแบบ patient-centered และต่อเนื่อง","Primary Nursing p.5"],["Assignment of Care","โครงสร้างงานแยกบทบาท Nurse Manager, Primary Nurse และ Associate Nurse โดย Primary Nurse เป็นเจ้าของแผนดูแลหลักของผู้ป่วย","Primary Nurse วางแผนและติดตาม ส่วน Associate Nurse ปฏิบัติตามแผนและส่งต่อข้อมูลเมื่อ Primary Nurse ไม่อยู่","ความรับผิดชอบชัดเจนและลดข้อมูลตกหล่นระหว่างทีม","Primary Nursing pp.6–7"],["Comprehensive Assessment","การประเมินของ Primary Nurse ต้องครอบคลุม Physical, Psychological, Social และ Rights/สิทธิการรักษา","ประเมินอาการ ภาวะโภชนาการ ความเครียด/ซึมเศร้า การสนับสนุนทางสังคม และข้อจำกัดด้านสิทธิ/การเข้าถึง","ได้แผนดูแลที่สอดคล้องกับปัญหาจริงทั้งด้านคลินิกและชีวิต","Primary Nursing p.8"],["Nursing Care Plan","Care Plan ที่ดีเชื่อม Nursing problem → Goal → Intervention → Indicator โดยเป้าหมายต้องวัดผลได้","กำหนดปัญหาและตัวชี้วัดที่ติดตามได้ ไม่เขียนเป้าหมายกว้างโดยไม่มีเกณฑ์","ประเมินได้ว่าการพยาบาลทำให้ผลลัพธ์ดีขึ้นหรือไม่","Primary Nursing p.9"],["Patient Journey: Pre–Intra–Post Dialysis","การดูแลหนึ่งรอบฟอกเลือดต้องเชื่อม Pre-dialysis assessment, Intra-dialysis surveillance และ Post-dialysis evaluation/continuity","ก่อนฟอกประเมินผู้ป่วย/access/prescription ระหว่างฟอกเฝ้าระวังและตอบสนองทันที หลังฟอกประเมินผล ให้ความรู้ และบันทึก","ความปลอดภัยและความต่อเนื่องตลอด treatment cycle","Primary Nursing pp.13–16"],["Quality Assurance Shield","ระบบประกันคุณภาพในหน่วยไตเทียมต้องครอบคลุม infection control, RO water standard, adequacy/indicators และ incident reporting","ใช้ข้อมูลคุณภาพและเหตุการณ์ความเสี่ยงเพื่อแก้ระบบ ไม่ใช้เฉพาะตรวจเอกสาร","ลดความเสี่ยงและทำให้การดูแลเป็นมาตรฐานสม่ำเสมอ","Primary Nursing p.17"]]},{"id":"U4","title":"Hemodialysis Case Management","thai":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","concepts":[["Case Manager Focus","Case Manager เน้นผู้ป่วยรายบุคคลที่มีความซับซ้อนสูงและต้องประสานการดูแลหลายด้าน","คัดเลือกผู้ป่วยที่มีปัญหาซ้ำซ้อนหรือความเสี่ยงสูง แล้วสร้างแผนรายบุคคล","ลดปัญหาซ้ำและเพิ่มความต่อเนื่องของผู้ป่วยรายนั้น","Case Management pp.2–4"],["5-in-1 Case Manager Roles","บทบาทหลักประกอบด้วย Care Coordinator, Clinical Monitor, Navigator, Educator และ Patient Advocate","สลับบทบาทตามปัญหาของผู้ป่วย เช่น ประสานทีม ติดตามอาการ ช่วยเข้าถึงบริการ สอน และพิทักษ์สิทธิ","ผู้ป่วยได้รับการดูแลเชื่อมโยงทั้งระบบและมีผู้รับผิดชอบชัดเจน","Case RT Competency quality improvement"]]},{"id":"U6","title":"Nurse-led Renal Care","thai":"Nurse-led Renal Care และ Clinical Leadership","concepts":[["Nurse-led Care Model","Nurse-led care คือการขยายบทบาทพยาบาลภายใต้มาตรฐานและขอบเขตที่กำหนด ไม่ใช่การทำงานแทนแพทย์โดยไม่มีระบบรองรับ","มอบหมายการประเมิน ติดตาม และการดำเนินการที่อยู่ใน protocol พร้อมระบบ escalation","ลดเวลารอและเพิ่มความต่อเนื่องโดยยังคงความปลอดภัย","Nurse-led Renal Care p.1"],["3 Pillars of Decentralized Care","สามเสาหลักคือแบ่งกลุ่มผู้ป่วยตามระดับความเสี่ยง การพยาบาลตามแนวทางปฏิบัติ และศูนย์กลางประสานงานสหสาขาวิชาชีพ","ใช้ risk tier เพื่อกำหนด intensity ของการติดตามและทำงานบน protocol เดียวกัน","การกระจายอำนาจทางคลินิกมีมาตรฐานและไม่เกิดการดูแลแบบต่างคนต่างทำ","Nurse-led Renal Care p.2"],["360° Nurse-led Cycle","วงจรประกอบด้วย proactive assessment, shared decision making, remote monitoring และ protocol-based care-plan adjustment","ติดตามภาวะแทรกซ้อนเชิงรุก พร้อมปรับแผนตาม protocol และเชื่อมการติดตามทางไกล","ดูแลต่อเนื่องก่อนเกิด crisis และตอบสนองต่อการเปลี่ยนแปลงได้เร็ว","Nurse-led Renal Care p.3"],["Safety Boundary & Escalation","การตัดสินใจใน nurse-led clinic ต้องมีจุดตรวจ safety: หากอยู่ใน protocol ดำเนินการได้ หากนอก protocol/วิกฤตต้องส่งต่อ","ระบุ red flags และเกณฑ์ consult/referral ไว้ชัดเจนก่อนเริ่มบริการ","ขยายบทบาทพยาบาลโดยไม่ลด safety margin","Nurse-led Renal Care p.4"],["Remote Follow-up","การติดตามต่อเนื่องสามารถใช้โทรศัพท์หรือ telehealth ภายใต้แผนที่กำหนด","ติดตามอาการ ผลลัพธ์ และ adherence หลังการปรับแผน พร้อมช่องทาง escalation","ลดการขาดช่วงของการดูแลและตรวจพบปัญหาได้เร็วขึ้น","Nurse-led Renal Care pp.3–4"],["Clinical + SDM + Behavioral Design","การดูแล nurse-led ที่สมบูรณ์เชื่อม Clinical Management, Shared Decision Making และ Behavioral Design","แก้ปัญหาคลินิกพร้อมเตรียมความเข้าใจ/ความพร้อมของผู้ป่วยและออกแบบพฤติกรรมที่ทำได้จริง","ได้ผลทั้งด้านคลินิก ความเครียด/ความพร้อม และความยั่งยืนของพฤติกรรม","Nurse-led Renal Care p.5"]]},{"id":"U7","title":"Shared Renal Care Decisions","thai":"Shared Decision Making และการเลือก RRT","concepts":[["Shared Decision Making","SDM คือกระบวนการที่ทีมรักษา ผู้ป่วย และครอบครัวแลกเปลี่ยนข้อมูลและร่วมเลือกแนวทางที่สอดคล้องกับเป้าหมายชีวิต","อธิบายทางเลือกและ trade-off แล้วสำรวจคุณค่า/ความต้องการก่อนตัดสินใจ","การเลือก RRT สอดคล้องทั้งข้อมูลทางคลินิกและชีวิตของผู้ป่วย","Shared Renal Care Decisions pp.2–3"],["SDM Roadmap 4 Steps","Roadmap ประกอบด้วย Timing of Initiation → Modality Selection → Personal Dimensions → Advance Care Planning","อย่าข้ามบริบทส่วนบุคคลและการวางแผนล่วงหน้าแม้เลือก modality ได้แล้ว","ลดการตัดสินใจแบบเร่งด่วนและเพิ่มความพร้อมระยะยาว","Shared Renal Care Decisions p.3"],["Timing of Initiation","การเริ่ม RRT ไม่ควรใช้ค่า eGFR ค่าเดียว แต่ต้องพิจารณาอาการ ภาวะแทรกซ้อน และบริบททางคลินิก","ประเมิน uremic symptoms, volume/electrolyte/acid-base problems และ trajectory ร่วมกัน","เริ่ม RRT ในเวลาที่เหมาะสม ไม่เร็วหรือช้าเพราะตัวเลขเดี่ยว","Shared Renal Care Decisions pp.4–5"],["Modality Selection","ทางเลือกหลักได้แก่ PD, HD และ KT โดยแต่ละวิธีมีข้อดี ข้อจำกัด และผลต่อวิถีชีวิตต่างกัน","เปรียบเทียบทางเลือกให้ผู้ป่วยเห็นผลต่อเวลา การเดินทาง บ้าน ผู้ดูแล และความเป็นอิสระ","เลือก modality ที่เหมาะกับ clinical fit และ life fit","Shared Renal Care Decisions pp.6–12"],["Personal Dimensions","ปัจจัย SDM ต้องรวม Medical context, Caregiver support, Financial/Welfare และ Goal of Care","ประเมินผู้ดูแล บ้าน การเดินทาง สิทธิ ค่าใช้จ่าย และเป้าหมายชีวิตก่อนสรุป feasibility","ลดการเลือกวิธีที่เหมาะทางการแพทย์แต่ไม่สามารถทำได้จริงในชีวิตประจำวัน","Shared Renal Care Decisions p.13"],["Advance Care Planning","ACP คือการเตรียมแผนล่วงหน้าสำหรับทางเลือกและสถานการณ์ในอนาคต รวมการเตรียม access และการป้องกัน emergency start","กำหนด next step ที่ชัด เช่น access planning, transplant evaluation หรือ conservative-care discussion ตามบริบท","ผู้ป่วยมีแผนต่อเนื่องและลดการเริ่มรักษาแบบฉุกเฉิน","Shared Renal Care Decisions p.14"],["ESRD Care Pathway","Care Pathway เชื่อม Pre-ESRD → RRT decision → Access planning → Dialysis initiation → Maintenance/High-risk care → Transition/Home monitoring → End-of-life care","กำหนด owner, trigger และ next step ในแต่ละ stage เพื่อไม่ให้ผู้ป่วยหลุดจากระบบ","ลด fragmented care ตลอดเส้นทาง ESRD","Shared Renal Care Decisions pp.16–29"],["Clinical Decision Tools","Decision tools ช่วยเปลี่ยนข้อมูลกระจัดกระจายเป็นการคัดกรองความเสี่ยงและ action ที่กำหนดไว้ เช่น adequacy, anemia, access, nutrition, readmission และ self-management","ใช้ tool เป็น decision support และนำผลเข้า case conference/แผนดูแล ไม่ใช้แทน clinical judgment","การตัดสินใจสม่ำเสมอและมองเห็นผู้ป่วยเสี่ยงเร็วขึ้น","Shared Renal Care Decisions pp.30–39"]]},{"id":"U8","title":"Psychosocial, Safety & Integrated Outcomes","thai":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","concepts":[["Psychosocial Assessment","การประเมินผู้ป่วยโรคไตต้องครอบคลุมความเครียด ซึมเศร้า ความเชื่อ บทบาทครอบครัว การสนับสนุน และอุปสรรคทางสังคม","ใช้การสนทนาและเครื่องมือคัดกรองเป็นส่วนหนึ่งของการประเมิน ไม่ใช้คะแนนแทนการประเมินทั้งหมด","พบปัจจัยที่กระทบ adherence คุณภาพชีวิต และความเป็นไปได้ของแผนรักษา","Psychosocial CKD + Self-Management CKD"],["Depression & Anxiety Screening","PHQ-9/GAD-7 ใช้คัดกรอง ไม่ใช่เครื่องมือยืนยันการวินิจฉัยโดยลำพัง และอาการทางกายของ CKD อาจซ้อนทับอาการทางอารมณ์","แปลผลร่วมกับการสัมภาษณ์ ความเสี่ยง และอาการทางกายของโรคไต","คัดกรองผู้มีปัญหาได้เร็วโดยลดการตีความผิดจาก symptom overlap","Self-Management CKD mental-health section"],["Symptom Management","ผู้ป่วย CKD ระยะก้าวหน้ามักมีหลายอาการร่วมกัน จึงต้องประเมินสาเหตุและจัดการอย่างเป็นระบบ ไม่รักษาอาการแบบแยกส่วน","ประเมิน nausea, dyspnea, fatigue, pruritus และอาการอื่นร่วมกับ anemia, fluid, uremia, nutrition และยา","ลด symptom burden และเพิ่มคุณภาพชีวิต","Self-Management CKD symptom section"],["RRT Nurse Competency","สมรรถนะพยาบาล RRT ครอบคลุม clinical, technology, teaching/counseling, ethics, information technology, teamwork, infection control, QI/research และ leadership","ประเมินช่องว่างสมรรถนะเป็นรายด้านและพัฒนาต่อเนื่อง ไม่ใช้การผ่านอบรมครั้งเดียวแทน competency","เพิ่มความปลอดภัยและคุณภาพการดูแล RRT","RRT Nurse Competency 2026 pp.1–6"],["Quality Development 4 Approaches","แนวทางพัฒนาคุณภาพประกอบด้วยพัฒนาศักยภาพบุคลากร ใช้ clinical guideline มาตรฐาน สร้างระบบติดตามตัวชี้วัด และเสริมทีมสหสาขาวิชาชีพ","วางระบบทั้งคน มาตรฐาน ข้อมูล และทีม แทนการแก้เพียงองค์ประกอบเดียว","ลดภาวะแทรกซ้อนและเพิ่มคุณภาพชีวิตผู้ป่วย","RRT Nurse Competency 2026 abstract"],["Incident & Risk Learning","เหตุการณ์ผิดพลาดและ near miss ต้องถูกนำเข้าสู่ระบบเรียนรู้และปรับปรุง ไม่ใช่รอให้เกิดอันตรายรุนแรง","บันทึกเหตุการณ์ วิเคราะห์สาเหตุระบบ และติดตาม action ที่ป้องกันการเกิดซ้ำ","ลด recurrence และสร้าง safety culture","Primary Nursing Quality Assurance / Care Management Risk"],["Integrated Outcome Domains","การประเมินผลควรมอง Clinical Excellence, Patient Experience และ Safety/Risk พร้อมกัน","อย่าตัดสินคุณภาพจาก adequacy ดีเพียงตัวเดียว หาก infection, experience หรือ safety ยังมีปัญหา","ได้ภาพคุณภาพที่สมดุลและสะท้อนผลต่อผู้ป่วยจริง","Primary Nursing KPI section"],["From Data to Action","ข้อมูลมีคุณค่าเมื่อเปลี่ยนเป็นการคัดกรองความเสี่ยง การประชุม case/system review และ next action ที่มี owner","กำหนด trigger → responsible role → action → follow-up ทุกครั้งที่พบข้อมูลผิดปกติ","ลด dashboard ที่มีแต่ตัวเลขแต่ไม่เกิดการเปลี่ยนแปลงในการดูแล","Shared Decision Tools + Care Management"]]}],"concepts":[{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":1,"title":"ความหมายของ Self-Management","principle":"ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ","action":"ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ","outcome":"เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ","source":"Self-Management CKD pp.4–5"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":2,"title":"Self-Monitoring","principle":"การติดตามตนเองคือการสังเกตและบันทึกพฤติกรรม อาการ หรือข้อมูลสุขภาพของตนเองอย่างเป็นระบบ","action":"ให้ผู้ป่วยติดตามข้อมูลที่มีความหมาย เช่น น้ำหนัก ความดัน อาการบวม หรือการรับประทานยา","outcome":"ตรวจพบการเปลี่ยนแปลงและอุปสรรคได้เร็วขึ้น","source":"Self-Management CKD p.6"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":3,"title":"Self-Evaluation","principle":"การประเมินตนเองคือการนำข้อมูลที่ติดตามไว้มาเทียบกับเป้าหมายหรือมาตรฐานเพื่อดูว่าต้องปรับอะไร","action":"ทบทวนข้อมูลร่วมกับผู้ป่วยและถามว่าผลที่เกิดขึ้นตรงเป้าหมายเพียงใด","outcome":"ผู้ป่วยเห็นช่องว่างระหว่างพฤติกรรมจริงกับเป้าหมาย","source":"Self-Management CKD p.6"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":4,"title":"Self-Reinforcement","principle":"การเสริมแรงตนเองคือการให้รางวัลหรือกำลังใจตนเองเมื่อทำตามเป้าหมาย เพื่อคงแรงจูงใจภายใน","action":"ช่วยผู้ป่วยกำหนดวิธีให้กำลังใจตนเองและปรับแผนเมื่อยังไม่บรรลุเป้าหมาย","outcome":"เพิ่มความยั่งยืนของพฤติกรรมที่เหมาะสม","source":"Self-Management CKD p.6"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":5,"title":"Core Self-Management Skills","principle":"ทักษะสำคัญประกอบด้วยการแก้ปัญหา การตัดสินใจ การใช้ทรัพยากร การร่วมมือกับทีมสุขภาพ การลงมือปฏิบัติ และ self-efficacy","action":"ฝึกให้ผู้ป่วยเลือกทางแก้ปัญหาจริงและรู้ว่าจะขอความช่วยเหลือจากใครเมื่อจำเป็น","outcome":"ผู้ป่วยตัดสินใจและลงมือดูแลตนเองได้ดีขึ้น","source":"Self-Management CKD p.7"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":6,"title":"สามงานหลักของการจัดการตนเอง","principle":"การจัดการตนเองครอบคลุม Medical management, Role management และ Emotional management","action":"ประเมินทั้งการรักษา บทบาทชีวิต/งาน/ครอบครัว และผลกระทบทางอารมณ์ ไม่เน้นเฉพาะยาและอาหาร","outcome":"แผนดูแลครอบคลุมชีวิตจริงและคุณภาพชีวิตของผู้ป่วย","source":"Self-Management CKD pp.9–10"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":7,"title":"แนวทาง 5A","principle":"5A คือ Assess, Advise, Agree, Assist และ Arrange ใช้เป็นวงจรสนับสนุนการเปลี่ยนพฤติกรรม","action":"ประเมินความพร้อม ให้คำแนะนำเฉพาะบุคคล ตั้ง SMART goal ร่วมกัน ช่วยแก้อุปสรรค และนัดติดตาม","outcome":"เพิ่มโอกาสที่เป้าหมายจะนำไปปฏิบัติจริงและติดตามต่อเนื่อง","source":"Self-Management CKD p.10"},{"unit":"U1","unit_title":"หลักการดูแลโรคเรื้อรังและการจัดการตนเอง","lesson":8,"title":"Teach-back & Health Literacy","principle":"Teach-back ตรวจความเข้าใจโดยให้ผู้ป่วยอธิบายหรือสาธิตกลับด้วยคำของตนเอง ไม่ใช่ถามเพียงว่าเข้าใจหรือไม่","action":"หลังให้ข้อมูล ให้ผู้ป่วยเล่ากลับว่าต้องทำอะไร และอธิบายใหม่หากยังไม่ครบ","outcome":"ลดความคลาดเคลื่อนจากการสื่อสารและเพิ่มความเข้าใจที่นำไปใช้ได้","source":"Self-Management CKD p.11"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":1,"title":"เป้าหมายการดูแล CKD ก่อน RRT","principle":"เป้าหมายสำคัญคือคัดกรอง/ส่งต่อ ชะลอไตเสื่อม ป้องกันภาวะแทรกซ้อน ลดความเสี่ยงหัวใจและหลอดเลือด และเตรียม RRT อย่างเหมาะสม","action":"วางแผนดูแลตามระยะโรคโดยไม่รอจนเกิดภาวะฉุกเฉินหรือมีข้อบ่งชี้ฟอกไตแล้ว","outcome":"ลดการเกิดภาวะแทรกซ้อนและเพิ่มความพร้อมก่อนเริ่ม RRT","source":"การดูแล CKD ระยะก่อน RRT pp.4–7"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":2,"title":"การคัดกรองและยืนยัน CKD","principle":"การคัดกรองต้องประเมินการทำงานของไตและความผิดปกติในปัสสาวะ และความเรื้อรังต้องอาศัยข้อมูลต่อเนื่อง","action":"เมื่อพบความผิดปกติที่อาจเป็น CKD ให้ติดตาม/ตรวจซ้ำตามแนวทางเพื่อยืนยัน chronicity","outcome":"ลดการวินิจฉัยจากค่าผิดปกติครั้งเดียวและตรวจพบ CKD ได้เหมาะสม","source":"การดูแล CKD ระยะก่อน RRT ข้อแนะนำ 1–3"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":3,"title":"โภชนบำบัดและพลังงาน","principle":"การจำกัดโปรตีนต้องทำร่วมกับการได้รับพลังงานเพียงพอ มิฉะนั้นเสี่ยงสลายโปรตีนในร่างกายและทุพโภชนาการ","action":"ประเมิน intake น้ำหนัก แนวโน้มมวลกล้ามเนื้อ และส่งต่อผู้เชี่ยวชาญด้านโภชนาการเมื่อจำเป็น","outcome":"ชะลอไตเสื่อมโดยไม่เพิ่มความเสี่ยง protein-energy wasting","source":"Self-Management CKD nutrition section"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":4,"title":"การจำกัดโซเดียม","principle":"การลดโซเดียมช่วยควบคุมความดัน ปริมาตรสารน้ำ และลดภาวะบวม","action":"สอนอ่านฉลากและลดอาหารแปรรูป/เครื่องปรุงเค็ม โดยเชื่อมกับพฤติกรรมจริงของผู้ป่วย","outcome":"ควบคุมความดันและภาวะน้ำเกินได้ดีขึ้น","source":"Self-Management CKD sodium section"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":5,"title":"การติดตามสารน้ำด้วยน้ำหนัก","principle":"น้ำหนักตัวที่ติดตามสม่ำเสมอเป็นข้อมูลที่ช่วยจับภาวะน้ำเกินได้เร็วกว่ารอให้บวมชัด","action":"ให้ชั่งน้ำหนักเวลาใกล้เคียงกันและสังเกตแนวโน้มร่วมกับอาการบวม/หอบและปริมาณปัสสาวะ","outcome":"ตรวจพบ fluid retention ได้เร็วและลดโอกาสเกิด pulmonary congestion","source":"Self-Management CKD fluid section"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":6,"title":"การประเมินโพแทสเซียม","principle":"การจัดการโพแทสเซียมต้องดูผลเลือด ยาที่ใช้ อาหาร และอาการเตือนร่วมกัน ไม่ควรจำกัดแบบเหมารวมทุกคน","action":"ทบทวน ACEI/ARB/ยาที่มีผลต่อโพแทสเซียมและสอนอาการเตือนที่ต้องมาพบแพทย์","outcome":"ลดความเสี่ยงภาวะโพแทสเซียมผิดปกติที่มีผลต่อหัวใจ","source":"Self-Management CKD potassium section"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":7,"title":"Medication Safety in CKD","principle":"ความปลอดภัยด้านยาต้องทบทวนยาทั้งหมด รวม OTC ยาชุด สมุนไพร/อาหารเสริม และปรับขนาดยาตามการทำงานของไต","action":"ถามยาที่ซื้อเองทุกครั้ง เน้นหลีกเลี่ยง nephrotoxin โดยเฉพาะ NSAIDs และประสานแพทย์/เภสัชกร","outcome":"ลด adverse drug event และการทำงานของไตแย่ลงจากยา","source":"Self-Management CKD medication section"},{"unit":"U2","unit_title":"การพยาบาลผู้ป่วย CKD ระยะก่อนบำบัดทดแทนไต","lesson":8,"title":"การเตรียมความพร้อมสู่ RRT","principle":"การเตรียม RRT เป็นกระบวนการก่อนเกิดวิกฤต ครอบคลุมข้อมูลทางเลือก การตัดสินใจ การเตรียม access/ส่งต่อปลูกถ่าย และการเตรียมครอบครัว","action":"เริ่ม education และ shared planning ตั้งแต่ CKD ระยะก้าวหน้า ไม่รอ emergency start","outcome":"ลด unplanned dialysis start และเพิ่มความพร้อมด้านกาย–จิตสังคม","source":"การดูแล CKD ระยะก่อน RRT ข้อแนะนำ 17"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":1,"title":"Primary Nursing & Continuity","principle":"Primary Nursing เน้นความรับผิดชอบต่อผู้ป่วยที่ได้รับมอบหมายอย่างต่อเนื่อง ต่างจากการดูแลแบบเปลี่ยนผู้รับผิดชอบเป็นรอบ","action":"กำหนด Primary Nurse ให้ติดตามผู้ป่วยคนเดิมและเชื่อมข้อมูลข้ามครั้งการรักษา","outcome":"เกิด Continuity of Care และความสัมพันธ์เชิงรักษาที่ต่อเนื่อง","source":"Primary Nursing pp.1–2"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":2,"title":"เป้าหมายของ Primary Nurse","principle":"เป้าหมายครอบคลุมการยกระดับคุณภาพชีวิต การดูแลเฉพาะบุคคล การป้องกันภาวะแทรกซ้อน คุณภาพการพยาบาล และความต่อเนื่อง","action":"ใช้ข้อมูลผู้ป่วยรายบุคคลเพื่อจัดลำดับปัญหาและติดตามผลระยะยาว","outcome":"ผู้ป่วยได้รับการดูแลแบบ patient-centered และต่อเนื่อง","source":"Primary Nursing p.5"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":3,"title":"Assignment of Care","principle":"โครงสร้างงานแยกบทบาท Nurse Manager, Primary Nurse และ Associate Nurse โดย Primary Nurse เป็นเจ้าของแผนดูแลหลักของผู้ป่วย","action":"Primary Nurse วางแผนและติดตาม ส่วน Associate Nurse ปฏิบัติตามแผนและส่งต่อข้อมูลเมื่อ Primary Nurse ไม่อยู่","outcome":"ความรับผิดชอบชัดเจนและลดข้อมูลตกหล่นระหว่างทีม","source":"Primary Nursing pp.6–7"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":4,"title":"Comprehensive Assessment","principle":"การประเมินของ Primary Nurse ต้องครอบคลุม Physical, Psychological, Social และ Rights/สิทธิการรักษา","action":"ประเมินอาการ ภาวะโภชนาการ ความเครียด/ซึมเศร้า การสนับสนุนทางสังคม และข้อจำกัดด้านสิทธิ/การเข้าถึง","outcome":"ได้แผนดูแลที่สอดคล้องกับปัญหาจริงทั้งด้านคลินิกและชีวิต","source":"Primary Nursing p.8"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":5,"title":"Nursing Care Plan","principle":"Care Plan ที่ดีเชื่อม Nursing problem → Goal → Intervention → Indicator โดยเป้าหมายต้องวัดผลได้","action":"กำหนดปัญหาและตัวชี้วัดที่ติดตามได้ ไม่เขียนเป้าหมายกว้างโดยไม่มีเกณฑ์","outcome":"ประเมินได้ว่าการพยาบาลทำให้ผลลัพธ์ดีขึ้นหรือไม่","source":"Primary Nursing p.9"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":6,"title":"Patient Journey: Pre–Intra–Post Dialysis","principle":"การดูแลหนึ่งรอบฟอกเลือดต้องเชื่อม Pre-dialysis assessment, Intra-dialysis surveillance และ Post-dialysis evaluation/continuity","action":"ก่อนฟอกประเมินผู้ป่วย/access/prescription ระหว่างฟอกเฝ้าระวังและตอบสนองทันที หลังฟอกประเมินผล ให้ความรู้ และบันทึก","outcome":"ความปลอดภัยและความต่อเนื่องตลอด treatment cycle","source":"Primary Nursing pp.13–16"},{"unit":"U3","unit_title":"Primary Nursing และความต่อเนื่องของการดูแล","lesson":7,"title":"Quality Assurance Shield","principle":"ระบบประกันคุณภาพในหน่วยไตเทียมต้องครอบคลุม infection control, RO water standard, adequacy/indicators และ incident reporting","action":"ใช้ข้อมูลคุณภาพและเหตุการณ์ความเสี่ยงเพื่อแก้ระบบ ไม่ใช้เฉพาะตรวจเอกสาร","outcome":"ลดความเสี่ยงและทำให้การดูแลเป็นมาตรฐานสม่ำเสมอ","source":"Primary Nursing p.17"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":1,"title":"Case Manager Focus","principle":"Case Manager เน้นผู้ป่วยรายบุคคลที่มีความซับซ้อนสูงและต้องประสานการดูแลหลายด้าน","action":"คัดเลือกผู้ป่วยที่มีปัญหาซ้ำซ้อนหรือความเสี่ยงสูง แล้วสร้างแผนรายบุคคล","outcome":"ลดปัญหาซ้ำและเพิ่มความต่อเนื่องของผู้ป่วยรายนั้น","source":"Case Management pp.2–4"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":2,"title":"5-in-1 Case Manager Roles","principle":"บทบาทหลักประกอบด้วย Care Coordinator, Clinical Monitor, Navigator, Educator และ Patient Advocate","action":"สลับบทบาทตามปัญหาของผู้ป่วย เช่น ประสานทีม ติดตามอาการ ช่วยเข้าถึงบริการ สอน และพิทักษ์สิทธิ","outcome":"ผู้ป่วยได้รับการดูแลเชื่อมโยงทั้งระบบและมีผู้รับผิดชอบชัดเจน","source":"Case Management p.5"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":3,"title":"Primary Nurse vs Case Manager","principle":"Primary Nurse เน้น continuity ของผู้ป่วยที่ได้รับมอบหมาย ส่วน Case Manager เน้นความซับซ้อน การประสาน และการแก้ปัญหารายกรณี","action":"ส่งต่อเข้าสู่ Case Management เมื่อปัญหาเกินกว่าการดูแลตาม routine primary nursing","outcome":"ทรัพยากร case management ถูกใช้กับผู้ป่วยที่ต้องการการประสานเข้มข้น","source":"Case Management p.6"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":4,"title":"Risk-Based Case Assignment","principle":"การมอบหมาย Case Manager ควรใช้ risk stratification เพื่อคัดผู้ป่วยที่ต้องการการจัดการเข้มข้น","action":"ใช้ข้อมูล clinical risk, admission, access, adherence และ psychosocial barrier เพื่อจัดระดับความเสี่ยง","outcome":"จัดลำดับความสำคัญและใช้เวลา Case Manager กับผู้ป่วยที่จำเป็นที่สุด","source":"Case Management pp.7,12"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":5,"title":"Case Manager Dashboard","principle":"Dashboard ของ Case Manager ครอบคลุม Disease, Access, Admission, Education และ Care Coordination","action":"ติดตาม adequacy/anemia/nutrition, access events, admissions, self-management และการประสานบริการร่วมกัน","outcome":"เห็นปัญหาหลายมิติของผู้ป่วยในหน้าจอเดียวและวางแผนได้ครบ","source":"Case Management p.11"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":6,"title":"Case Management Process 5 Steps","principle":"กระบวนการ 5 ขั้นคือ Screening & Assessment → Care Planning → Implementation & Coordination → Monitoring & Follow-up → Outcome Evaluation","action":"ทำตามลำดับและวนกลับเมื่อผลลัพธ์ยังไม่ถึงเป้าหมาย","outcome":"การจัดการรายกรณีมีวงจรชัดเจนและวัดผลได้","source":"Case Management pp.14–17"},{"unit":"U4","unit_title":"Case Management สำหรับผู้ป่วยฟอกเลือดที่ซับซ้อน","lesson":7,"title":"Multidisciplinary Collaboration","principle":"Case Manager เป็นจุดเชื่อมระหว่าง nephrologist, nurses, dietitian, pharmacist, social worker และทีมอื่นตามปัญหา","action":"กำหนดผู้รับผิดชอบและสื่อสาร care plan เดียวกันให้ทุกฝ่ายเห็น","outcome":"ลด fragmented care และการทำงานซ้ำ/ขัดแย้งกัน","source":"Case Management p.13"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":1,"title":"Care Manager = Population-Based Care","principle":"Care Manager มุ่งบริหารระบบการดูแลผู้ป่วยทั้งกลุ่มและผลลัพธ์ของทั้งหน่วย ต่างจาก Case Manager ที่เน้นรายบุคคล","action":"ใช้ dashboard และข้อมูลทั้ง population เพื่อระบุปัญหาระบบและกำหนดมาตรฐาน","outcome":"คุณภาพการดูแลของผู้ป่วยทั้งหน่วยสม่ำเสมอขึ้น","source":"Care Management p.2"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":2,"title":"เหตุผลที่ต้องมี Care Management","principle":"หน่วยไตเทียมต้องติดตามตัวชี้วัดต่อเนื่อง และความล้มเหลวของระบบอาจแสดงเป็น Kt/V ต่ำ anemia/albumin ควบคุมไม่ได้ CVC infection admission หรือ missed visits","action":"มอง pattern ของทั้งหน่วยก่อนสรุปว่าเป็นปัญหาของผู้ป่วยหรือพยาบาลรายคน","outcome":"พบ system gap และแก้ที่ต้นเหตุแทนการแก้เฉพาะรายซ้ำ ๆ","source":"Care Management p.3"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":3,"title":"เป้าหมายด้านผู้ป่วย","principle":"ผลลัพธ์ระดับผู้ป่วยคือมาตรฐานการดูแล ลดภาวะแทรกซ้อน คุณภาพชีวิตดีขึ้น และลดการเสียชีวิต","action":"กำหนด patient outcomes ที่ติดตามได้และเชื่อมกับ intervention ของหน่วย","outcome":"ผลลัพธ์สะท้อนคุณค่าที่ผู้ป่วยได้รับ ไม่ใช่เพียงปริมาณบริการ","source":"Care Management p.4"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":4,"title":"เป้าหมายด้านหน่วยงาน","principle":"ผลลัพธ์ระดับหน่วยรวมลด admission/readmission เพิ่มคุณภาพ ผ่านมาตรฐานรับรอง และบรรลุตัวชี้วัดหน่วยไตเทียม","action":"ติดตาม KPI เป็น trend และกำหนด improvement target ระดับหน่วย","outcome":"องค์กรเห็นผลของระบบดูแลและวางแผนพัฒนาคุณภาพได้","source":"Care Management p.4"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":5,"title":"Care Trinity Matrix","principle":"Care Manager ดู system/population, Case Manager ดู complex individual และ Primary Nurse ดู bedside execution/continuity","action":"เมื่อมีทั้งปัญหารายคนและ trend ทั้งหน่วย ให้แยก owner ของปัญหาให้ตรงระดับ","outcome":"ลดความซ้ำซ้อนของบทบาทและทำให้ escalation ชัดเจน","source":"Care Management pp.2,7"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":6,"title":"5 Pillars of Care Management","principle":"เสาหลักคือ Clinical Governance, Quality Monitoring, Risk Management, Care Coordination และ Continuous Quality Improvement","action":"ใช้ทั้งมาตรฐาน ข้อมูลความเสี่ยง การประสาน และวงจรปรับปรุงร่วมกัน","outcome":"ระบบดูแลปลอดภัยและพัฒนาได้ต่อเนื่อง","source":"Care Management pp.6–8"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":7,"title":"Outcome Analysis","principle":"การวิเคราะห์ผลลัพธ์ต้องดู trend, benchmark/target, ความแปรปรวน และความสัมพันธ์กับ process ไม่ตัดสินจากค่าเดียว","action":"เมื่อ KPI แย่ ให้หาว่าปัญหาเกิดที่ process ใดและกลุ่มผู้ป่วยใดก่อนเลือก intervention","outcome":"การแก้ปัญหาตรงสาเหตุและสามารถพิสูจน์ผลหลังปรับปรุง","source":"Care Management + Primary Nursing KPI sections"},{"unit":"U5","unit_title":"Care Management และการวิเคราะห์ผลลัพธ์ระดับหน่วย","lesson":8,"title":"CQI & Remeasurement","principle":"CQI ต้องมีข้อมูลตั้งต้น ระบุ gap ออกแบบ intervention นำไปใช้ แล้ววัดซ้ำ","action":"กำหนด baseline และช่วงเวลาวัดซ้ำก่อนเริ่มโครงการปรับปรุง","outcome":"รู้ว่า intervention ทำให้ outcome เปลี่ยนจริงหรือไม่","source":"Care Management / RRT Competency quality improvement"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":1,"title":"Nurse-led Care Model","principle":"Nurse-led care คือการขยายบทบาทพยาบาลภายใต้มาตรฐานและขอบเขตที่กำหนด ไม่ใช่การทำงานแทนแพทย์โดยไม่มีระบบรองรับ","action":"มอบหมายการประเมิน ติดตาม และการดำเนินการที่อยู่ใน protocol พร้อมระบบ escalation","outcome":"ลดเวลารอและเพิ่มความต่อเนื่องโดยยังคงความปลอดภัย","source":"Nurse-led Renal Care p.1"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":2,"title":"3 Pillars of Decentralized Care","principle":"สามเสาหลักคือแบ่งกลุ่มผู้ป่วยตามระดับความเสี่ยง การพยาบาลตามแนวทางปฏิบัติ และศูนย์กลางประสานงานสหสาขาวิชาชีพ","action":"ใช้ risk tier เพื่อกำหนด intensity ของการติดตามและทำงานบน protocol เดียวกัน","outcome":"การกระจายอำนาจทางคลินิกมีมาตรฐานและไม่เกิดการดูแลแบบต่างคนต่างทำ","source":"Nurse-led Renal Care p.2"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":3,"title":"360° Nurse-led Cycle","principle":"วงจรประกอบด้วย proactive assessment, shared decision making, remote monitoring และ protocol-based care-plan adjustment","action":"ติดตามภาวะแทรกซ้อนเชิงรุก พร้อมปรับแผนตาม protocol และเชื่อมการติดตามทางไกล","outcome":"ดูแลต่อเนื่องก่อนเกิด crisis และตอบสนองต่อการเปลี่ยนแปลงได้เร็ว","source":"Nurse-led Renal Care p.3"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":4,"title":"Safety Boundary & Escalation","principle":"การตัดสินใจใน nurse-led clinic ต้องมีจุดตรวจ safety: หากอยู่ใน protocol ดำเนินการได้ หากนอก protocol/วิกฤตต้องส่งต่อ","action":"ระบุ red flags และเกณฑ์ consult/referral ไว้ชัดเจนก่อนเริ่มบริการ","outcome":"ขยายบทบาทพยาบาลโดยไม่ลด safety margin","source":"Nurse-led Renal Care p.4"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":5,"title":"Remote Follow-up","principle":"การติดตามต่อเนื่องสามารถใช้โทรศัพท์หรือ telehealth ภายใต้แผนที่กำหนด","action":"ติดตามอาการ ผลลัพธ์ และ adherence หลังการปรับแผน พร้อมช่องทาง escalation","outcome":"ลดการขาดช่วงของการดูแลและตรวจพบปัญหาได้เร็วขึ้น","source":"Nurse-led Renal Care pp.3–4"},{"unit":"U6","unit_title":"Nurse-led Renal Care และ Clinical Leadership","lesson":6,"title":"Clinical + SDM + Behavioral Design","principle":"การดูแล nurse-led ที่สมบูรณ์เชื่อม Clinical Management, Shared Decision Making และ Behavioral Design","action":"แก้ปัญหาคลินิกพร้อมเตรียมความเข้าใจ/ความพร้อมของผู้ป่วยและออกแบบพฤติกรรมที่ทำได้จริง","outcome":"ได้ผลทั้งด้านคลินิก ความเครียด/ความพร้อม และความยั่งยืนของพฤติกรรม","source":"Nurse-led Renal Care p.5"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":1,"title":"Shared Decision Making","principle":"SDM คือกระบวนการที่ทีมรักษา ผู้ป่วย และครอบครัวแลกเปลี่ยนข้อมูลและร่วมเลือกแนวทางที่สอดคล้องกับเป้าหมายชีวิต","action":"อธิบายทางเลือกและ trade-off แล้วสำรวจคุณค่า/ความต้องการก่อนตัดสินใจ","outcome":"การเลือก RRT สอดคล้องทั้งข้อมูลทางคลินิกและชีวิตของผู้ป่วย","source":"Shared Renal Care Decisions pp.2–3"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":2,"title":"SDM Roadmap 4 Steps","principle":"Roadmap ประกอบด้วย Timing of Initiation → Modality Selection → Personal Dimensions → Advance Care Planning","action":"อย่าข้ามบริบทส่วนบุคคลและการวางแผนล่วงหน้าแม้เลือก modality ได้แล้ว","outcome":"ลดการตัดสินใจแบบเร่งด่วนและเพิ่มความพร้อมระยะยาว","source":"Shared Renal Care Decisions p.3"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":3,"title":"Timing of Initiation","principle":"การเริ่ม RRT ไม่ควรใช้ค่า eGFR ค่าเดียว แต่ต้องพิจารณาอาการ ภาวะแทรกซ้อน และบริบททางคลินิก","action":"ประเมิน uremic symptoms, volume/electrolyte/acid-base problems และ trajectory ร่วมกัน","outcome":"เริ่ม RRT ในเวลาที่เหมาะสม ไม่เร็วหรือช้าเพราะตัวเลขเดี่ยว","source":"Shared Renal Care Decisions pp.4–5"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":4,"title":"Modality Selection","principle":"ทางเลือกหลักได้แก่ PD, HD และ KT โดยแต่ละวิธีมีข้อดี ข้อจำกัด และผลต่อวิถีชีวิตต่างกัน","action":"เปรียบเทียบทางเลือกให้ผู้ป่วยเห็นผลต่อเวลา การเดินทาง บ้าน ผู้ดูแล และความเป็นอิสระ","outcome":"เลือก modality ที่เหมาะกับ clinical fit และ life fit","source":"Shared Renal Care Decisions pp.6–12"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":5,"title":"Personal Dimensions","principle":"ปัจจัย SDM ต้องรวม Medical context, Caregiver support, Financial/Welfare และ Goal of Care","action":"ประเมินผู้ดูแล บ้าน การเดินทาง สิทธิ ค่าใช้จ่าย และเป้าหมายชีวิตก่อนสรุป feasibility","outcome":"ลดการเลือกวิธีที่เหมาะทางการแพทย์แต่ไม่สามารถทำได้จริงในชีวิตประจำวัน","source":"Shared Renal Care Decisions p.13"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":6,"title":"Advance Care Planning","principle":"ACP คือการเตรียมแผนล่วงหน้าสำหรับทางเลือกและสถานการณ์ในอนาคต รวมการเตรียม access และการป้องกัน emergency start","action":"กำหนด next step ที่ชัด เช่น access planning, transplant evaluation หรือ conservative-care discussion ตามบริบท","outcome":"ผู้ป่วยมีแผนต่อเนื่องและลดการเริ่มรักษาแบบฉุกเฉิน","source":"Shared Renal Care Decisions p.14"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":7,"title":"ESRD Care Pathway","principle":"Care Pathway เชื่อม Pre-ESRD → RRT decision → Access planning → Dialysis initiation → Maintenance/High-risk care → Transition/Home monitoring → End-of-life care","action":"กำหนด owner, trigger และ next step ในแต่ละ stage เพื่อไม่ให้ผู้ป่วยหลุดจากระบบ","outcome":"ลด fragmented care ตลอดเส้นทาง ESRD","source":"Shared Renal Care Decisions pp.16–29"},{"unit":"U7","unit_title":"Shared Decision Making และการเลือก RRT","lesson":8,"title":"Clinical Decision Tools","principle":"Decision tools ช่วยเปลี่ยนข้อมูลกระจัดกระจายเป็นการคัดกรองความเสี่ยงและ action ที่กำหนดไว้ เช่น adequacy, anemia, access, nutrition, readmission และ self-management","action":"ใช้ tool เป็น decision support และนำผลเข้า case conference/แผนดูแล ไม่ใช้แทน clinical judgment","outcome":"การตัดสินใจสม่ำเสมอและมองเห็นผู้ป่วยเสี่ยงเร็วขึ้น","source":"Shared Renal Care Decisions pp.30–39"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":1,"title":"Psychosocial Assessment","principle":"การประเมินผู้ป่วยโรคไตต้องครอบคลุมความเครียด ซึมเศร้า ความเชื่อ บทบาทครอบครัว การสนับสนุน และอุปสรรคทางสังคม","action":"ใช้การสนทนาและเครื่องมือคัดกรองเป็นส่วนหนึ่งของการประเมิน ไม่ใช้คะแนนแทนการประเมินทั้งหมด","outcome":"พบปัจจัยที่กระทบ adherence คุณภาพชีวิต และความเป็นไปได้ของแผนรักษา","source":"Psychosocial CKD + Self-Management CKD"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":2,"title":"Depression & Anxiety Screening","principle":"PHQ-9/GAD-7 ใช้คัดกรอง ไม่ใช่เครื่องมือยืนยันการวินิจฉัยโดยลำพัง และอาการทางกายของ CKD อาจซ้อนทับอาการทางอารมณ์","action":"แปลผลร่วมกับการสัมภาษณ์ ความเสี่ยง และอาการทางกายของโรคไต","outcome":"คัดกรองผู้มีปัญหาได้เร็วโดยลดการตีความผิดจาก symptom overlap","source":"Self-Management CKD mental-health section"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":3,"title":"Symptom Management","principle":"ผู้ป่วย CKD ระยะก้าวหน้ามักมีหลายอาการร่วมกัน จึงต้องประเมินสาเหตุและจัดการอย่างเป็นระบบ ไม่รักษาอาการแบบแยกส่วน","action":"ประเมิน nausea, dyspnea, fatigue, pruritus และอาการอื่นร่วมกับ anemia, fluid, uremia, nutrition และยา","outcome":"ลด symptom burden และเพิ่มคุณภาพชีวิต","source":"Self-Management CKD symptom section"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":4,"title":"RRT Nurse Competency","principle":"สมรรถนะพยาบาล RRT ครอบคลุม clinical, technology, teaching/counseling, ethics, information technology, teamwork, infection control, QI/research และ leadership","action":"ประเมินช่องว่างสมรรถนะเป็นรายด้านและพัฒนาต่อเนื่อง ไม่ใช้การผ่านอบรมครั้งเดียวแทน competency","outcome":"เพิ่มความปลอดภัยและคุณภาพการดูแล RRT","source":"RRT Nurse Competency 2026 pp.1–6"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":5,"title":"Quality Development 4 Approaches","principle":"แนวทางพัฒนาคุณภาพประกอบด้วยพัฒนาศักยภาพบุคลากร ใช้ clinical guideline มาตรฐาน สร้างระบบติดตามตัวชี้วัด และเสริมทีมสหสาขาวิชาชีพ","action":"วางระบบทั้งคน มาตรฐาน ข้อมูล และทีม แทนการแก้เพียงองค์ประกอบเดียว","outcome":"ลดภาวะแทรกซ้อนและเพิ่มคุณภาพชีวิตผู้ป่วย","source":"RRT Nurse Competency 2026 abstract"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":6,"title":"Incident & Risk Learning","principle":"เหตุการณ์ผิดพลาดและ near miss ต้องถูกนำเข้าสู่ระบบเรียนรู้และปรับปรุง ไม่ใช่รอให้เกิดอันตรายรุนแรง","action":"บันทึกเหตุการณ์ วิเคราะห์สาเหตุระบบ และติดตาม action ที่ป้องกันการเกิดซ้ำ","outcome":"ลด recurrence และสร้าง safety culture","source":"Primary Nursing Quality Assurance / Care Management Risk"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":7,"title":"Integrated Outcome Domains","principle":"การประเมินผลควรมอง Clinical Excellence, Patient Experience และ Safety/Risk พร้อมกัน","action":"อย่าตัดสินคุณภาพจาก adequacy ดีเพียงตัวเดียว หาก infection, experience หรือ safety ยังมีปัญหา","outcome":"ได้ภาพคุณภาพที่สมดุลและสะท้อนผลต่อผู้ป่วยจริง","source":"Primary Nursing KPI section"},{"unit":"U8","unit_title":"จิตสังคม ความปลอดภัย สมรรถนะ และผลลัพธ์แบบบูรณาการ","lesson":8,"title":"From Data to Action","principle":"ข้อมูลมีคุณค่าเมื่อเปลี่ยนเป็นการคัดกรองความเสี่ยง การประชุม case/system review และ next action ที่มี owner","action":"กำหนด trigger → responsible role → action → follow-up ทุกครั้งที่พบข้อมูลผิดปกติ","outcome":"ลด dashboard ที่มีแต่ตัวเลขแต่ไม่เกิดการเปลี่ยนแปลงในการดูแล","source":"Shared Decision Tools + Care Management"}],"questions":[{"id":"Q001","unit":"U1","lesson":1,"concept":"ความหมายของ Self-Management","stem":"ข้อใดอธิบาย “ความหมายของ Self-Management” ได้ถูกต้องที่สุด?","options":["การเสริมแรงตนเองคือการให้รางวัลหรือกำลังใจตนเองเมื่อทำตามเป้าหมาย เพื่อคงแรงจูงใจภายใน","ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ","การติดตามตนเองคือการสังเกตและบันทึกพฤติกรรม อาการ หรือข้อมูลสุขภาพของตนเองอย่างเป็นระบบ","การประเมินตนเองคือการนำข้อมูลที่ติดตามไว้มาเทียบกับเป้าหมายหรือมาตรฐานเพื่อดูว่าต้องปรับอะไร"],"answer":1,"explain":"หลักสำคัญ: ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ การปฏิบัติที่สอดคล้อง: ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ เป้าหมาย: เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ","source":"Self-Management CKD pp.4–5","level":"Moderate"},{"id":"Q002","unit":"U1","lesson":1,"concept":"ความหมายของ Self-Management","stem":"การปฏิบัติใดสอดคล้องกับ “ความหมายของ Self-Management” มากที่สุด?","options":["ช่วยผู้ป่วยกำหนดวิธีให้กำลังใจตนเองและปรับแผนเมื่อยังไม่บรรลุเป้าหมาย","ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ","ให้ผู้ป่วยติดตามข้อมูลที่มีความหมาย เช่น น้ำหนัก ความดัน อาการบวม หรือการรับประทานยา","ทบทวนข้อมูลร่วมกับผู้ป่วยและถามว่าผลที่เกิดขึ้นตรงเป้าหมายเพียงใด"],"answer":1,"explain":"หลักสำคัญ: ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ การปฏิบัติที่สอดคล้อง: ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ เป้าหมาย: เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ","source":"Self-Management CKD pp.4–5","level":"Moderate"},{"id":"Q003","unit":"U1","lesson":1,"concept":"ความหมายของ Self-Management","stem":"ผลลัพธ์หรือเป้าหมายใดสัมพันธ์กับ “ความหมายของ Self-Management” โดยตรงที่สุด?","options":["เพิ่มความยั่งยืนของพฤติกรรมที่เหมาะสม","ผู้ป่วยเห็นช่องว่างระหว่างพฤติกรรมจริงกับเป้าหมาย","ตรวจพบการเปลี่ยนแปลงและอุปสรรคได้เร็วขึ้น","เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ"],"answer":3,"explain":"หลักสำคัญ: ผู้ป่วยเป็นศูนย์กลางและจัดการอาการ การรักษา ผลกระทบทางกาย–จิตสังคม และการปรับวิถีชีวิตร่วมกับทีมสุขภาพ การปฏิบัติที่สอดคล้อง: ประเมินสิ่งที่ผู้ป่วยทำได้จริง แล้วร่วมกำหนดเป้าหมายและแผนที่ผู้ป่วยมีส่วนตัดสินใจ เป้าหมาย: เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ","source":"Self-Management CKD pp.4–5","level":"Moderate"},{"id":"Q004","unit":"U1","lesson":2,"concept":"Self-Monitoring", vel":"Moderate"},{"id":"Q024","unit":"U1","lesson":8,"concept":"Teach-back & Health Literacy","stem":"ผลลัพธ์หรือเป้าหมายใดสัมพันธ์กับ “Teach-back & Health Literacy” โดยตรงที่สุด?","options":["ผู้ป่วยเห็นช่องว่างระหว่างพฤติกรรมจริงกับเป้าหมาย","ตรวจพบการเปลี่ยนแปลงและอุปสรรคได้เร็วขึ้น","ลดความคลาดเคลื่อนจากการสื่อสารและเพิ่มความเข้าใจที่นำไปใช้ได้","เพิ่มความสามารถในการดูแลตนเองและความต่อเนื่องของพฤติกรรมสุขภาพ"],"answer":2,"explain":"หลักสำคัญ: Teach-back ตรวจความเข้าใจโดยให้ผู้ป่วยอธิบายหรือสาธิตกลับด้วยคำของตนเอง ไม่ใช่ถามเพียงว่าเข้าใจหรือไม่ การปฏิบัติที่สอดคล้อง: หลังให้ข้อมูล ให้ผู้ป่วยเล่ากลับว่าต้องทำอะไร และอธิบายใหม่หากยังไม่ครบ เป้าหมาย: ลดความคลาดเคลื่อนจากการสื่อสารและเพิ่มความเข้าใจที่นำไปใช้ได้","source":"Self-Management CKD p.11","level":"Moderate"},{"id":"Q025","unit":"U2","lesson":1,"concept":"เป้าหมายการดูแล CKD ก่อน RRT","stem":"ข้อใดอธิบาย “เป้าหมายการดูแล CKD ก่อน RRT” ได้ถูกต้องที่สุด?","options":["การคัดกรองต้องประเมินการทำงานของไตและความผิดปกติในปัสสาวะ และความเรื้อรังต้องอาศัยข้อมูลต่อเนื่อง","การจำกัดโปรตีนต้องทำร่วมกับการได้รับพลังงานเพียงพอ มิฉะนั้นเสี่ยงสลายโปรตีนในร่างกายและทุพโภชนาการ","เป้าหมายสำคัญคือคัดกรอง/ส่งต่อ ชะลอไตเสื่อม ป้องกันภาวะแทรกซ้อน ลดความเสี่ยงหัวใจและหลอดเลือด และเตรียม RRT อย่างเหมาะสม","การลดโซเดียมช่วยควบคุมความดัน ปริมาตรสารน้ำ และลดภาวะบวม"],"answer":2,"explain":"หลักสำคัญ: เป้าหมายสำคัญคือคัดกรอง/ส่งต่อ ชะลอไตเสื่อม ป้องกันภาวะแทรกซ้อน ลดความเสี่ยงหัวใจและหลอดเลือด และเตรียม RRT อย่างเหมาะสม การปฏิบัติที่สอดคล้อง: วางแผนดูแลตามระยะโรคโดยไม่รอจนเกิดภาวะฉุกเฉินหรือมีข้อบ่งชี้ฟอกไตแล้ว เป้าหมาย: ลดการเกิดภาวะแทรกซ้อนและเพิ่มความพร้อมก่อนเริ่ม RRT","source":"การดูแล CKD ระยะก่อน RRT pp.4–7","level":"Moderate"},{"id":"Q026","unit":"U2","lesson":1,"concept":"เป้าหมายการดูแล CKD ก่อน RRT","stem":"การปฏิบัติใดสอดคล้องกับ “เป้าหมายการดูแล CKD ก่อน RRT” มากที่สุด?","options":["ประเมิน intake น้ำหนัก แนวโน้มมวลกล้ามเนื้อ และส่งต่อผู้เชี่ยวชาญด้านโภชนาการเมื่อจำเป็น","สอนอ่านฉลากและลดอาหารแปรรูป/เครื่องปรุงเค็ม โดยเชื่อ : Pre–Intra–Post Dialysis” โดยตรงที่สุด?","options":["เกิด Continuity of Care และความสัมพันธ์เชิงรักษาที่ต่อเนื่อง","ความปลอดภัยและความต่อเนื่องตลอด treatment cycle","ผู้ป่วยได้รับการดูแลแบบ patient-centered และต่อเนื่อง","ลดความเสี่ยงและทำให้การดูแลเป็นมาตรฐานสม่ำเสมอ"],"answer":1,"explain":"หลักสำคัญ: การดูแลหนึ่งรอบฟอกเลือดต้องเชื่อม Pre-dialysis assessment, Intra-dialysis surveillance และ Post-dialysis evaluation/continuity การปฏิบัติที่สอดคล้อง: ก่อนฟอกประเมินผู้ป่วย/access/prescription ระหว่างฟอกเฝ้าระวังและตอบสนองทันที หลังฟอกประเมินผล ให้ความรู้ และบันทึก เป้าหมาย: ความปลอดภัยและความต่อเนื่องตลอด treatment cycle","source":"Primary Nursing pp.13–16","level":"Moderate"},{"id":"Q067","unit":"U3","lesson":7,"concept":"Quality Assurance Shield","stem":"ข้อใดอธิบาย “Quality Assurance Shield” ได้ถูกต้องที่สุด?","options":["โครงสร้างงานแยกบทบาท Nurse Manager, Primary Nurse และ Associate Nurse โดย Primary Nurse เป็นเจ้าของแผนดูแลหลักของผู้ป่วย","เป้าหมายครอบคลุมการยกระดับคุณภาพชีวิต การดูแลเฉพาะบุคคล การป้องกันภาวะแทรกซ้อน คุณภาพการพยาบาล และความต่อเนื่อง","ระบบประกันคุณภาพในหน่วยไตเทียมต้องครอบคลุม infection control, RO water standard, adequacy/indicators และ incident reporting","Primary Nursing เน้นความรับผิดชอบต่อผู้ป่วยที่ได้รับมอบหมายอย่างต่อเนื่อง ต่างจากการดูแลแบบเปลี่ยนผู้รับผิดชอบเป็นรอบ"],"answer":2,"explain":"หลักสำคัญ: ระบบประกันคุณภาพในหน่วยไตเทียมต้องครอบคลุม infection control, RO water standard, adequacy/indicators และ incident reporting การปฏิบัติที่สอดคล้อง: ใช้ข้อมูลคุณภาพและเหตุการณ์ความเสี่ยงเพื่อแก้ระบบ ไม่ใช้เฉพาะตรวจเอกสาร เป้าหมาย: ลดความเสี่ยงและทำให้การดูแลเป็นมาตรฐานสม่ำเสมอ","source":"Primary Nursing p.17","level":"Moderate"},{"id":"Q068","unit":"U3","lesson":7,"concept":"Quality Assurance Shield","stem":"การปฏิบัติใดสอดคล้องกับ “Quality Assurance Shield” มากที่สุด?","options":["ใช้ข้อมูลผู้ป่วยรายบุคคลเพื่อจัดลำดับปัญหาและติดตามผลระยะยาว","ใช้ข้อมูลคุณภาพและเหตุการณ์ความเสี่ยงเพื่อแก้ระบบ ไม่ใช้เฉพาะตรวจเอกสาร","กำหนด Primary Nurse ให้ติด :"Case Management pp.7,12","level":"Moderate"},{"id":"Q080","unit":"U4","lesson":4,"concept":"Risk-Based Case Assignment","stem":"การปฏิบัติใดสอดคล้องกับ “Risk-Based Case Assignment” มากที่สุด?","options":["ติดตาม adequacy/anemia/nutrition, access events, admissions, self-management และการประสานบริการร่วมกัน","ใช้ข้อมูล clinical risk, admission, access, adherence และ psychosocial barrier เพื่อจัดระดับความเสี่ยง","ทำตามลำดับและวนกลับเมื่อผลลัพธ์ยังไม่ถึงเป้าหมาย","กำหนดผู้รับผิดชอบและสื่อสาร care plan เดียวกันให้ทุกฝ่ายเห็น"],"answer":1,"explain":"หลักสำคัญ: การมอบหมาย Case Manager ควรใช้ risk stratification เพื่อคัดผู้ป่วยที่ต้องการการจัดการเข้มข้น การปฏิบัติที่สอดคล้อง: ใช้ข้อมูล clinical risk, admission, access, adherence และ psychosocial barrier เพื่อจัดระดับความเสี่ยง เป้าหมาย: จัดลำดับความสำคัญและใช้เวลา Case Manager กับผู้ป่วยที่จำเป็นที่สุด","source":"Case Management pp.7,12","level":"Moderate"},{"id":"Q081","unit":"U4","lesson":4,"concept":"Risk-Based Case Assignment","stem":"ผลลัพธ์หรือเป้าหมายใดสัมพันธ์กับ “Risk-Based Case Assignment” โดยตรงที่สุด?","options":["จัดลำดับความสำคัญและใช้เวลา Case Manager กับผู้ป่วยที่จำเป็นที่สุด","เห็นปัญหาหลายมิติของผู้ป่วยในหน้าจอเดียวและวางแผนได้ครบ","ลด fragmented care และการทำงานซ้ำ/ขัดแย้งกัน","การจัดการรายกรณีมีวงจรชัดเจนและวัดผลได้"],"answer":0,"explain":"หลักสำคัญ: การมอบหมาย Case Manager ควรใช้ risk stratification เพื่อคัดผู้ป่วยที่ต้องการการจัดการเข้มข้น การปฏิบัติที่สอดคล้อง: ใช้ข้อมูล clinical risk, admission, access, adherence และ psychosocial barrier เพื่อจัดระดับความเสี่ยง เป้าหมาย: จัดลำดับความสำคัญและใช้เวลา Case Manager กับผู้ป่วยที่จำเป็นที่สุด","source":"Case Management pp.7,12","level":"Moderate"},{"id":"Q082","unit":"U4","lesson":5,"concept":"Case Manager Dashboard","stem":"ข้อใดอธิบาย “Case Manager Dashboard” ได้ถูกต้องที่สุด?","options":["Case Manager เป็นจุดเชื่อมระหว่าง nephrologist, nurses, dietitian, pharmacist, social worker และทีมอื่นตามปัญหา","กระบวนการ 5 ขั้นคือ Screening & Assessment → Care ools ช่วยเปลี่ยนข้อมูลกระจัดกระจายเป็นการคัดกรองความเสี่ยงและ action ที่กำหนดไว้ เช่น adequacy, anemia, access, nutrition, readmission และ self-management การปฏิบัติที่สอดคล้อง: ใช้ tool เป็น decision support และนำผลเข้า case conference/แผนดูแล ไม่ใช้แทน clinical judgment เป้าหมาย: การตัดสินใจสม่ำเสมอและมองเห็นผู้ป่วยเสี่ยงเร็วขึ้น","source":"Shared Renal Care Decisions pp.30–39","level":"Moderate"},{"id":"Q156","unit":"U7","lesson":8,"concept":"Clinical Decision Tools","stem":"ผลลัพธ์หรือเป้าหมายใดสัมพันธ์กับ “Clinical Decision Tools” โดยตรงที่สุด?","options":["ลดการตัดสินใจแบบเร่งด่วนและเพิ่มความพร้อมระยะยาว","การเลือก RRT สอดคล้องทั้งข้อมูลทางคลินิกและชีวิตของผู้ป่วย","เริ่ม RRT ในเวลาที่เหมาะสม ไม่เร็วหรือช้าเพราะตัวเลขเดี่ยว","การตัดสินใจสม่ำเสมอและมองเห็นผู้ป่วยเสี่ยงเร็วขึ้น"],"answer":3,"explain":"หลักสำคัญ: Decision tools ช่วยเปลี่ยนข้อมูลกระจัดกระจายเป็นการคัดกรองความเสี่ยงและ action ที่กำหนดไว้ เช่น adequacy, anemia, access, nutrition, readmission และ self-management การปฏิบัติที่สอดคล้อง: ใช้ tool เป็น decision support และนำผลเข้า case conference/แผนดูแล ไม่ใช้แทน clinical judgment เป้าหมาย: การตัดสินใจสม่ำเสมอและมองเห็นผู้ป่วยเสี่ยงเร็วขึ้น","source":"Shared Renal Care Decisions pp.30–39","level":"Moderate"},{"id":"Q157","unit":"U8","lesson":1,"concept":"Psychosocial Assessment","stem":"ข้อใดอธิบาย “Psychosocial Assessment” ได้ถูกต้องที่สุด?","options":["PHQ-9/GAD-7 ใช้คัดกรอง ไม่ใช่เครื่องมือยืนยันการวินิจฉัยโดยลำพัง และอาการทางกายของ CKD อาจซ้อนทับอาการทางอารมณ์","การประเมินผู้ป่วยโรคไตต้องครอบคลุมความเครียด ซึมเศร้า ความเชื่อ บทบาทครอบครัว การสนับสนุน และอุปสรรคทางสังคม","สมรรถนะพยาบาล RRT ครอบคลุม clinical, technology, teaching/counseling, ethics, information technology, teamwork, infection control, QI/research และ leadership","ผู้ป่วย CKD ระยะก้าวหน้ามักมีหลายอาการร่วมกัน จึงต้องประเมินสาเหตุและจัดการอย่างเป็นระบบ ไม่รักษาอาการแบบแยกส่วน"],"answer":1,"explain":"หลักสำคัญ: การประเมินผู้ป่วยโรคไตต้องครอบคลุมความเครียด ซึมเศร้า ความเชื่อ บทบาทครอบครัว const KEY='kidney_course3_v1_state';
let S=JSON.parse(localStorage.getItem(KEY)||'{}'); if(!S.done) S.done={}; if(!S.exam) S.exam={answers:{},submitted:false,score:null,order:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function side(){let h='<input class="search" placeholder="ค้นหาบทเรียน" oninput="filterNav(this.value)"><div class="sec">Units</div>';DATA.units.forEach(u=>{let c=DATA.concepts.filter(x=>x.unit===u.id),d=c.filter(x=>S.done[u.id+'-'+x.lesson]).length;h+=`<button class="nav navunit" data-search="${esc(u.thai+' '+u.title)}" onclick="showUnit('${u.id}')"><b>${u.id} · ${esc(u.thai)}</b><small>${d}/${c.length} บทเรียน</small></button>`});h+='<div class="sec">Assessment</div><button class="nav" onclick="showExamIntro()"><b>Final Exam</b><small>180 ข้อ • ผ่าน 80%</small></button>';document.getElementById('side').innerHTML=h}
function filterNav(v){v=v.toLowerCase();document.querySelectorAll('.navunit').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(v)?'block':'none')}
function pct(){let n=DATA.concepts.length,d=DATA.concepts.filter(c=>S.done[c.unit+'-'+c.lesson]).length;return [d,n,Math.round(d/n*100)]}
function goHome(){let [d,n,p]=pct();let h=`<section class="hero"><span class="pill">วิชาที่ 3</span><span class="pill">60 Lessons</span><span class="pill">180 Final Questions</span><h1>${esc(DATA.title)}</h1><p>บทเรียนออกแบบให้ถาม–ตอบตรงประเด็น เน้นการแยกบทบาท Primary Nurse / Case Manager / Care Manager, chronic self-management, nurse-led care, shared decision making และการวิเคราะห์ผลลัพธ์ระดับผู้ป่วยและระดับหน่วย</p><div class="stats"><div class="stat"><span class="muted">บทเรียน</span><b>${d}/${n}</b></div><div class="stat"><span class="muted">ความคืบหน้า</span><b>${p}%</b></div><div class="stat"><span class="muted">ข้อสอบ</span><b>180</b></div><div class="stat"><span class="muted">เกณฑ์ผ่าน</span><b>80%</b></div></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></section><h2>หน่วยการเรียน</h2><div class="grid">`;DATA.units.forEach(u=>{let c=DATA.concepts.filter(x=>x.unit===u.id),ud=c.filter(x=>S.done[u.id+'-'+x.lesson]).length;h+=`<div class="card unitCard" onclick="showUnit('${u.id}')"><div class="unitNum">${u.id}</div><h3>${esc(u.thai)}</h3><p class="muted">${esc(u.title)}</p><div class="progress"><div class="bar" style="width:${Math.round(ud/c.length*100)}%"></div></div><p class="muted">${ud}/${c.length} บทเรียน</p></div>`});h+='</div><div class="footerNote">Source policy: ใช้เอกสารการสอนที่อัปโหลดเป็นฐานความรู้หลัก ตัวเลขและเกณฑ์ที่อาจเปลี่ยนตาม guideline ถูกหลีกเลี่ยงใน Final Exam เว้นแต่เป็นหลักการที่เอกสารระบุชัด</div>';app.innerHTML=h;side()}
function showUnit(id){let u=DATA.units.find(x=>x.id===id),c=DATA.concepts.filter(x=>x.unit===id);let h=`<section class="hero"><span class="pill">${u.id}</span><h1>${esc(u.thai)}</h1><p>${esc(u.title)} • ${c.length} บทเรียน</p></section><h2>บทเรียน</h2><div class="lessonList">`;c.forEach(x=>{let done=S.done[id+'-'+x.lesson];h+=`<div class="lessonRow" onclick="showLesson('${id}',${x.lesson})"><div class="circle">${done?'✓':x.lesson}</div><div><b>${esc(x.title)}</b><div class="muted">${esc(x.principle.slice(0,110))}...</div></div><button class="btn">เปิด</button></div>`});h+='</div>';app.innerHTML=h;side()}
function showLesson(id,no){let c=DATA.concepts.find(x=>x.unit===id&&x.lesson===no),uc=DATA.concepts.filter(x=>x.unit===id),idx=uc.findIndex(x=>x.lesson===no);let prev=idx>0?uc[idx-1]:null,next=idx<uc.length-1?uc[idx+1]:null;let h=`<section class="lessonPage"><div class="titleZone"><div class="eyebrow">${esc(c.unit)} • Lesson ${c.lesson} / ${uc.length}</div><h2>${esc(c.title)}</h2><div class="muted">${esc(c.unit_title)}</div></div><div class="visualZone"><div class="conceptBox"><h3>Core Principle</h3><p>${esc(c.principle)}</p></div><div class="conceptBox"><h3>Clinical Action</h3><p>${esc(c.action)}</p></div><div class="conceptBox"><h3>Outcome</h3><p>${esc(c.outcome)}</p></div></div><div class="calloutZone"><b>จุดที่ต้องแยกให้ออก:</b> อย่าจำแค่คำศัพท์ ให้จับว่าแนวคิดนี้ “รับผิดชอบระดับไหน – ทำอะไร – วัดผลอะไร” เพราะข้อสอบจะใช้ตัวเลือกที่เป็นแนวคิดใกล้เคียงกัน</div><div class="takeawayZone"><b>Takeaway:</b> ${esc(c.principle)}<br><span class="muted">นำไปใช้: ${esc(c.action)}</span></div><div style="padding:0 30px 25px"><div class="source"><b>Source:</b> ${esc(c.source)}</div></div><div class="foot"><button class="btn" ${prev?'':'disabled'} onclick="${prev?`showLesson('${id}',${prev.lesson})`:''}">← ก่อนหน้า</button><button class="btn good" onclick="markDone('${id}',${no})">${S.done[id+'-'+no]?'เรียนแล้ว ✓':'ทำเครื่องหมายว่าเรียนแล้ว'}</button><button class="btn primary" ${next?'':'disabled'} onclick="${next?`showLesson('${id}',${next.lesson})`:''}">ถัดไป →</button></div></section>`;app.innerHTML=h;side()}
function markDone(id,no){S.done[id+'-'+no]=true;save();showLesson(id,no)}
function showExamIntro(){let answered=Object.keys(S.exam.answers||{}).length;let h=`<section class="hero"><span class="pill">Final Assessment</span><h1>ข้อสอบ 180 ข้อ</h1><p>ระดับปานกลางค่อนยาก • คำถามตรง • ตัวเลือกเน้นแยกแนวคิดที่คล้ายกัน • เกณฑ์ผ่าน 80% (144/180)</p><div class="stats"><div class="stat"><span class="muted">จำนวนข้อ</span><b>180</b></div><div class="stat"><span class="muted">ตอบแล้ว</span><b>${answered}</b></div><div class="stat"><span class="muted">ผ่าน</span><b>144</b></div><div class="stat"><span class="muted">เฉลย</span><b>หลังส่ง</b></div></div><button class="btn primary" onclick="startExam()">${answered?'ทำต่อ':'เริ่มข้อสอบ'}</button> <button class="btn" onclick="resetExam()">เริ่มใหม่</button></section>`; if(S.exam.submitted)h+=`<div class="card" style="margin-top:15px"><b>ผลล่าสุด: ${S.exam.score} / 180</b> <button class="btn" onclick="showResult()">ดูผลและเฉลย</button></div>`;app.innerHTML=h;side()}
function startExam(){if(!S.exam.order||S.exam.order.length!==180){S.exam.order=DATA.questions.map(q=>q.id);let r=mulberry32(20260828);for(let i=S.exam.order.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[S.exam.order[i],S.exam.order[j]]=[S.exam.order[j],S.exam.order[i]]}S.exam.submitted=false;S.exam.score=null;save()} showQ(0)}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function getQ(i){return DATA.questions.find(q=>q.id===S.exam.order[i])}
function showQ(i){i=Math.max(0,Math.min(179,i));let q=getQ(i),a=S.exam.answers[q.id];let nav='';for(let k=0;k<180;k++){let qq=getQ(k),done=S.exam.answers[qq.id]!==undefined;nav+=`<button class="qnum ${done?'done':''} ${k===i?'current':''}" onclick="showQ(${k})">${k+1}</button>`}let opts=q.options.map((o,ix)=>`<button class="opt ${a===ix?'selected':''}" onclick="answerQ('${q.id}',${ix},${i})">${String.fromCharCode(65+ix)}. ${esc(o)}</button>`).join('');let h=`<div class="examWrap"><div class="examCard"><div class="muted">ข้อ ${i+1} / 180 • ${q.unit} • ${esc(q.concept)}</div><div class="qStem">${esc(q.stem)}</div>${opts}<div class="foot" style="padding:18px 0 0"><button class="btn" onclick="showQ(${i-1})" ${i===0?'disabled':''}>← ก่อนหน้า</button><button class="btn primary" onclick="showQ(${i+1})" ${i===179?'disabled':''}>ถัดไป →</button></div></div><div class="examCard examNav"><b>ตอบแล้ว ${Object.keys(S.exam.answers).length} / 180</b><div class="qnums">${nav}</div><button class="btn good" style="width:100%;margin-top:14px" onclick="submitExam()">ส่งข้อสอบ</button></div></div>`;app.innerHTML=h;side()}
function answerQ(id,a,i){S.exam.answers[id]=a;save();showQ(i)}
function submitExam(){let n=Object.keys(S.exam.answers).length;if(n<180){if(!confirm(`ยังตอบไม่ครบ ${180-n} ข้อ ต้องการส่งหรือไม่?`))return}let score=0;DATA.questions.forEach(q=>{if(S.exam.answers[q.id]===q.answer)score++});S.exam.score=score;S.exam.submitted=true;save();showResult()}
function showResult(){let score=S.exam.score||0,p=Math.round(score/180*100),ok=p>=DATA.passScore;let wrong=DATA.questions.filter(q=>S.exam.answers[q.id]!==q.answer);let h=`<section class="hero"><span class="pill">Final Result</span><h1 class="resultBig ${ok?'pass':'fail'}">${score} / 180</h1><p><b>${p}%</b> • ${ok?'PASS':'NOT PASS'} • เกณฑ์ผ่าน 80%</p><button class="btn" onclick="showExamIntro()">กลับหน้า Final Exam</button></section><div class="card review"><h2>ทบทวนข้อที่ผิด/ไม่ได้ตอบ (${wrong.length} ข้อ)</h2>`;wrong.forEach(q=>{let ua=S.exam.answers[q.id],u=ua===undefined?'ไม่ได้ตอบ':q.options[ua],ca=q.options[q.answer];h+=`<div class="reviewItem"><b>${esc(q.stem)}</b><div class="muted">คำตอบของคุณ: ${esc(u)}</div><div class="pass">คำตอบที่ถูก: ${esc(ca)}</div><div class="why">${esc(q.explain)}<br><span class="muted">Source: ${esc(q.source)}</span></div></div>`});h+='</div>';app.innerHTML=h;side()}
function resetExam(){if(!confirm('ล้างคำตอบและเริ่มข้อสอบใหม่?'))return;S.exam={answers:{},submitted:false,score:null,order:[]};save();showExamIntro()}
function showSources(){let h=`<section class="hero"><h1>Source Map</h1><p>เอกสารหลักที่ใช้สร้างบทเรียนและข้อสอบ</p></section><div class="grid">`;['1. Primary_Nursing_Excellence_in_Hemodialysis.pdf','2. Hemodialysis_Case_Management_Excellence.pdf','3. Care management.pdf','4. Nurse-led_Renal_Care_Evolution.pdf','5. Shared Renal Care Decisions and DM-Tool.pdf','การจัดการตนเอง_CKD.pdf','การดูแล CKD ระยะก่อน RRT.pdf','2.4 การดูแลด้านจิตสังคมของผู้ป่วยโรคไตและครอบครัว.pdf','3.สมรรถนะพยาบาลเฉพาะทางการบำบัดทดแทนไต.pdf'].forEach(x=>h+=`<div class="card"><b>${esc(x)}</b></div>`);h+='</div><div class="footerNote">หมายเหตุ: Final Exam เน้นหลักการและการแยกบทบาท/กระบวนการ/ผลลัพธ์ ไม่เน้นตัวเลข guideline ที่มีโอกาสเปลี่ยนตามเวลา</div>';app.innerHTML=h;side()}
const app=document.getElementById('app');goHome();
</script></body></html>
