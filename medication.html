<script>
const D={"title":"Medication Management in Kidney Disease & RRT","thai":"การบริหารยาในผู้ป่วยโรคไตและการบำบัดทดแทนไต","version":"v1.0","passScore":80,"lessons":[{"id":"M1","title":"Pharmacokinetic Changes in CKD & AKI","thai":"การเปลี่ยนแปลงเภสัชจลนศาสตร์ใน CKD และ AKI","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.4–10","points":[["Absorption / Bioavailability","CKD อาจเปลี่ยนการดูดซึมจากคลื่นไส้ อาเจียน diabetic gastroparesis intestinal edema และ gastric pH ที่เปลี่ยนไป"],["Distribution","ภาวะบวม/น้ำเกินและการจับโปรตีนที่ลดลงทำให้ volume of distribution และ free drug เปลี่ยนได้"],["Loading vs Maintenance","Loading dose สัมพันธ์กับ Vd ส่วน maintenance dose สัมพันธ์กับการกำจัดยา จึงไม่ควรลดทุกขนาดยาแบบอัตโนมัติเมื่อไตเสื่อม"],["AKI is dynamic","AKI เปลี่ยนเร็ว ต้องประเมิน renal function และ fluid status ซ้ำ ไม่ใช้ค่าเดิมตลอดการรักษา"]],"pit":"อย่าใช้คำว่า “ไตเสื่อม = ลดทุก dose” เพราะ loading dose และ maintenance doseอาศัยปัจจัยคนละชุด","clinical":"ก่อนให้ยาให้ถาม 4 ข้อ: renal function ตอนนี้เท่าไร? volume status เป็นอย่างไร? protein binding/Vd ของยาเป็นอย่างไร? มี active RRT หรือไม่?"},{"id":"M2","title":"Renal Function & Dose Adjustment","thai":"การประเมินการทำงานของไตและการปรับขนาดยา","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.10, 121, 129–145","points":[["Renal function","เลือกค่าการทำงานของไตที่เหมาะกับคำแนะนำการใช้ยา และดูแนวโน้ม ไม่ดู creatinine ค่าเดียว"],["Dose strategy","การปรับยาอาจทำโดยลดขนาดยา เพิ่มช่วงห่าง หรือทั้งสองอย่าง ตาม therapeutic target และ PK"],["Residual renal function","แม้ได้รับ RRT residual renal function ยังมีผลต่อ total clearance"],["Reassessment","เมื่อ modality, fluid status หรือ renal function เปลี่ยน ต้องประเมิน regimen ใหม่"]],"pit":"อย่าสับสน eGFR ที่ใช้ staging กับค่าที่เอกสารยาบางชนิดใช้สำหรับ dosing; ให้ยึดวิธีที่ dosing reference ของยานั้นระบุ","clinical":"ทุกครั้งที่มี AKI, เริ่ม/หยุด dialysis, เปลี่ยน modality หรือเกิดน้ำเกินมาก ให้ถือว่า dose plan เดิมต้องถูกทบทวน"},{"id":"M3","title":"Drugs to Slow CKD Progression & Safety","thai":"ยาชะลอ CKD และการเฝ้าระวังความปลอดภัย","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.11–52","points":[["RAS blockade","ACEi/ARB มีบทบาทในการควบคุมความดันและ albuminuria; ต้องติดตาม creatinine/eGFR และ potassium"],["SGLT2 inhibitors","มี kidney/CV benefit ในกลุ่มที่เหมาะสม แต่ต้องรู้ภาวะเสี่ยง volume depletion และ euglycemic DKA"],["Sick-day thinking","เมื่อมี acute illness, fasting หรือ surgery ต้องทบทวนยาที่เพิ่มความเสี่ยง dehydration/ketosis ตามแผนของทีมรักษา"],["Finerenone","จุดเฝ้าระวังสำคัญคือ potassium และ renal function ตาม source-course protocol"]],"pit":"ผลดีต่อไตไม่แปลว่า “ไม่มี monitoring” — ยาที่ช่วยชะลอ CKD หลายกลุ่มต้องติดตาม volume status, K และ renal function","clinical":"พยาบาลควรเชื่อมยา ↔ lab ↔ อาการ เช่น dizziness/volume depletion, K สูง, creatinine เปลี่ยน และเหตุการณ์ sick day"},{"id":"M4","title":"Anemia: Iron & ESA","thai":"การบริหารธาตุเหล็กและ ESA ในภาวะโลหิตจาง","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.53–74","points":[["Iron status","ใช้ TSAT และ ferritin ประเมินสถานะเหล็กและติดตามระหว่าง ESA/iron therapy"],["Route","ผู้ป่วย HD มักได้ประโยชน์จาก IV iron ในด้าน ESA responsiveness ขณะที่ CKD ระยะ 3–4/PD อาจใช้ oral ironได้ตามความเหมาะสม"],["IV iron safety","หลีกเลี่ยง IV iron เมื่อมี active systemic infection ตามเอกสารหลักสูตร และเฝ้าระวัง infusion reaction"],["ESA safety","ชั่งประโยชน์การลด transfusion/อาการกับความเสี่ยง เช่น hypertension, stroke และ vascular access loss"]],"pit":"Hb ต่ำไม่ได้แปลว่าเพิ่ม ESA อย่างเดียว ต้องประเมิน iron status และสาเหตุที่ทำให้ตอบสนองต่อ ESA ไม่ดี","clinical":"ก่อน ESA/iron: ตรวจ Hb trend, TSAT/ferritin, infection status, BP และอาการ; หลังให้ติดตาม response + adverse effects"},{"id":"M5","title":"CKD-MBD Medication","thai":"ยาจัดการ CKD-MBD และ phosphate","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.75–102","points":[["Phosphate binders","ออกฤทธิ์ในทางเดินอาหาร จึงต้องสัมพันธ์กับมื้ออาหาร; technique การรับประทานมีผลต่อ efficacy"],["Calcium binders","calcium carbonate/acetate มีประสิทธิภาพแต่เสี่ยง hypercalcemia และ calcium load"],["Non-calcium binders","sevelamer ไม่มี calcium/aluminum; ช่วยลด calcium load แต่มี GI burden/pill burden"],["PTH control","vitamin D agents ลด PTH แต่เพิ่ม Ca/P ได้; calcimimetic เช่น cinacalcet ลด PTH ผ่าน calcium-sensing receptor และเสี่ยง hypocalcemia"]],"pit":"ยา “ลด phosphate” กับยา “ลด PTH” ไม่ใช่กลุ่มเดียวกัน และต้องดู Ca/P/PTH ร่วมกัน","clinical":"ถามผู้ป่วยว่า binder กินเมื่อไร ไม่ใช่ถามแค่ว่า “กินครบไหม” เพราะ timing กับอาหารเป็นหัวใจของการออกฤทธิ์"},{"id":"M6","title":"Metabolic Acidosis & Hyperkalemia","thai":"ยาสำหรับ metabolic acidosis และ hyperkalemia","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.103–107","points":[["Bicarbonate","oral sodium bicarbonate ใช้แก้ metabolic acidosis ในผู้ป่วยที่เหมาะสมตามแผนรักษา"],["Sodium load","ต้องติดตามบวม น้ำหนัก ความดัน และ volume status เพราะ sodium bicarbonate เพิ่ม sodium load"],["Adverse effects","อาจเกิด GI distress และ metabolic alkalosis หากให้มากเกินไป"],["Hyperkalemia","K สูงมีความเสี่ยง arrhythmia; การใช้ potassium binder ต้องบริหารตามชนิดยาและคำแนะนำอย่างถูกต้อง"]],"pit":"แก้ bicarbonate ต่ำโดยไม่ดู fluid status อาจแลก acidosis กับ volume overload","clinical":"ประเมิน K, bicarbonate, ECG/อาการเมื่อเหมาะสม, bowel status, volume status และสาเหตุจากยา/อาหารร่วมกัน"},{"id":"M7","title":"Cardiovascular Drugs Around Hemodialysis","thai":"ยาหัวใจและความดันรอบการฟอกเลือด","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.108–120, 133","points":[["Timing around HD","การให้/งดยาความดันก่อน HD ต้องพิจารณา BP pattern, intradialytic hypotension และ dialyzability"],["Dialyzability","ยาความดันบางตัวถูกขจัดด้วย HD บางตัวไม่ถูกขจัด จึงจัดเวลาให้ยาไม่เหมือนกัน"],["Combination risk","beta-blocker + non-DHP CCB เพิ่ม bradycardia/heart block; K-sparing diuretic + ACEi/ARB เพิ่ม hyperkalemia"],["IDH medications","source-course ระบุ midodrine เป็นหนึ่งใน pharmacologic options สำหรับ IDH พร้อมข้อควรระวัง"]],"pit":"อย่ามีกฎเดียวว่า “ยาความดันต้องงดก่อนฟอกทุกตัว” — ต้องดู BP pattern, indication และคุณสมบัติยา","clinical":"บันทึก pre/intra/post-HD BP + ยาที่รับประทานจริง + อาการ เพื่อให้ทีมปรับ timing ได้จากข้อมูล ไม่ใช่ความจำ"},{"id":"M8","title":"Drug Removal by RRT","thai":"การขจัดยาโดย Hemodialysis และ RRT","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.121–143","points":[["Patient factors","residual renal function, hypoalbuminemia, Vd และ nonrenal clearance มีผลต่อ total clearance"],["Drug factors","protein binding, Vd, molecular weight, hydrosolubility และ charge มีผลต่อ extracorporeal removal"],["RRT factors","modality, diffusion/convection/adsorption, membrane, dose, blood/dialysate flow และ treatment duration ล้วนสำคัญ"],["High-flux / SLED / CRRT","เปลี่ยน modality หรือ membrane แล้ว dialyzability ของยาอาจเปลี่ยน จึงต้องทบทวน regimen"]],"pit":"คำถาม “ยานี้ฟอกออกไหม” ไม่มีคำตอบจากชื่อยาอย่างเดียว ต้องรู้ modality + membrane + timing + patient factors","clinical":"ถ้ายาถูกขจัดมากด้วย IHD อาจต้องจัดหลังฟอกหรือมี supplemental dose ตาม dosing reference เฉพาะยา"},{"id":"M9","title":"Antimicrobials in HD / PD","thai":"การบริหารยาต้านจุลชีพในผู้ป่วย HD และ PD","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.131, 144–155","points":[["Vancomycin / HD","dosing ขึ้นกับ dialyzer permeability และให้ระหว่างหรือหลัง HD; ต้องใช้ regimen/TDM ที่เหมาะกับบริบท"],["PD peritonitis","การรักษา peritonitis ใน CAPD มี intraperitoneal antimicrobial regimens ตาม source"],["Acyclovir","ขับออกทางไตสูงและ half-life ยาวขึ้นมากใน renal failure จึงต้องปรับ dose/interval"],["Toxicity recognition","confusion, delirium, hallucination หรือ coma ใน CKD/HD/PD ที่ได้รับ acyclovir ต้องคิดถึง neurotoxicity"]],"pit":"neurologic symptoms หลังเริ่มยาในผู้ป่วยไตเสื่อมไม่ควรสรุปว่าเป็น uremia/ติดเชื้ออย่างเดียว ต้องทำ medication review","clinical":"เมื่อสั่ง antibiotic/antiviral ให้ผูก dose กับ renal function + RRT schedule + TDM (ถ้ามี) + time of last dose"},{"id":"M10","title":"Medication Reconciliation & Patient Safety","thai":"Medication reconciliation และความปลอดภัยจากยา","source":"Medication management in kidney diseases 2026 FINAL.pdf pp.146–178","points":[["Reconciliation","รวบรวมยาจากทุกแหล่ง รวม OTC สมุนไพร ยาซื้อเอง และยาจากหลายโรงพยาบาล เพื่อหา duplication/interactions"],["Nephrotoxic exposure","NSAIDs และยาที่ต้องปรับตามไตเป็นจุดเสี่ยงสำคัญ ต้องประเมิน indication และ renal function"],["Transitions","เปลี่ยนโรงพยาบาล เปลี่ยนยี่ห้อ/รูปแบบ/ความแรง หรือมีผู้ดูแลใหม่ เพิ่มความเสี่ยง medication error"],["Education tools","teach-back, medication passport, pillbox และบันทึก BP/BS ช่วยให้การใช้ยาต่อเนื่องและตรวจพบปัญหาเร็วขึ้น"]],"pit":"รายการยา “เหมือนเดิม” อาจไม่จริงหากไม่ได้ถามยาซื้อเอง ยาที่หยุดไปแล้ว หรือยาอีกโรงพยาบาล","clinical":"ทุก transition of care ควรทำ medication reconciliation และให้ผู้ป่วย/ผู้ดูแลอธิบายวิธีใช้ยากลับ"}],"questions":[{"id":"MED-001","lesson":"M1","stem":"ปัจจัยใดใน CKD สามารถทำให้การดูดซึมยารับประทานเปลี่ยนแปลงได้มากที่สุด?","options":["การเพิ่มมวลกล้ามเนื้อ","Diabetic gastroparesis และ intestinal edema","การเพิ่ม renal blood flow","การเพิ่ม albumin"],"answer":1,"explain":"CKD อาจเปลี่ยน bioavailability ผ่าน gastroparesis, intestinal edema, gastric pH และปฏิกิริยากับยา/สารจับฟอสเฟต","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-002","lesson":"M1","stem":"Loading dose ของยาสัมพันธ์กับปัจจัยใดมากที่สุด?","options":["Volume of distribution","Renal clearance เพียงอย่างเดียว","Urine output เพียงอย่างเดียว","เวลาที่ฟอกเลือดครั้งถัดไปเพียงอย่างเดียว"],"answer":0,"explain":"หลักใน source แยก loading dose ตาม Vd ขณะที่ maintenance dose อาศัยการกำจัดยา","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-003","lesson":"M1","stem":"Maintenance dose ของยาควรพิจารณาปัจจัยใดเป็นหลัก?","options":["สีของยา","อัตราการกำจัดยาออกจากร่างกาย","จำนวนเม็ดยาที่ผู้ป่วยชอบรับประทาน","ค่า Hb เพียงอย่างเดียว"],"answer":1,"explain":"Maintenance dosing ถูกกำหนดโดย clearance ทั้ง renal และ nonrenal รวมถึงการขจัดโดย RRT","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-004","lesson":"M1","stem":"ผู้ป่วย AKI มีน้ำเกินมาก การให้ loading dose ของยาที่มี Vd เพิ่มจาก volume overload ควรคิดอย่างไร?","options":["ลด loading dose ทุกกรณี","อาจต้องใช้ loading dose มากขึ้นในยาบางชนิด","งด loading dose เสมอ","ใช้ maintenance dose แทน loading dose"],"answer":1,"explain":"Volume overload ทำให้ Vd ของยาบางชนิดเพิ่ม จึงอาจต้องเพิ่ม loading dose เพื่อให้ถึง target concentration","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-005","lesson":"M1","stem":"Hypoalbuminemia มีผลต่อยาที่จับโปรตีนสูงอย่างไร?","options":["ลด free drug เสมอ","อาจเพิ่ม free drug fraction","ไม่มีผลต่อการกระจายยา","ทำให้ยาทุกชนิดถูกฟอกออกหมด"],"answer":1,"explain":"เมื่อ protein binding ลดลง free fraction อาจเพิ่มและเปลี่ยนทั้ง effect และ dialyzability","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-006","lesson":"M1","stem":"เหตุใดการปรับยาใน AKI ต้องประเมินซ้ำบ่อย?","options":["เพราะชื่อยาจะเปลี่ยน","เพราะ renal function และ fluid status เปลี่ยนได้รวดเร็ว","เพราะทุกยามี half-life เท่ากัน","เพราะ AKI ไม่มีผลต่อ PK"],"answer":1,"explain":"AKI เป็นภาวะ dynamic จึงต้อง reassess maintenance regimen ตาม renal function และ volume status ปัจจุบัน","source":"Medication management 2026 pp.4–10","level":"กลางค่อนยาก"},{"id":"MED-007","lesson":"M2","stem":"ข้อใดถูกต้องที่สุดเกี่ยวกับการปรับขนาดยาในไตเสื่อม?","options":["ต้องลดทั้ง loading และ maintenance dose ทุกยา","อาจลด dose เพิ่ม interval หรือปรับทั้งสองตาม PK/PD","ต้องเพิ่มความถี่ทุกยา","ใช้ serum creatinine ค่าเดียวโดยไม่ดูบริบท"],"answer":1,"explain":"การปรับ regimen มีหลายวิธีและขึ้นกับ PK/PD กับ therapeutic target ไม่ใช่สูตรเดียวสำหรับทุกยา","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-008","lesson":"M2","stem":"ข้อใดควรทำเมื่อผู้ป่วยเริ่ม hemodialysis หลังจากเดิมยังไม่ได้ RRT?","options":["ใช้ dose เดิมต่อจนจบ course","ทบทวน regimen เพราะมี extracorporeal clearance เพิ่มเข้ามา","หยุดยาทุกชนิด","เพิ่มยาเป็นสองเท่าทุกชนิด"],"answer":1,"explain":"การเริ่ม RRT เปลี่ยน total clearance จึงต้องประเมิน dose และ timing ใหม่","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-009","lesson":"M2","stem":"Residual renal function ในผู้ป่วยที่ทำ dialysis มีความหมายต่อการบริหารยาอย่างไร?","options":["ไม่มีความหมายเพราะฟอกเลือดแทนไตทั้งหมด","ยังมีผลต่อ total drug clearance","มีผลเฉพาะ phosphate binder","มีผลเฉพาะยาใต้ผิวหนัง"],"answer":1,"explain":"Residual renal clearance อาจมีนัยสำคัญ โดยเฉพาะยาที่ขับทางไตสูง","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-010","lesson":"M2","stem":"เหตุการณ์ใดควรกระตุ้นให้ทบทวน dose plan ใหม่ทันที?","options":["ผู้ป่วยเปลี่ยนเตียง","เปลี่ยนจาก IHD เป็น CRRT","เปลี่ยนเวลาอาหาร 15 นาที","เปลี่ยนเสื้อผ้า"],"answer":1,"explain":"การเปลี่ยน RRT modality เปลี่ยน extracorporeal clearance ได้อย่างมาก","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-011","lesson":"M2","stem":"ข้อใดไม่เหมาะสมในการประเมิน renal dosing?","options":["ดูแนวโน้ม renal function","ดู RRT modality","ดู volume status","ใช้ค่า creatinine เก่าโดยไม่สนใจการเปลี่ยนแปลงล่าสุด"],"answer":3,"explain":"การใช้ค่าที่ไม่สะท้อนสถานะปัจจุบันเสี่ยง under/overdosing","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-012","lesson":"M2","stem":"หลักคิดที่เหมาะสมที่สุดเมื่อ dosing reference ระบุ CrCl แต่ผู้ป่วยมี eGFR ในรายงาน lab คือข้อใด?","options":["ใช้ eGFR แทนเสมอโดยไม่ตรวจ reference","ตรวจว่าคำแนะนำของยานั้นใช้ renal estimate ใด","ไม่ต้องประเมินไต","เลือกค่าที่สูงกว่าเสมอ"],"answer":1,"explain":"ควรยึด renal function estimate ตาม dosing reference ของยาและบริบทผู้ป่วย","source":"Medication management 2026 pp.10,121,129–145","level":"กลางค่อนยาก"},{"id":"MED-013","lesson":"M3","stem":"การใช้ ACEi/ARB ใน CKD ควรติดตาม lab ใดสำคัญ?","options":["Creatinine/eGFR และ potassium","Amylase และ lipase เท่านั้น","Calcium เท่านั้น","INR เท่านั้น"],"answer":0,"explain":"RAS blockade ต้องเฝ้าระวัง renal function และ hyperkalemia","source":"Medication management 2026 pp.11–52","level":"กลางค่อนยาก"},{"id":"MED-014","lesson":"M3","stem":"ข้อใดเป็น adverse effect ที่ source เน้นในการใช้ SGLT2 inhibitor?","options":["Volume depletion","Severe hypercalcemia เป็นหลัก","Hemolysis เป็นหลัก","Hyperphosphatemia โดยตรง"],"answer":0,"explain":"Source แสดง volume depletion เป็น adverse event of interest และมี sick-day considerations","source":"Medication management 2026 pp.11–52","level":"กลางค่อนยาก"},{"id":"MED-015","lesson":"M3","stem":"สถานการณ์ใดเพิ่มความเสี่ยง euglycemic DKA ในผู้ใช้ SGLT2 inhibitor?","options":["Surgery หรือ caloric restriction","รับประทานอาหารปกติและ stable","ไม่มี diabetes และไม่มี acute illness","เพิ่มน้ำหนักเล็กน้อยเพียงอย่างเดียว"],"answer":0,"explain":"Surgical stress, caloric restriction, insulin reduction และ alcohol abuse เป็น risk factors ที่ source ระบุ","source":"Medication management 2026 pp.11–52","level":"กลางค่อนยาก"},{"id":"MED-016","lesson":"M3","stem":"เป้าหมายสำคัญของ sick-day management คืออะไร?","options":["เพิ่มยาทุกชนิดเมื่อป่วย","ลดความเสี่ยงจากยาบางกลุ่มเมื่อเกิด dehydration/fasting/acute illness","หยุดยาเรื้อรังทุกชนิดถาวร","งดการติดตามอาการ"],"answer":1,"explain":"Sick-day plan ช่วยจัดการยาที่อาจเพิ่มความเสี่ยงในภาวะขาดน้ำ/อดอาหาร/เจ็บป่วยเฉียบพลัน","source":"Medication management 2026 pp.11–52","level":"กลางค่อนยาก"},{"id":"MED-017","lesson":"M3","stem":"จุดเฝ้าระวังสำคัญของ finerenone ตาม source คือข้อใด?","options":["Potassium","Platelet เพียงอย่างเดียว","Uric acid เพียงอย่างเดียว","Amylase เพียงอย่างเดียว"],"answer":0,"explain":"Finerenone มีความเสี่ยง hyperkalemia จึงต้องติดตาม K และ renal function","source":"Medication management 2026 pp.11–52","level":"กลางค่อนย ระบุ HD ขจัด acyclovir ได้ประมาณ 40–60%; ใช้เป็นข้อมูลหลักสูตร ไม่ใช่คำสั่งรักษาเฉพาะราย","source":"Medication management 2026 pp.131,144–155","level":"กลางค่อนยาก"},{"id":"MED-054","lesson":"M9","stem":"เมื่อผู้ป่วยเริ่ม antibiotic ที่ต้อง dose ตามไต สิ่งใดควรถูกบันทึกร่วมกัน?","options":["Renal function, RRT schedule และเวลา last dose","ชื่อห้องผู้ป่วยเท่านั้น","ระดับ HbA1c เท่านั้น","รอบเอวเท่านั้น"],"answer":0,"explain":"การผูก dose กับ renal function, modality/schedule และ timing ลด medication error และช่วย TDM","source":"Medication management 2026 pp.131,144–155","level":"กลางค่อนยาก"},{"id":"MED-055","lesson":"M10","stem":"เป้าหมายหลักของ medication reconciliation คืออะไร?","options":["สร้างรายการยาที่ถูกต้องและค้นหา duplication/interactions/omissions","เพิ่มจำนวนยาให้มากที่สุด","เปลี่ยนยาทุกตัวเป็นยาฉีด","หยุดยาทุกตัวที่ผู้ป่วยซื้อเองโดยไม่ประเมิน"],"answer":0,"explain":"Reconciliation ต้องรวบรวมยาทุกแหล่งและแก้ discrepancy อย่างมีเหตุผล","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"},{"id":"MED-056","lesson":"M10","stem":"ยากลุ่มใดเป็นจุดเสี่ยง nephrotoxicity ที่ควรถามเรื่องการซื้อใช้เองใน CKD?","options":["NSAIDs","Topical moisturizer","Normal saline mouth rinse","Artificial tears"],"answer":0,"explain":"Source-case เน้น NSAID self-medication เป็นปัญหาสำคัญใน CKD","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"},{"id":"MED-057","lesson":"M10","stem":"ข้อใดเป็นตัวอย่าง therapeutic duplication?","options":["ได้รับ glimepiride และ glipizide พร้อมกันโดยไม่มีเหตุผลชัดเจน","ได้รับยา 1 ตัวเช้า 1 ตัวเย็นต่างกลุ่ม","ได้รับ phosphate binder พร้อมอาหาร","ได้รับ ESA ตามแผน"],"answer":0,"explain":"Source-case ใช้ sulfonylurea สองตัวเป็นตัวอย่าง duplication of therapy","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"},{"id":"MED-058","lesson":"M10","stem":"ช่วงใดเสี่ยง medication error มากและควรทำ reconciliation?","options":["เมื่อย้ายโรงพยาบาลหรือเปลี่ยนแผนการรักษา","เมื่อผู้ป่วยอ่านหนังสือ","เมื่อชั่งน้ำหนักหลังฟอก","เฉพาะวันเกิด"],"answer":0,"explain":"Transitions of care และการเปลี่ยนยี่ห้อ/รูปแบบ/ความแรงเพิ่มโอกาสเกิด discrepancy","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"},{"id":"MED-059","lesson":"M10","stem":"วิธีใดประเมินความเข้าใจการใช้ยาได้ดีกว่าถามว่า “เข้าใจไหม”?","options":["ให้ผู้ป่วยหรือผู้ดูแลอธิบายวิธีใช้ยากลับ (teach-back)","ถามคำถาม yes/no เท่านั้น","ให้เอกสารโดยไม่อธิบาย","ไม่ต้องตรวจความเข้าใจ"],"answer":0,"explain":"Teach-back ตรวจว่าผู้ป่วยสามารถนำคำแนะนำไปใช้จริง","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"},{"id":"MED-060","lesson":"M10","stem":"ผู้ป่วย CKD มี bradycardia หลังเปลี่ยนเป็น atenolol ขั้นตอนที่เหมาะสมที่สุดคือข้อใด?","options":["ทบทวนยาใหม่ทั้งหมด ประเมิน renal function/dose และความสัมพันธ์กับอาการ","เพิ่ม atenolol ทันที","ไม่ต้องดู renal function","สรุปว่าเป็น CKD โดยไม่ review ยา"],"answer":0,"explain":"Source-case แสดงความสำคัญของ medication history + renal function + dose appropriateness เมื่อเกิด adverse event","source":"Medication management 2026 pp.146–178","level":"กลางค่อนยาก"}],"quick":{"M1":["MED-001","MED-002"],"M2":["MED-007","MED-008"],"M3":["MED-013","MED-014"],"M4":["MED-019","MED-020"],"M5":["MED-025","MED-026"],"M6":["MED-031","MED-032"],"M7":["MED-037","MED-038"],"M8":["MED-043","MED-044"],"M9":["MED-049","MED-050"],"M10":["MED-055","MED-056"]}};const KEY='kidney_medication_unit_v1';let S=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"exam":{"answers":{},"order":[],"submitted":false,"score":null},"quick":{}}');function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const app=document.getElementById('app');
function side(){let h='<div class="sec">Medication Lessons</div>';D.lessons.forEach((l,i)=>h+=`<button class="nav" onclick="lesson(${i})"><b>${l.id} · ${esc(l.thai)}</b><small>${S.done[l.id]?'✓ completed':'เรียนต่อ'}</small></button>`);h+='<div class="sec">Assessment</div><button class="nav" onclick="examIntro()"><b>Medication Final Exam</b><small>60 ข้อ • ผ่าน 80%</small></button>';document.getElementById('side').innerHTML=h}
function pct(){let d=D.lessons.filter(l=>S.done[l.id]).length;return [d,Math.round(d/D.lessons.length*100)]}
function home(){let [d,p]=pct();app.innerHTML=`<section class="hero"><span class="pill">Special Unit</span><span class="pill">10 Lessons</span><span class="pill">60 Separate Questions</span><h1>${esc(D.thai)}</h1><p>หน่วยนี้แยกจาก Course 3 Final 180 ข้อโดยสมบูรณ์ เน้น renal dose adjustment, timing รอบ dialysis, anemia/ESA/iron, CKD-MBD, electrolyte/acid-base, cardiovascular drugs, RRT drug removal, antimicrobials และ medication safety</p><div class="stats"><div class="stat"><span class="muted">บทเรียน</span><b>${d}/10</b></div><div class="stat"><span class="muted">Progress</span><b>${p}%</b></div><div class="stat"><span class="muted">Exam</span><b>60</b></div><div class="stat"><span class="muted">ผ่าน</span><b>48</b></div></div><div class="prog"><div class="bar" style="width:${p}%"></div></div><div class="call" style="margin:20px 0 0"><b>Clinical safety:</b> เนื้อหาและตัวเลขในบทนี้ใช้เพื่อทบทวนตามเอกสารหลักสูตร 2026 (Source-course criteria) ไม่ใช่ prescribing reference สำหรับผู้ป่วยจริง</div></section><h2>บทเรียน</h2><div class="grid">${D.lessons.map((l,i)=>`<div class="card" onclick="lesson(${i})"><span class="pill">${l.id}</span><h3>${esc(l.thai)}</h3><p class="muted">${esc(l.title)}</p><div class="prog"><div class="bar" style="width:${S.done[l.id]?100:0}%"></div></div></div>`).join('')}</div><div class="note">Source of truth: Medication management in kidney diseases 2026 FINAL.pdf • exact dose/threshold questions are labelled as source-course criteria when used.</div>`;side()}
function lesson(i){let l=D.lessons[i],pts=l.points.map(p=>`<div class="pbox"><h3>${esc(p[0])}</h3><div>${esc(p[1])}</div></div>`).join(''),qids=D.quick[l.id],qh=qids.map((id,ix)=>{let q=D.questions.find(x=>x.id===id);let state=(S.quick[l.id]||{})[id];return `<div style="margin-top:13px"><b>${ix+1}. ${esc(q.stem)}</b>${q.options.map((o,oi)=>`<button class="qopt ${state!==undefined?(oi===q.answer?'good':(oi===state?'bad':'')):''}" onclick="quick('${l.id}','${id}',${oi},${i})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('')}${state!==undefined?`<div class="muted">${esc(q.explain)}</div>`:''}</div>`}).join('');app.innerHTML=`<section class="lesson"><div class="head"><span class="pill">${l.id} / M10</span><h2>${esc(l.thai)}</h2><div class="muted">${esc(l.title)}</div></div><div class="points">${pts}</div><div class="call"><b>Exam trap:</b> ${esc(l.pit)}</div><div class="take"><b>Clinical workflow:</b> ${esc(l.clinical)}</div><div class="quick"><h3>Quick Check</h3>${qh}</div><div class="src"><b>Source:</b> ${esc(l.source)}<br><small>ใช้เพื่อการศึกษา/สอบตามเอกสารหลักสูตร ไม่ใช่คำสั่งยาเฉพาะราย</small></div><div class="foot"><button class="btn" onclick="lesson(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← ก่อนหน้า</button><button class="btn good" onclick="done('${l.id}',${i})">${S.done[l.id]?'เรียนแล้ว ✓':'ทำเครื่องหมายว่าเรียนแล้ว'}</button><button class="btn pri" onclick="lesson(${Math.min(D.lessons.length-1,i+1)})" ${i===D.lessons.length-1?'disabled':''}>ถัดไป →</button></div></section>`;side()}
function done(id,i){S.done[id]=true;save();lesson(i)}function quick(l,id,a,i){S.quick[l]=S.quick[l]||{};S.quick[l][id]=a;save();lesson(i)}
function examIntro(){let n=Object.keys(S.exam.answers||{}).length;app.innerHTML=`<section class="hero"><span class="pill">Separate Assessment</span><h1>Medication Final Exam • 60 ข้อ</h1><p>ระดับปานกลางค่อนยาก • ถามตรง • ไม่ใช้โจทย์แปลความยาว • แยกคะแนนจาก Course 3 Final 180 ข้อ</p><div class="stats"><div class="stat"><span class="muted">จำนวน</span><b>60</b></div><div class="stat"><span class="muted">ตอบแล้ว</span><b>${n}</b></div><div class="stat"><span class="muted">ผ่าน</span><b>48</b></div><div class="stat"><span class="muted">เฉลย</span><b>หลังส่ง</b></div></div><button class="btn pri" onclick="startExam()">${n?'ทำต่อ':'เริ่มข้อสอบ'}</button> <button class="btn" onclick="resetExam()">เริ่มใหม่</button></section>${S.exam.submitted?`<div class="card" style="margin-top:14px"><b>ผลล่าสุด ${S.exam.score} / 60</b> <button class="btn" onclick="result()">ดูเฉลยข้อผิด</button></div>`:''}`;side()}
function rng(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function startExam(){if(!S.exam.order||S.exam.order.length!==60){S.exam.order=D.questions.map(q=>q.id);let r=rng(20260831);for(let i=59;i>0;i--){let j=Math.floor(r()*(i+1));[S.exam.order[i],S.exam.order[j]]=[S.exam.order[j],S.exam.order[i]]}S.exam.submitted=false;S.exam.score=null;save()}showQ(0)}function getQ(i){return D.questions.find(q=>q.id===S.exam.order[i])}
function showQ(i){i=Math.max(0,Math.min(59,i));let q=getQ(i),a=S.exam.answers[q.id],nav='';for(let k=0;k<60;k++){let z=getQ(k),done=S.exam.answers[z.id]!==undefined;nav+=`<button class="qn ${done?'done':''} ${k===i?'cur':''}" onclick="showQ(${k})">${k+1}</button>`}let opts=q.options.map((o,oi)=>`<button class="opt ${a===oi?'sel':''}" onclick="answer('${q.id}',${oi},${i})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('');app.innerHTML=`<div class="examwrap"><div class="exam"><div class="muted">ข้อ ${i+1} / 60 • ${q.lesson} • ${esc(q.level)}</div><div class="stem">${esc(q.stem)}</div>${opts}<div class="foot" style="padding:18px 0 0"><button class="btn" onclick="showQ(${i-1})" ${i===0?'disabled':''}>← ก่อนหน้า</button><button class="btn pri" onclick="showQ(${i+1})" ${i===59?'disabled':''}>ถัดไป →</button></div></div><div class="exam examnav"><b>ตอบแล้ว ${Object.keys(S.exam.answers).length} / 60</b><div class="qnums">${nav}</div><button class="btn good" style="width:100%;margin-top:13px" onclick="submitExam()">ส่งข้อสอบ</button></div></div>`;side()}
function answer(id,a,i){S.exam.answers[id]=a;save();showQ(i)}function submitExam(){let n=Object.keys(S.exam.answers).length;if(n<60&&!confirm(`ยังตอบไม่ครบ ${60-n} ข้อ ต้องการส่งหรือไม่?`))return;let score=D.questions.filter(q=>S.exam.answers[q.id]===q.answer).length;S.exam.score=score;S.exam.submitted=true;save();result()}
function result(){let score=S.exam.score||0,p=Math.round(score/60*100),ok=p>=80,wrong=D.questions.filter(q=>S.exam.answers[q.id]!==q.answer);app.innerHTML=`<section class="hero"><span class="pill">Medication Result</span><h1 class="result ${ok?'pass':'fail'}">${score} / 60</h1><p><b>${p}%</b> • ${ok?'PASS':'NOT PASS'} • เกณฑ์ผ่าน 80%</p><button class="btn" onclick="examIntro()">กลับหน้า Exam</button></section><div class="card review"><h2>ทบทวนข้อผิด/ไม่ได้ตอบ (${wrong.length})</h2>${wrong.map(q=>{let ua=S.exam.answers[q.id];return `<div class="ritem"><b>${esc(q.stem)}</b><div class="muted">คำตอบของคุณ: ${ua===undefined?'ไม่ได้ตอบ':esc(q.options[ua])}</div><div class="pass">คำตอบที่ถูก: ${esc(q.options[q.answer])}</div><div>${esc(q.explain)}</div><div class="muted">Source: ${esc(q.source)}</div></div>`}).join('')}</div>`;side()}
function resetExam(){if(!confirm('ล้างคำตอบ Medication Exam และเริ่มใหม่?'))return;S.exam={answers:{},order:[],submitted:false,score:null};save();examIntro()}home();
</script></body></html>
